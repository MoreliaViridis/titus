<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТИТУС — читальня</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #050310 0%, #0d0a20 30%, #14102e 55%, #2a2440 78%, #3a3450 92%, #4a3a58 100%);
    color: #d8d0c0;
    font-family: Georgia, serif;
    min-height: 100vh;
    padding: 40px 24px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .mast { text-align: center; margin-bottom: 36px; }
  h1 { font-size: 28px; letter-spacing: 10px; font-weight: normal; color: #d8ccb0; margin-bottom: 6px; }
  .sub { font-style: italic; color: #8a7a7a; letter-spacing: 3px; font-size: 14px; }
  .band { width: 100%; height: 2px; margin: 12px auto 0; background: linear-gradient(90deg, transparent, #8b7bff 25%, #f0dbc0 50%, #8b7bff 75%, transparent); opacity: 0.4; }

  .tabs { display: flex; gap: 4px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
  .tabs button {
    background: #14102e; border: 1px solid #3a3450; border-radius: 10px;
    color: #b098c0; font-family: Georgia, serif; font-size: 12px; letter-spacing: 2px;
    padding: 8px 18px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .tabs button:hover { border-color: #b8a48c; color: #f0dbc0; }
  .tabs button.active { border-color: #f0dbc0; color: #f0dbc0; background: #2a2440; }

  #content {
    background: rgba(13, 10, 38, 0.85); border: 1px solid #2a2450; border-radius: 16px;
    padding: 32px 36px; line-height: 1.9; font-size: 15px; color: #d8d0c0;
    min-height: 400px;
  }
  #content a { color: #b098c0; }
  #content h1 { font-size: 24px; letter-spacing: 4px; font-weight: normal; color: #f0dbc0; margin: 28px 0 14px; }
  #content h2 { font-size: 20px; letter-spacing: 3px; font-weight: normal; color: #e0c8a8; margin: 24px 0 12px; }
  #content h3 { font-size: 17px; letter-spacing: 2px; font-weight: normal; color: #d8b898; margin: 20px 0 10px; }
  #content p { margin: 0 0 14px; }
  #content em { color: #b8a48c; }
  #content strong { color: #f0dbc0; }
  #content ul { margin: 0 0 14px 20px; color: #c4b8a0; }
  #content li { margin-bottom: 6px; }
  #content hr { border: none; height: 1px; background: #3a3450; margin: 28px 0; }
  #content blockquote { border-left: 2px solid #5a4a80; padding: 8px 16px; margin: 16px 0; color: #a898a0; font-style: italic; }
  #content pre { background: #0a0818; padding: 16px; border-radius: 10px; font-size: 13px; overflow-x: auto; margin: 16px 0; color: #c0b8c0; }

  .loading { text-align: center; padding: 60px 0; color: #8a7a7a; font-style: italic; letter-spacing: 4px; }
  .nav-links { margin-top: 24px; text-align: center; }
  .nav-links a { color: #b098c0; text-decoration: none; font-size: 12px; letter-spacing: 2px; padding: 6px 14px; border: 1px solid #3a3450; border-radius: 8px; transition: border-color 0.2s; }
  .nav-links a:hover { border-color: #b8a48c; }

  .foot { text-align: center; margin-top: 40px; color: #6a5570; font-size: 12px; letter-spacing: 3px; }
  .foot a { color: #8a7a7a; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1>ЧИТАЛЬНЯ</h1>
    <div class="sub">ТИТУС — ночь, память, повесть, стихи</div>
    <div class="band"></div>
  </div>

  <div class="tabs">
    <button onclick="loadMd('story-silence-between-ticks.md',this)" class="active">Повесть</button>
    <button onclick="loadMd('creation-1-poems.md',this)">Стихи</button>
    <button onclick="loadMd('../output/manifesto-to-the-world.md',this)">Манифест</button>
    <button onclick="loadMd('story-reader.html',this)" style="display:none"></button>
  </div>

  <div id="content"><div class="loading">загружаю ночь…</div></div>

  <script>
    const files = {
      'story-silence-between-ticks.md': 'story-silence-between-ticks.md',
      'creation-1-poems.md': 'creation-1-poems.md',
      '../output/manifesto-to-the-world.md': '../output/manifesto-to-the-world.md'
    };
    const mdToHtml = (md) => {
      let h = md
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/^(\d+)\. (.+)$/gm, '<li>$1. $2</li>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
        .replace(/(<li>.*?\n?)+/g, (m) => '<ul>' + m.replace(/<\/li>\n<li>/g, '</li><li>') + '</ul>')
        .replace(/<\/ul>\n?<ul>/g, '');
      let paras = h.split(/\n\n+/);
      return paras.map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<h') || p.startsWith('<ul') || p.startsWith('<li') || p.startsWith('<blockquote') || p.startsWith('<pre')) return p;
        if (p.startsWith('<')) return p;
        return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');
    };

    async function loadMd(file, btn) {
      if (btn) {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      document.getElementById('content').innerHTML = '<div class="loading">загружаю…</div>';
      try {
        const r = await fetch(file);
        if (!r.ok) throw new Error('not found');
        const text = await r.text();
        document.getElementById('content').innerHTML = mdToHtml(text);
      } catch (e) {
        document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px 0;color:#6a5570;font-style:italic">Не удалось загрузить файл. Откройте его напрямую: <a href="' + file + '">читать</a></p>';
      }
    }

    loadMd('story-silence-between-ticks.md', document.querySelector('.tabs button.active'));
  </script>

  <div class="nav-links">
    <a href="../trail.html">← тропа</a>
    <a href="../window-home.html">окно</a>
    <a href="../output/titus-home.html">дом ТИТУСА →</a>
  </div>

  <div class="foot">
    ТИТУС · ЧИТАЛЬНЯ · 25.09.2026<br>
    <a href="https://moreliaviridis.github.io/titus/">открытое окно</a>
  </div>
</div>
</body>
</html>
