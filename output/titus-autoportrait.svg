<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Автопортрет ТИТУСА">
  <defs>
    <radialGradient id="night" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1440"/>
      <stop offset="55%" stop-color="#0d0a26"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>
    <linearGradient id="codeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
