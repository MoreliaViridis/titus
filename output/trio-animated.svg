<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Трое — живая картина">
  <defs>
    <linearGradient id="trio-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#120a05"/>
      <stop offset="30%" stop-color="#241409"/>
      <stop offset="48%" stop-color="#0d0a26"/>
      <stop offset="55%" stop-color="#1a1440"/>
      <stop offset="72%" stop-color="#4a1d52"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="lampT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT3" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.35"/><stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraT" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.5"/><stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow8"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
      @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.55; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { r: 5; opacity: 0.95; } 50% { r: 8; opacity: 0.65; } }
      @keyframes dashmove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -20; } }
      @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-14px); } }
      .star-w { animation: twinkle 3s ease-in-out infinite; }
      .star-w:nth-child(2n) { animation-duration: 4s; animation-delay: -1s; }
      .star-bg { animation: twinkle 5s ease-in-out infinite; }
      .ring-t { animation: spin 22s linear infinite; transform-origin: 300px 420px; }
      .pulse-smoke { animation: pulse 4s ease-in-out infinite; }
      .thread { stroke-dasharray: 3 7; animation: dashmove 6s linear infinite; }
      .lampglow { animation: breathe 6s ease-in-out infinite; }
      .cloud-t { animation: twinkle 6s ease-in-out infinite; }
      .steam { animation: steam 4s ease-in-out infinite; }
      .steam:nth-child(2) { animation-delay: -2s; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#trio-bg)"/>
  <g class="star-bg" opacity="0.6">
    <circle cx="80" cy="60" r="1.2" fill="#fff"/>
    <circle cx="220" cy="30" r="1" fill="#fff"/>
    <circle cx="400" cy="80" r="1.3" fill="#fff"/>
    <circle cx="600" cy="40" r="1" fill="#fff"/>
    <circle cx="800" cy="70" r="1.2" fill="#fff"/>
    <circle cx="1000" cy="30" r="1" fill="#fff"/>
    <circle cx="1120" cy="90" r="1.3" fill="#fff"/>
    <circle cx="700" cy="110" r="0.9" fill="#fff"/>
  </g>

  <g>
    <rect x="60" y="140" width="280" height="360" rx="12" fill="#2b1a0e"/>
    <rect x="76" y="156" width="248" height="320" fill="#0d0a26"/>
    <g>
      <circle class="star-w" cx="130" cy="200" r="1.4" fill="#fff"/>
      <circle class="star-w" cx="180" cy="180" r="1" fill="#fff"/>
      <circle class="star-w" cx="240" cy="220" r="1.3" fill="#fff"/>
      <circle class="star-w" cx="150" cy="270" r="1" fill="#fff"/>
      <circle class="star-w" cx="210" cy="300" r="1.2" fill="#fff"/>
      <circle class="star-w" cx="110" cy="330" r="0.9" fill="#fff"/>
      <circle class="star-w" cx="260" cy="360" r="1.1" fill="#fff"/>
      <circle class="star-w" cx="170" cy="400" r="1" fill="#fff"/>
      <circle class="star-w" cx="230" cy="140" r="1.2" fill="#fff"/>
