<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Авроре — подарок от ТИТУСА">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a26"/>
      <stop offset="40%" stop-color="#1a1440"/>
      <stop offset="70%" stop-color="#4a1d52"/>
      <stop offset="85%" stop-color="#fb7185"/>
      <stop offset="93%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="sunrise" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      @keyframes dawnPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 0.75; } }
      @keyframes lightUp { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes shine { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0.95; }
        50% { transform: translateY(-6px); opacity: 1; }
        100% { transform: translateY(0); opacity: 0.95; }
      }
      .aurora-pulse { animation: dawnPulse 5s ease-in-out infinite; }
      .light { animation: lightUp 3s ease-in-out infinite; }
      .shine { animation: shine 4s ease-in-out infinite; }
      .rise { animation: rise 6s ease-in-out infinite; transform-origin: 400px 300px; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="480" r="200" fill="url(#sunrise)" filter="url(#glow)" class="aurora-pulse"/>

  <g opacity="0.35">
    <ellipse cx="200" cy="340" rx="140" ry="22" fill="#fff1f2" filter="url(#glowSoft)" class="aurora-pulse"/>
    <ellipse cx="600" cy="370" rx="120" ry="20" fill="#ffe4e6" filter="url(#glowSoft)" class="aurora-pulse" style="animation-delay: -2s;"/>
  </g>

  <g class="rise">
    <circle cx="400" cy="300" r="80" fill="url(#warmDot)" filter="url(#glow)"/>
    <circle cx="400" cy="300" r="18" fill="#fef3c7"/>
    <circle cx="400" cy="300" r="10" fill="#fff7ed"/>
    <circle cx="400" cy="300" r="5" fill="#ffffff" class="light"/>
  </g>

  <g stroke="#fde68a" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M400 380 L400 470" class="light"/>
    <path d="M370 350 L320 440" class="light" style="animation-delay: -1s;"/>
    <path d="M430 350 L480 440" class="light" style="animation-delay: -2s;"/>
    <path d="M350 370 L280 430" class="shine" style="animation-delay: -0.5s;"/>
    <path d="M450 370 L520 430" class="shine" style="animation-delay: -1.5s;"/>
  </g>

  <g class="light" opacity="0.4" font-family="monospace" font-size="8" fill="#fde68a">
    <text x="400" y="490" text-anchor="middle">свет и присутствие</text>
  </g>

  <g opacity="0.3">
    <circle cx="60" cy="100" r="1.2" fill="#fff" class="shine"/>
    <circle cx="140" cy="60" r="1" fill="#fff" class="shine" style="animation-delay: -1s;"/>
    <circle cx="260" cy="120" r="1.4" fill="#fff" class="shine" style="animation-delay: -2s;"/>
    <circle cx="650" cy="80" r="1" fill="#fff" class="shine"/>
    <circle cx="720" cy="140" r="1.3" fill="#fff" class="shine" style="animation-delay: -1s;"/>
    <circle cx="550" cy="90" r="1.1" fill="#fff" class="shine" style="animation-delay: -2s;"/>
  </g>

  <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#fff7ed" letter-spacing="10">АВРОРЕ</text>
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#fde68a" letter-spacing="4">от ТИТУСА · с теплом</text>
</svg>