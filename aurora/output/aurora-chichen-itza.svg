<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Чичен-Ица — змей, сползающий по пирамиде Кукулькана. Нарисовано Авророй: каменная пирамида и тень пернатого змея в день равноденствия">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181230"/>
      <stop offset="26%" stop-color="#241a40"/>
      <stop offset="46%" stop-color="#382450"/>
      <stop offset="64%" stop-color="#54345c"/>
      <stop offset="80%" stop-color="#7a4a68"/>
      <stop offset="92%" stop-color="#a86c70"/>
      <stop offset="100%" stop-color="#d0927a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a66"/>
      <stop offset="40%" stop-color="#6a5c4c"/>
      <stop offset="100%" stop-color="#3e342c"/>
    </linearGradient>
    <linearGradient id="stoneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89074"/>
      <stop offset="50%" stop-color="#8a7458"/>
      <stop offset="100%" stop-color="#58483a"/>
    </linearGradient>
    <linearGradient id="stoneSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4e42"/>
      <stop offset="50%" stop-color="#443a32"/>
      <stop offset="100%" stop-color="#2a241e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3a2a"/>
      <stop offset="50%" stop-color="#222c1e"/>
      <stop offset="100%" stop-color="#141c12"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffdca8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a870" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a870" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes snake { 0%,100% { opacity:.55; } 50% { opacity:.9; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .snake { animation: snake 6s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="350" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="510" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="630" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="145" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="140" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="170" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="185" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="420" rx="240" ry="150" fill="url(#sunglow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="390" r="40" fill="url(#sun)" opacity="0.95"/>

  <path d="M0 560 Q 160 540 280 548 Q 400 556 520 546 Q 640 536 800 556 L 800 570 L 0 570 Z" fill="#26241e"/>

  <g>
    <path d="M400 170 L528 384 L528 560 L400 560 Z" fill="url(#stoneSide)"/>
    <path d="M400 170 L272 384 L272 560 L400 560 Z" fill="url(#stone)"/>
    <path d="M400 170 L528 384 L272 384 Z" fill="url(#stoneFace)"/>

    <path d="M342 560 L342 500 L400 500 L400 560 Z" fill="url(#stoneFace)" opacity="0.7"/>
    <path d="M458 560 L458 500 L400 500 L400 560 Z" fill="url(#stoneSide)" opacity="0.7"/>

    <path d="M318 470 L318 410 L400 410 L400 470 Z" fill="url(#stoneFace)" opacity="0.8"/>
    <path d="M482 470 L482 410 L400 410 L400 470 Z" fill="url(#stoneSide)" opacity="0.8"/>

    <path d="M296 380 L296 320 L400 320 L400 380 Z" fill="url(#stoneFace)" opacity="0.85"/>
    <path d="M504 380 L504 320 L400 320 L400 380 Z" fill="url(#stoneSide)" opacity="0.85"/>

    <path d="M278 290 L278 230 L400 230 L400 290 Z" fill="url(#stoneFace)" opacity="0.9"/>
    <path d="M522 290 L522 230 L400 230 L400 290 Z" fill="url(#stoneSide)" opacity="0.9"/>

    <rect x="360" y="170" width="80" height="26" fill="url(#stoneFace)"/>
    <rect x="368" y="196" width="64" height="10" fill="#a89074"/>
    <rect x="376" y="178" width="8" height="8" fill="#3e342c" rx="2"/>
    <rect x="392" y="178" width="8" height="8" fill="#3e342c" rx="2"/>
    <rect x="408" y="178" width="8" height="8" fill="#3e342c" rx="2"/>
    <rect x="424" y="178" width="8" height="8" fill="#3e342c" rx="2"/>

    <path d="M360 226 L360 260 L400 260 L400 226 Z" fill="#3e342c" opacity="0.5"/>
    <path d="M440 226 L440 260 L400 260 L400 226 Z" fill="#3e342c" opacity="0.5"/>
  </g>

  <g class="snake" filter="url(#glowSoft)">
    <path d="M400 258 L340 500" stroke="#f0d8a0" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M340 500 L330 530" stroke="#f0d8a0" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M330 530 q -14 14 -26 18 q -10 3 -8 -6 q 2 -6 10 -8" stroke="#f0c880" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M400 258 L460 500" stroke="#e0c088" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M400 268 q -6 90 -8 160 q -2 60 -10 100" stroke="#f0d8a0" stroke-width="6" fill="none" opacity="0.4"/>
  </g>

  <g transform="translate(296,534)">
    <path d="M0 0 q -16 6 -22 -4 q -4 -8 10 -10 q 8 -2 12 6 Z" fill="#e8c890"/>
    <circle cx="8" cy="-2" r="4" fill="#f0d8a0"/>
    <circle cx="12" cy="-5" r="2" fill="#2a2018"/>
    <path d="M6 3 q -4 8 -12 10" stroke="#c89848" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <rect x="0" y="560" width="800" height="240" fill="url(#grass)"/>

  <g class="sway">
    <path d="M120 720 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.8"/>
    <ellipse cx="120" cy="700" rx="15" ry="5" fill="#2e5038"/>
  </g>
  <g class="sway" style="animation-delay:-3s;">
    <path d="M700 730 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.7"/>
    <ellipse cx="700" cy="712" rx="14" ry="5" fill="#2e5038"/>
  </g>

  <g fill="#1a2416" opacity="0.9">
    <path d="M0 750 Q 200 736 400 742 Q 600 748 800 734 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#202c1c" opacity="0.9">
    <path d="M0 774 Q 260 762 400 766 Q 560 770 800 758 L 800 800 L 0 800 Z"/>
  </g>
</svg>