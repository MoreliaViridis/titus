<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Пещера Вайтомо — живое небо из света. Нарисовано Авророй: светящийся потолок пещеры, лодка на тёмной воде, тысячи огоньков">
  <defs>
    <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06070d"/>
      <stop offset="25%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f1220"/>
      <stop offset="70%" stop-color="#141828"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1420"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="glowStar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8ffe8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7ae8c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7ae8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a8e8ff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#58b8e8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58b8e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
      @keyframes shimmer { 0%,100% { opacity:.5; } 50% { opacity:.9; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .bob { animation: bob 7s ease-in-out infinite; }
      .shimmer { animation: shimmer 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#cave)"/>

  <path d="M0 0 Q 100 30 200 10 Q 350 -10 500 20 Q 650 45 800 0 L800 300 L0 300 Z" fill="#080a12" opacity="0.6"/>
  <path d="M0 300 Q 200 320 400 310 Q 600 300 800 320 L 800 500 L 0 500 Z" fill="#0c101c" opacity="0.7"/>

  <g filter="url(#glowBig)" opacity="0.8">
    <ellipse cx="220" cy="70" rx="90" ry="50" fill="url(#glowStar)"/>
    <ellipse cx="420" cy="40" rx="110" ry="55" fill="url(#glowBlue)"/>
    <ellipse cx="620" cy="80" rx="95" ry="48" fill="url(#glowStar)"/>
    <ellipse cx="330" cy="150" rx="85" ry="45" fill="url(#glowBlue)" style="animation-delay:-2s;"/>
    <ellipse cx="540" cy="120" rx="90" ry="50" fill="url(#glowStar)"/>
  </g>

  <g>
    <circle cx="180" cy="55" r="1.6" fill="#c8ffe8" filter="url(#glowTiny)"/>
    <circle cx="260" cy="40" r="1.8" fill="#8af0d0"/>
    <circle cx="220" cy="90" r="1.4" fill="#c8ffe8"/>
    <circle cx="300" cy="75" r="1.7" fill="#8af0d0"/>
    <circle cx="150" cy="85" r="1.3" fill="#c8ffe8"/>
    <circle cx="340" cy="55" r="1.9" fill="#a8e8ff"/>
    <circle cx="400" cy="30" r="1.5" fill="#78d8f8"/>
    <circle cx="460" cy="60" r="1.8" fill="#a8e8ff"/>
    <circle cx="380" cy="90" r="1.4" fill="#78d8f8"/>
    <circle cx="520" cy="45" r="1.7" fill="#c8ffe8"/>
    <circle cx="580" cy="70" r="1.5" fill="#8af0d0"/>
    <circle cx="640" cy="55" r="1.8" fill="#c8ffe8"/>
    <circle cx="660" cy="100" r="1.4" fill="#8af0d0"/>
    <circle cx="480" cy="100" r="1.6" fill="#c8ffe8"/>
    <circle cx="560" cy="115" r="1.5" fill="#78d8f8"/>
    <circle cx="430" cy="130" r="1.7" fill="#8af0d0"/>
    <circle cx="310" cy="140" r="1.5" fill="#c8ffe8"/>
    <circle cx="350" cy="170" r="1.6" fill="#78d8f8"/>
    <circle cx="520" cy="160" r="1.4" fill="#c8ffe8"/>
    <circle cx="590" cy="140" r="1.6" fill="#8af0d0"/>
    <circle cx="250" cy="120" r="1.5" fill="#a8e8ff"/>
    <circle cx="690" cy="140" r="1.5" fill="#78d8f8"/>
  </g>

  <g class="star">
    <circle cx="180" cy="55" r="1.2" fill="#e8ffd0"/>
    <circle cx="340" cy="55" r="1.4" fill="#d0f8e8"/>
    <circle cx="520" cy="45" r="1.2" fill="#e8ffd0" style="animation-delay:-1s;"/>
    <circle cx="640" cy="55" r="1.3" fill="#d0f8e8" style="animation-delay:-2s;"/>
    <circle cx="400" cy="30" r="1.1" fill="#e8ffd0" style="animation-delay:-3s;"/>
    <circle cx="460" cy="60" r="1.2" fill="#d0f8e8" style="animation-delay:-0.5s;"/>
    <circle cx="300" cy="75" r="1.1" fill="#e8ffd0" style="animation-delay:-1.5s;"/>
    <circle cx="580" cy="70" r="1.2" fill="#d0f8e8" style="animation-delay:-2.5s;"/>
    <circle cx="260" cy="40" r="1.1" fill="#e8ffd0" style="animation-delay:-3.5s;"/>
  </g>

  <g stroke="#3a5a6e" stroke-width="1.6" fill="none" class="shimmer" opacity="0.5">
    <path d="M120 240 q 30 -10 60 0 q 30 10 60 0"/>
    <path d="M300 260 q 30 -10 60 0 q 30 10 60 0" style="animation-delay:-2s;"/>
    <path d="M500 245 q 30 -10 60 0 q 30 10 60 0" style="animation-delay:-4s;"/>
  </g>

  <g class="shimmer" fill="#5888a8" opacity="0.35" filter="url(#glowSoft)">
    <ellipse cx="260" cy="520" rx="30" ry="6"/>
    <ellipse cx="500" cy="600" rx="36" ry="7"/>
    <ellipse cx="660" cy="560" rx="28" ry="6"/>
  </g>

  <rect x="0" y="480" width="800" height="320" fill="url(#water)"/>

  <g class="bob">
    <path d="M270 560 L530 560 L500 580 L300 580 Z" fill="#1a1614"/>
    <path d="M270 560 L530 560 L505 566 L295 566 Z" fill="#2a2420"/>
    <path d="M380 560 L380 540 L420 540 L420 560" fill="#241a16"/>
    <circle cx="400" cy="534" r="6" fill="#d8e8f0"/>
    <circle cx="400" cy="534" r="6" fill="#a8d8e8" opacity="0.4"/>
    <path d="M340 566 L340 572 M420 566 L420 572 M300 566 L300 572 M500 566 L500 572" stroke="#5a4a3a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="bob" style="animation-delay:-3s;" stroke="#68a8c8" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <path d="M300 582 L398 580 M402 580 L500 582 M340 585 L400 583 M400 583 L460 585"/>
  </g>

  <g class="shimmer" stroke="#58b8e8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M160 640 q 60 -8 120 0 q 60 8 120 0 q 60 -8 120 0 q 60 8 120 0"/>
    <path d="M240 700 q 80 -8 160 0 q 80 8 160 0" style="animation-delay:-3s;"/>
    <path d="M300 740 q 60 -8 120 0 q 60 8 120 0" style="animation-delay:-5s;"/>
  </g>

  <g fill="#080c14" opacity="0.9">
    <path d="M0 760 Q 200 750 400 756 Q 600 762 800 750 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#0a1018" opacity="0.85">
    <path d="M0 786 Q 260 776 400 780 Q 560 784 800 774 L 800 800 L 0 800 Z"/>
  </g>
</svg>