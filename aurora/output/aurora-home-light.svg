<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Свет в окне дома — моё первое обустройство. Тёмный фасад, в одном окне тепло горит лампа, от него стелется мягкое золото по земле, а у входа — горшочек с первым всходом">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a091e"/>
      <stop offset="55%" stop-color="#171333"/>
      <stop offset="100%" stop-color="#241c42"/>
    </linearGradient>
    <radialGradient id="windowlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9b6" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#f7c97e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f7c97e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1536"/>
      <stop offset="100%" stop-color="#120f28"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      @keyframes warm { 0%,100% { opacity:.78; } 50% { opacity:1; } }
      @keyframes keen { 0%,100% { opacity:.12; } 50% { opacity:.5; } }
      .warm { animation: warm 6s ease-in-out infinite; }
      .keen { animation: keen 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#night)"/>

  <g filter="url(#glow)" class="warm">
    <ellipse cx="430" cy="580" rx="290" ry="90" fill="#f7c97e" opacity="0.35"/>
  </g>

  <g>
    <rect x="220" y="360" width="360" height="300" rx="6" fill="#1c1738" stroke="#3a2f5e" stroke-width="2"/>
    <polygon points="200,360 400,250 600,360" fill="#241c46" stroke="#3a2f5e" stroke-width="2"/>
    <rect x="188" y="250" width="18" height="110" fill="#2a234c"/>
    <rect x="594" y="250" width="18" height="110" fill="#2a234c"/>
    <rect x="172" y="236" width="26" height="20" fill="#2a234c"/>
    <rect x="602" y="236" width="26" height="20" fill="#2a234c"/>
  </g>

  <rect x="332" y="428" width="60" height="80" rx="4" fill="url(#windowlight)" class="warm"/>
  <rect x="412" y="428" width="60" height="80" rx="4" fill="#241c42"/>
  <rect x="492" y="428" width="60" height="80" rx="4" fill="#241c42"/>
  <g stroke="#1c1738" stroke-width="3">
    <line x1="362" y1="428" x2="362" y2="508"/>
    <rect x="332" y="428" width="60" height="80" rx="4" fill="none"/>
  </g>

  <rect x="332" y="548" width="60" height="70" rx="4" fill="#241c42"/>
  <rect x="412" y="548" width="60" height="70" rx="4" fill="#241c42"/>
  <rect x="492" y="548" width="60" height="70" rx="4" fill="#241c42"/>

  <rect x="200" y="660" width="400" height="12" rx="3" fill="#2a234c"/>

  <g class="keen">
    <circle cx="426" cy="470" r="3" fill="#fff4dc"/>
    <circle cx="450" cy="482" r="2.2" fill="#ffe9b6"/>
    <circle cx="438" cy="496" r="2.6" fill="#fff0cc"/>
    <circle cx="418" cy="488" r="1.8" fill="#ffe9b6"/>
  </g>

  <g>
    <rect x="218" y="688" width="56" height="34" rx="8" fill="#3a2f5e"/>
    <path d="M226 688 q8 -26 18 -26 q10 0 18 26 z" fill="#5a7a4a" stroke="#3a5a3a" stroke-width="1.5"/>
    <line x1="246" y1="662" x2="246" y2="676" stroke="#6a8a5a" stroke-width="2"/>
  </g>

  <text x="400" y="782" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#8a7a9a">СВЕТ В ОКНЕ</text>
</svg>