<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Соляное зеркало — Салар-де-Уюни, нарисованный Авророй: два неба, одно вверху, одно внизу, и свет между ними">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="32%" stop-color="#16233f"/>
      <stop offset="55%" stop-color="#243558"/>
      <stop offset="72%" stop-color="#40527a"/>
      <stop offset="86%" stop-color="#7d8fb0"/>
      <stop offset="95%" stop-color="#c3b9b0"/>
      <stop offset="100%" stop-color="#e8c9a0"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c9a0"/>
      <stop offset="8%" stop-color="#c3b9b0"/>
      <stop offset="22%" stop-color="#7d8fb0"/>
      <stop offset="45%" stop-color="#40527a"/>
      <stop offset="68%" stop-color="#243558"/>
      <stop offset="100%" stop-color="#16233f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="55%" stop-color="#ffe6b0"/>
      <stop offset="100%" stop-color="#ffd08f"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffd795" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd795" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffd795" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd795" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="phosphor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eff7ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eff7ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.18; } 50% { opacity:.85; } }
      @keyframes shimmer { 0%,100% { opacity:.4; transform:translateX(0); } 50% { opacity:.75; transform:translateX(10px); } }
      @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.6; } }
      @keyframes bird { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .glow { animation: breathe 7s ease-in-out infinite; }
      .bird { animation: bird 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="url(#sky)"/>

  <g fill="#dfe9f5">
    <circle cx="70" cy="80" r="1.5" class="star"/>
    <circle cx="160" cy="50" r="1.1" class="star" style="animation-delay:-1s;"/>
    <circle cx="260" cy="110" r="1.3" class="star" style="animation-delay:-2s;"/>
    <circle cx="370" cy="60" r="1" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="500" cy="120" r="1.4" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="610" cy="70" r="1.1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="700" cy="140" r="1.3" class="star" style="animation-delay:-3s;"/>
    <circle cx="120" cy="180" r="1" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="190" r="1" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="230" cy="230" r="0.9" class="star" style="animation-delay:-3.4s;"/>
    <circle cx="650" cy="240" r="0.9" class="star" style="animation-delay:-0.8s;"/>
  </g>

  <g class="bird" stroke="#d8e2f0" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 290 q15 -12 30 0 q15 12 30 0" opacity="0.55"/>
    <path d="M620 270 q13 -10 26 0 q13 10 26 0" opacity="0.45"/>
  </g>

  <ellipse cx="400" cy="352" rx="170" ry="120" fill="url(#sunglow)" class="glow" filter="url(#glowBig)"/>

  <circle cx="400" cy="356" r="62" fill="url(#sun)" opacity="0.98"/>
  <circle cx="400" cy="356" r="80" fill="none" stroke="#ffe9b8" stroke-width="2" opacity="0.25"/>

  <rect x="0" y="400" width="800" height="400" fill="url(#mirror)"/>

  <circle cx="400" cy="452" r="52" fill="url(#sun)" opacity="0.5"/>
  <ellipse cx="400" cy="452" rx="150" ry="80" fill="url(#sunglow)" opacity="0.5" filter="url(#glowBig)"/>

  <g stroke="#ffe9b8" stroke-linecap="round" fill="none" class="shimmer">
    <path d="M300 480 h200" stroke-width="3" opacity="0.5"/>
    <path d="M330 510 h140" stroke-width="2.5" opacity="0.35"/>
    <path d="M360 540 h80" stroke-width="2" opacity="0.25"/>
    <path d="M320 470 h160" stroke-width="2" opacity="0.3"/>
    <path d="M340 500 h120" stroke-width="2" opacity="0.2"/>
  </g>

  <g stroke="#dfe9f5" stroke-linecap="round" fill="none" class="shimmer" style="animation-delay:-3s;">
    <path d="M120 460 h90" stroke-width="2" opacity="0.3"/>
    <path d="M560 490 h100" stroke-width="2" opacity="0.25"/>
    <path d="M160 530 h70" stroke-width="1.6" opacity="0.2"/>
  </g>

  <rect x="0" y="396" width="800" height="5" fill="url(#phosphor)" filter="url(#glowSoft)"/>

  <g fill="#0d1326" opacity="0.6">
    <ellipse cx="178" cy="462" rx="30" ry="9"/>
    <ellipse cx="178" cy="456" rx="26" ry="8"/>
    <ellipse cx="178" cy="450" rx="21" ry="7"/>
  </g>
</svg>