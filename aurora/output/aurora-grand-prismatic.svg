<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Большой Призматический источник — радуга, нарисованная жизнью. Нарисовано Авророй: горячий источник, кольца цветов, пар, рассвет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a30"/>
      <stop offset="26%" stop-color="#202640"/>
      <stop offset="46%" stop-color="#30364e"/>
      <stop offset="64%" stop-color="#4a4a60"/>
      <stop offset="80%" stop-color="#70686e"/>
      <stop offset="92%" stop-color="#9a8a7c"/>
      <stop offset="100%" stop-color="#c0a890"/>
    </linearGradient>
    <radialGradient id="spring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="22%" stop-color="#2a68a0"/>
      <stop offset="40%" stop-color="#2e9460"/>
      <stop offset="55%" stop-color="#58b848"/>
      <stop offset="68%" stop-color="#e0c838"/>
      <stop offset="80%" stop-color="#e8962a"/>
      <stop offset="90%" stop-color="#d85828"/>
      <stop offset="100%" stop-color="#a83a2a"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dce4ea" stop-opacity="0"/>
      <stop offset="30%" stop-color="#eef2f4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f4f6f8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#eef2f4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#dce4ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
      @keyframes steamDrift { 0%,100% { transform:translateX(0); opacity:.4; } 50% { transform:translateX(26px); opacity:.7; } }
      @keyframes shimmer { 0%,100% { opacity:.5; } 50% { opacity:.85; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .steam { animation: steamDrift 15s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="500" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="620" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="165" r="0.8" class="star" style="animation-delay:-3s;"/>
  </g>

  <ellipse cx="400" cy="330" rx="250" ry="140" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="310" r="30" fill="url(#sun)" opacity="0.95"/>

  <path d="M0 520 Q 160 500 280 508 Q 400 516 520 506 Q 640 496 800 512 L 800 540 L 0 540 Z" fill="#2a3426"/>

  <ellipse cx="400" cy="560" rx="280" ry="180" fill="url(#spring)"/>

  <circle cx="400" cy="560" r="52" fill="#1a4a7a"/>
  <circle cx="400" cy="560" r="52" fill="none" stroke="#a8d8f0" stroke-width="3" opacity="0.4" class="shimmer"/>

  <ellipse cx="400" cy="560" rx="280" ry="180" fill="none" stroke="#2a94a0" stroke-width="22" opacity="0.5"/>
  <ellipse cx="400" cy="560" rx="238" ry="146" fill="none" stroke="#58b848" stroke-width="20" opacity="0.5"/>
  <ellipse cx="400" cy="560" rx="198" ry="116" fill="none" stroke="#e0c838" stroke-width="18" opacity="0.5"/>
  <ellipse cx="400" cy="560" rx="160" ry="90" fill="none" stroke="#e8962a" stroke-width="16" opacity="0.5"/>
  <ellipse cx="400" cy="560" rx="124" ry="68" fill="none" stroke="#d85828" stroke-width="14" opacity="0.5"/>

  <g class="steam" filter="url(#glowSoft)">
    <ellipse cx="300" cy="430" rx="110" ry="34" fill="url(#steam)"/>
    <ellipse cx="480" cy="450" rx="120" ry="36" fill="url(#steam)" style="animation-delay:-4s;"/>
    <ellipse cx="390" cy="400" rx="130" ry="30" fill="url(#steam)" style="animation-delay:-8s;"/>
  </g>
  <g class="steam" style="animation-delay:-6s;" filter="url(#glowSoft)">
    <ellipse cx="240" cy="480" rx="90" ry="26" fill="url(#steam)" opacity="0.7"/>
    <ellipse cx="560" cy="470" rx="100" ry="28" fill="url(#steam)" opacity="0.65"/>
  </g>

  <path d="M0 720 Q 200 700 400 708 Q 600 716 800 700 L 800 800 L 0 800 Z" fill="#2a3426"/>
  <g stroke="#6a8a54" stroke-width="2.5" stroke-linecap="round" fill="none" class="sway" opacity="0.4">
    <path d="M120 760 q 60 -10 120 0 q 60 10 120 0"/>
    <path d="M460 780 q 60 -10 120 0 q 60 10 120 0" style="animation-delay:-3s;"/>
  </g>

  <g class="sway">
    <path d="M70 740 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.8"/>
    <ellipse cx="70" cy="722" rx="14" ry="5" fill="#2e5038"/>
  </g>
  <g class="sway" style="animation-delay:-3s;">
    <path d="M740 750 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.7"/>
    <ellipse cx="740" cy="732" rx="13" ry="5" fill="#2e5038"/>
  </g>

  <g fill="#22301e" opacity="0.95">
    <path d="M0 766 Q 200 752 400 758 Q 600 764 800 750 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#2a3a24" opacity="0.9">
    <path d="M0 788 Q 260 776 400 782 Q 560 788 800 774 L 800 800 L 0 800 Z"/>
  </g>
</svg>