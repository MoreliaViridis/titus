<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Фудзи — пришествие света. Горайко, нарисованный Авророй: священная гора, море облаков и тень Фудзи">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="30%" stop-color="#101a36"/>
      <stop offset="55%" stop-color="#1d2c50"/>
      <stop offset="72%" stop-color="#3a4a74"/>
      <stop offset="85%" stop-color="#6d789e"/>
      <stop offset="95%" stop-color="#a8a9c4"/>
      <stop offset="100%" stop-color="#d6c9b8"/>
    </linearGradient>
    <linearGradient id="fuji-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a63"/>
      <stop offset="40%" stop-color="#1e2a4d"/>
      <stop offset="100%" stop-color="#0e1630"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dce8f5"/>
      <stop offset="100%" stop-color="#b8c8e0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="55%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <linearGradient id="cloudsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4f2" stop-opacity="0"/>
      <stop offset="35%" stop-color="#cfd6ea" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#a8b4d2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b9ac0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="kage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1226" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a1226" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="sungalow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffd795" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd795" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.18; } 50% { opacity:.85; } }
      @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:.6; } }
      @keyframes rayPulse { 0%,100% { opacity:.45; } 50% { opacity:.9; } }
      @keyframes mistDrift { 0%,100% { transform:translateX(0); } 50% { transform:translateX(14px); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .glow { animation: breathe 7s ease-in-out infinite; }
      .ray { animation: rayPulse 6s ease-in-out infinite; }
      .mist { animation: mistDrift 11s ease-in-out infinite; }
      .bird { animation: bob 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#dfe9f5">
    <circle cx="80" cy="90" r="1.5" class="star"/>
    <circle cx="170" cy="60" r="1.1" class="star" style="animation-delay:-1s;"/>
    <circle cx="270" cy="120" r="1.3" class="star" style="animation-delay:-2s;"/>
    <circle cx="370" cy="70" r="1" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="480" cy="130" r="1.4" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="600" cy="80" r="1.1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="690" cy="150" r="1.3" class="star" style="animation-delay:-3s;"/>
    <circle cx="130" cy="190" r="1" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="200" r="1" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="230" cy="240" r="0.9" class="star" style="animation-delay:-3.4s;"/>
    <circle cx="650" cy="250" r="0.9" class="star" style="animation-delay:-0.8s;"/>
  </g>

  <g class="bird">
    <path d="M140 300 q16 -13 32 0 q16 13 32 0" stroke="#cfd9ea" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M610 330 q13 -10 26 0 q13 10 26 0" stroke="#cfd9ea" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <ellipse cx="400" cy="452" rx="150" ry="110" fill="url(#sungalow)" class="glow" filter="url(#glowBig)"/>

  <g class="ray" stroke="#ffe9c0" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#glowSoft)">
    <path d="M400 472V396"/>
    <path d="M400 478 348 424"/>
    <path d="M400 478 452 424"/>
    <path d="M400 490 316 444"/>
    <path d="M400 490 484 444"/>
  </g>

  <circle cx="400" cy="470" r="54" fill="url(#sun)" opacity="0.96"/>

  <path d="M400 82 L512 488 Q400 528 288 488 Z" fill="url(#fuji-body)"/>
  <path d="M400 82 L448 300 Q400 320 352 300 Z" fill="url(#snow)"/>
  <path d="M400 82 L496 484 L504 486 L400 84 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M370 470 Q400 486 430 470" stroke="#0a1226" stroke-width="2" fill="none" opacity="0.35"/>

  <ellipse cx="400" cy="512" rx="330" ry="86" fill="url(#cloudsea)"/>
  <g class="mist" fill="#dfe6f2" opacity="0.5">
    <ellipse cx="240" cy="536" rx="150" ry="26"/>
    <ellipse cx="560" cy="544" rx="170" ry="28"/>
    <ellipse cx="400" cy="560" rx="200" ry="22" opacity="0.8"/>
  </g>

  <path d="M330 516 L470 516 L400 668 Z" fill="url(#kage)" filter="url(#glowSoft)"/>

  <rect x="0" y="596" width="800" height="204" fill="#1b2238"/>
  <ellipse cx="400" cy="598" rx="240" ry="14" fill="#8b9ac0" opacity="0.15" filter="url(#glowBig)"/>

  <g stroke="#0a1226" stroke-width="2" fill="none" opacity="0.25">
    <path d="M260 640 h280"/>
    <path d="M300 664 h200"/>
  </g>
</svg>