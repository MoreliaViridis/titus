<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Фаросский маяк — первое имя света. Нарисовано Авророй: маяк Александрии на рассвете, море и огонь на вершине">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1022"/>
      <stop offset="22%" stop-color="#141c36"/>
      <stop offset="40%" stop-color="#222a4a"/>
      <stop offset="56%" stop-color="#3a3a5e"/>
      <stop offset="70%" stop-color="#5a4e6e"/>
      <stop offset="82%" stop-color="#806670"/>
      <stop offset="92%" stop-color="#aa8268"/>
      <stop offset="100%" stop-color="#ce9e76"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a48"/>
      <stop offset="40%" stop-color="#142e3a"/>
      <stop offset="100%" stop-color="#0c1c26"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d0c8"/>
      <stop offset="35%" stop-color="#bebaa8"/>
      <stop offset="70%" stop-color="#a09888"/>
      <stop offset="100%" stop-color="#7a7266"/>
    </linearGradient>
    <linearGradient id="stoneShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98948a"/>
      <stop offset="50%" stop-color="#7a7a6e"/>
      <stop offset="100%" stop-color="#56564a"/>
    </linearGradient>
    <linearGradient id="stoneLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="50%" stop-color="#d4c8b0"/>
      <stop offset="100%" stop-color="#b0a48e"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b0a0"/>
      <stop offset="100%" stop-color="#787064"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff0c0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f0a050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0a050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffdcb0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#e09868" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e09868" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes flame { 0%,100% { opacity:.7; } 50% { opacity:1; } }
      @keyframes shimmer { 0%,100% { opacity:.4; } 50% { opacity:.8; } }
      @keyframes beam { 0%,100% { opacity:.4; } 50% { opacity:.85; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .flame { animation: flame 5s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .beam { animation: beam 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star"/>
    <circle cx="560" cy="130" r="0.8" class="star"/>
  </g>

  <ellipse cx="400" cy="460" rx="220" ry="140" fill="url(#sunGlow)" filter="url(#glowBig)"/>

  <rect x="0" y="520" width="800" height="280" fill="url(#sea)"/>
  <ellipse cx="400" cy="560" rx="340" ry="60" fill="#285870" class="shimmer" filter="url(#glowBig)"/>

  <g class="shimmer" stroke="#3a7a8e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M140 600 q 60 -10 120 0 q 60 10 120 0 q 60 -10 120 0 q 60 10 120 0"/>
    <path d="M200 660 q 80 -10 160 0 q 80 10 160 0 q 80 -10 160 0" style="animation-delay:-3s;"/>
  </g>

  <g>
    <rect x="280" y="510" width="240" height="40" fill="url(#base)" rx="6"/>
    <rect x="300" y="480" width="200" height="34" fill="url(#stone)" rx="4"/>

    <path d="M320 430 L480 430 L475 480 L325 480 Z" fill="url(#stoneLit)"/>
    <path d="M320 430 L400 430 L400 480 L325 480 Z" fill="url(#stoneShade)" opacity="0.6"/>

    <path d="M340 360 L460 360 L458 430 L342 430 Z" fill="url(#stone)"/>
    <path d="M340 360 L400 360 L400 430 L342 430 Z" fill="url(#stoneShade)" opacity="0.5"/>

    <path d="M356 300 L444 300 L442 360 L358 360 Z" fill="url(#stoneLit)"/>
    <path d="M356 300 L400 300 L400 360 L358 360 Z" fill="url(#stoneShade)" opacity="0.5"/>

    <path d="M368 250 L432 250 L430 300 L370 300 Z" fill="url(#stone)"/>
    <path d="M368 250 L400 250 L400 300 L370 300 Z" fill="url(#stoneShade)" opacity="0.5"/>

    <path d="M376 210 L424 210 L422 250 L378 250 Z" fill="url(#stoneLit)"/>

    <path d="M384 180 L416 180 L414 210 L386 210 Z" fill="url(#stone)"/>
  </g>

  <g class="flame" filter="url(#glowBig)">
    <circle cx="400" cy="172" r="26" fill="url(#flameGlow)"/>
  </g>
  <g class="flame" filter="url(#glowSoft)">
    <ellipse cx="400" cy="172" rx="14" ry="20" fill="#fff0c0"/>
    <ellipse cx="400" cy="172" rx="7" ry="12" fill="#fff8e0"/>
  </g>

  <g class="beam" filter="url(#glowSoft)">
    <path d="M400 172 L280 200 L270 220 Z" fill="#fff8dc" opacity="0.3"/>
    <path d="M400 172 L520 200 L530 220 Z" fill="#fff8dc" opacity="0.25"/>
    <path d="M400 172 L320 280 L310 300 Z" fill="#fff8dc" opacity="0.15"/>
    <path d="M400 172 L480 280 L490 300 Z" fill="#fff8dc" opacity="0.12"/>
  </g>

  <g stroke="#b0a48e" stroke-width="2" stroke-linecap="round" fill="none" class="shimmer" opacity="0.6">
    <path d="M286 510 h28 M290 514 h24 M294 518 h16"/>
    <path d="M486 510 h28 M482 514 h24 M478 518 h16"/>
  </g>

  <g fill="#0c1c26" opacity="0.9">
    <path d="M0 740 Q 200 728 400 734 Q 600 740 800 726 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#102430" opacity="0.85">
    <path d="M0 770 Q 260 758 400 762 Q 560 766 800 754 L 800 800 L 0 800 Z"/>
  </g>
</svg>