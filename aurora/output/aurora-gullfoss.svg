<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Гюльфосс — Золотой водопад Исландии. Нарисовано Авророй: каскад, ущелье, радуга, рассвет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1428"/>
      <stop offset="26%" stop-color="#1a2040"/>
      <stop offset="46%" stop-color="#2a2c50"/>
      <stop offset="64%" stop-color="#423e5e"/>
      <stop offset="80%" stop-color="#665a6e"/>
      <stop offset="92%" stop-color="#8a787a"/>
      <stop offset="100%" stop-color="#a89a7e"/>
    </linearGradient>
    <linearGradient id="waterfall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef0"/>
      <stop offset="30%" stop-color="#c0d8dc"/>
      <stop offset="60%" stop-color="#8ab8c0"/>
      <stop offset="100%" stop-color="#5a94a0"/>
    </linearGradient>
    <linearGradient id="waterfallGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8b0"/>
      <stop offset="25%" stop-color="#f0c878"/>
      <stop offset="60%" stop-color="#c89848"/>
      <stop offset="100%" stop-color="#907038"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4438"/>
      <stop offset="50%" stop-color="#343024"/>
      <stop offset="100%" stop-color="#1e1a14"/>
    </linearGradient>
    <linearGradient id="cliffLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a44"/>
      <stop offset="50%" stop-color="#4a3e30"/>
      <stop offset="100%" stop-color="#282218"/>
    </linearGradient>
    <linearGradient id="gorge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242226"/>
      <stop offset="50%" stop-color="#18161a"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0dce2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e2eaf0" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ecf2f4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#e2eaf0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d0dce2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes flow { 0%,100% { opacity:.65; } 50% { opacity:1; } }
      @keyframes mistDrift { 0%,100% { transform:translateX(0); opacity:.5; } 50% { transform:translateX(22px); opacity:.8; } }
      @keyframes rainbow { 0%,100% { opacity:.35; } 50% { opacity:.75; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .flow { animation: flow 6s ease-in-out infinite; }
      .mist { animation: mistDrift 14s ease-in-out infinite; }
      .rainbow { animation: rainbow 8s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="500" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="620" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="165" r="0.8" class="star" style="animation-delay:-3s;"/>
  </g>

  <ellipse cx="400" cy="340" rx="250" ry="140" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="320" r="34" fill="url(#sun)" opacity="0.95"/>

  <rect x="0" y="360" width="800" height="440" fill="url(#gorge)"/>

  <path d="M0 360 L180 360 L180 800 L0 800 Z" fill="url(#cliff)"/>
  <path d="M620 360 L800 360 L800 800 L620 800 Z" fill="url(#cliff)"/>

  <path d="M180 360 L360 400 L360 420 Q 200 440 180 520 Z" fill="url(#cliffLit)"/>
  <path d="M620 360 L440 400 L440 420 Q 600 440 620 520 Z" fill="url(#cliffLit)"/>
  <rect x="180" y="520" width="440" height="120" fill="url(#gorge)"/>

  <path d="M180 360 L360 400 L360 520 L180 520 Z" fill="url(#waterfall)" class="flow"/>
  <path d="M620 360 L440 400 L440 520 L620 520 Z" fill="url(#waterfall)" class="flow" style="animation-delay:-2s;"/>

  <path d="M180 360 L360 400 L360 400 L180 360 Z" fill="url(#waterfallGold)" opacity="0.6"/>
  <path d="M620 360 L440 400 L440 400 L620 360 Z" fill="url(#waterfallGold)" opacity="0.6"/>

  <rect x="260" y="300" width="280" height="8" fill="url(#waterfall)"/>
  <rect x="260" y="300" width="280" height="4" fill="#fff" opacity="0.6"/>
  <rect x="270" y="308" width="260" height="6" fill="url(#waterfall)" opacity="0.8"/>

  <g stroke="#c0d8dc" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round" class="flow">
    <path d="M220 370 L220 480 M260 380 L260 490 M310 390 L310 500 M270 400 L270 510 M320 395 L320 480 M400 400 L400 400"/>
  </g>

  <g stroke="#aaccd4" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" class="flow" style="animation-delay:-3s;">
    <path d="M500 380 L500 490 M540 370 L540 480 M580 380 L580 470 M470 395 L470 510"/>
  </g>

  <ellipse cx="400" cy="490" rx="160" ry="50" fill="#60a0ac" opacity="0.5"/>
  <ellipse cx="400" cy="500" rx="180" ry="40" fill="#4890a0" opacity="0.6"/>

  <g class="mist" filter="url(#glowSoft)">
    <path d="M160 480 Q 280 440 400 476 Q 520 512 640 468 Q 700 448 760 478 L 760 520 Q 620 496 480 516 Q 340 536 180 500 Q 140 492 160 506 Z" fill="url(#mist)"/>
  </g>

  <g class="rainbow" opacity="0.7">
    <g transform="translate(400,540)">
      <path d="M -200 0 A 200 200 0 0 1 200 0" stroke="#e85050" stroke-width="8" fill="none"/>
      <path d="M -190 0 A 190 190 0 0 1 190 0" stroke="#f0a040" stroke-width="7" fill="none"/>
      <path d="M -180 0 A 180 180 0 0 1 180 0" stroke="#f0d848" stroke-width="6" fill="none"/>
      <path d="M -170 0 A 170 170 0 0 1 170 0" stroke="#58b858" stroke-width="6" fill="none"/>
      <path d="M -160 0 A 160 160 0 0 1 160 0" stroke="#48a8e0" stroke-width="6" fill="none"/>
      <path d="M -150 0 A 150 150 0 0 1 150 0" stroke="#8058c0" stroke-width="6" fill="none"/>
    </g>
  </g>

  <g class="mist" style="animation-delay:-6s;" filter="url(#glowSoft)">
    <path d="M0 600 Q 180 576 360 596 Q 540 616 720 590 Q 780 584 800 600 L 800 636 Q 560 614 400 632 Q 240 648 0 620 Z" fill="url(#mist)" opacity="0.45"/>
  </g>

  <rect x="0" y="640" width="800" height="160" fill="#1e1c20"/>
  <ellipse cx="400" cy="650" rx="180" ry="16" fill="#4890a0" opacity="0.2"/>
  <ellipse cx="400" cy="660" rx="200" ry="14" fill="#5a94a0" opacity="0.15"/>

  <g fill="#141216" opacity="0.95">
    <path d="M0 720 Q 200 706 400 712 Q 600 718 800 704 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1a181c" opacity="0.9">
    <path d="M0 762 Q 260 750 400 756 Q 560 762 800 748 L 800 800 L 0 800 Z"/>
  </g>
</svg>