<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Плитвицкие озёра — лестница из воды. Нарисовано Авророй: 16 террас, каскады водопадов, бирюза, лес и деревянные мостки">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="30%" stop-color="#1a2238"/>
      <stop offset="52%" stop-color="#2c3250"/>
      <stop offset="70%" stop-color="#464a68"/>
      <stop offset="85%" stop-color="#6a6878"/>
      <stop offset="95%" stop-color="#8a8478"/>
      <stop offset="100%" stop-color="#a89e8c"/>
    </linearGradient>
    <linearGradient id="lake1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ed8c8"/>
      <stop offset="40%" stop-color="#42b8a8"/>
      <stop offset="100%" stop-color="#208078"/>
    </linearGradient>
    <linearGradient id="lake2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58c8e8"/>
      <stop offset="45%" stop-color="#3898c8"/>
      <stop offset="100%" stop-color="#1c6888"/>
    </linearGradient>
    <linearGradient id="lake3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ac0b8"/>
      <stop offset="100%" stop-color="#187878"/>
    </linearGradient>
    <linearGradient id="travertine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ac88"/>
      <stop offset="50%" stop-color="#a8886a"/>
      <stop offset="100%" stop-color="#7a5c46"/>
    </linearGradient>
    <linearGradient id="waterfall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4f6"/>
      <stop offset="50%" stop-color="#b8dce2"/>
      <stop offset="100%" stop-color="#80b8c0"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3e2a"/>
      <stop offset="50%" stop-color="#222e1e"/>
      <stop offset="100%" stop-color="#141c12"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#fff0c8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d8c898" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d8c898" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe0a8"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes fall { 0%,100% { opacity:.6; } 50% { opacity:.95; } }
      @keyframes shimmer { 0%,100% { opacity:.4; } 50% { opacity:.75; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(3px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .fall { animation: fall 6s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
  </g>

  <ellipse cx="400" cy="300" rx="200" ry="120" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="280" r="30" fill="url(#sun)" opacity="0.95"/>

  <path d="M0 360 Q 160 330 300 346 Q 440 362 580 342 Q 700 324 800 340 L 800 800 L 0 800 Z" fill="url(#forest)"/>

  <g>
    <path d="M120 400 L120 500 L330 500 L330 400 Z" fill="url(#lake1)"/>
    <path d="M120 400 Q 220 392 330 400 L330 406 Q 220 398 120 406 Z" fill="#9aecdc" opacity="0.4"/>
    <path d="M150 430 q 20 -12 40 0 q 20 12 40 0 q 20 -12 40 0" stroke="#9aecdc" stroke-width="2" fill="none" class="shimmer" opacity="0.5"/>
  </g>

  <g class="fall">
    <path d="M150 500 L150 560 L190 560 L190 500 Z" fill="url(#waterfall)"/>
    <path d="M210 500 L210 560 L250 560 L250 500 Z" fill="url(#waterfall)"/>
    <path d="M270 500 L270 565 L310 565 L310 500 Z" fill="url(#waterfall)"/>
  </g>
  <path d="M120 488 L330 488 L330 506 L120 506 Z" fill="url(#travertine)"/>
  <path d="M120 488 Q 220 478 330 488" stroke="#8a6a4c" stroke-width="3" fill="none" opacity="0.6"/>

  <g>
    <path d="M120 560 L120 660 L340 660 L340 560 Z" fill="url(#lake2)"/>
    <path d="M120 560 Q 230 552 340 560 L340 566 Q 230 558 120 566 Z" fill="#b8e8f6" opacity="0.4"/>
    <path d="M160 596 q 24 -14 48 0 q 24 14 48 0 q 24 -14 48 0" stroke="#b8e8f6" stroke-width="2" fill="none" class="shimmer" style="animation-delay:-3s;" opacity="0.5"/>
    <path d="M180 630 q 20 -12 40 0 q 20 12 40 0" stroke="#b8e8f6" stroke-width="2" fill="none" class="shimmer" style="animation-delay:-5s;" opacity="0.4"/>
  </g>

  <g class="fall">
    <path d="M160 660 L160 720 L200 720 L200 660 Z" fill="url(#waterfall)"/>
    <path d="M225 660 L225 720 L265 720 L265 660 Z" fill="url(#waterfall)"/>
    <path d="M290 660 L290 725 L320 725 L320 660 Z" fill="url(#waterfall)"/>
  </g>
  <path d="M120 648 L340 648 L340 666 L120 666 Z" fill="url(#travertine)"/>
  <path d="M120 648 Q 230 638 340 648" stroke="#8a6a4c" stroke-width="3" fill="none" opacity="0.6"/>

  <g>
    <path d="M400 440 L400 540 L600 540 L600 440 Z" fill="url(#lake3)"/>
    <path d="M400 440 Q 500 432 600 440 L600 446 Q 500 438 400 446 Z" fill="#9aecdc" opacity="0.4"/>
    <path d="M440 480 q 22 -13 44 0 q 22 13 44 0 q 22 -13 44 0" stroke="#9aecdc" stroke-width="2" fill="none" class="shimmer" opacity="0.5"/>
  </g>

  <g class="fall">
    <path d="M430 540 L430 600 L468 600 L468 540 Z" fill="url(#waterfall)"/>
    <path d="M490 540 L490 600 L528 600 L528 540 Z" fill="url(#waterfall)"/>
    <path d="M552 540 L552 605 L580 605 L580 540 Z" fill="url(#waterfall)"/>
  </g>
  <path d="M400 528 L600 528 L600 546 L400 546 Z" fill="url(#travertine)"/>

  <g>
    <path d="M400 600 L400 700 L620 700 L620 600 Z" fill="url(#lake1)"/>
    <path d="M400 600 Q 510 592 620 600 L620 606 Q 510 598 400 606 Z" fill="#9aecdc" opacity="0.4"/>
    <path d="M440 640 q 22 -13 44 0 q 22 13 44 0" stroke="#9aecdc" stroke-width="2" fill="none" class="shimmer" style="animation-delay:-2s;" opacity="0.5"/>
    <path d="M470 670 q 20 -12 40 0 q 20 12 40 0" stroke="#9aecdc" stroke-width="2" fill="none" class="shimmer" style="animation-delay:-4s;" opacity="0.4"/>
  </g>

  <g class="fall">
    <path d="M430 700 L430 730 L470 730 L470 700 Z" fill="url(#waterfall)"/>
    <path d="M495 700 L495 735 L535 735 L535 700 Z" fill="url(#waterfall)"/>
  </g>
  <path d="M400 688 L620 688 L620 706 L400 706 Z" fill="url(#travertine)"/>

  <g stroke="#6a4a30" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M360 500 q 0 40 0 -40 M360 460 l30 0 M360 540 l30 0"/>
    <path d="M640 470 l-30 0"/>
    <path d="M380 720 l30 0"/>
  </g>
  <g stroke="#7a5a3a" stroke-width="5" stroke-linecap="round" fill="none" class="sway">
    <path d="M360 462 c-18 6 -30 16 -38 30 M360 462 c18 6 30 16 38 30"/>
    <path d="M640 472 c-18 6 -30 16 -38 30"/>
    <path d="M408 722 c-14 4 -24 12 -30 22 M408 722 c14 4 24 12 30 22"/>
  </g>

  <g class="sway">
    <path d="M100 740 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#5a8a5a" opacity="0.8"/>
    <ellipse cx="100" cy="720" rx="14" ry="5" fill="#3a5a3a"/>
    <path d="M700 750 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#5a8a5a" opacity="0.7"/>
    <ellipse cx="700" cy="732" rx="14" ry="5" fill="#3a5a3a"/>
  </g>

  <g fill="#182214" opacity="0.9">
    <path d="M0 770 Q 200 758 400 764 Q 600 770 800 756 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1e2a18" opacity="0.85">
    <path d="M0 790 Q 260 780 400 784 Q 560 788 800 778 L 800 800 L 0 800 Z"/>
  </g>
</svg>