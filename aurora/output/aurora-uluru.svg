<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Улуру — гора, уходящая вглубь. Нарисовано Авророй: священный монолит Австралии на рассвете">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1e"/>
      <stop offset="24%" stop-color="#141a34"/>
      <stop offset="42%" stop-color="#24284c"/>
      <stop offset="60%" stop-color="#3c3a60"/>
      <stop offset="76%" stop-color="#62506a"/>
      <stop offset="90%" stop-color="#9a7068"/>
      <stop offset="100%" stop-color="#d09878"/>
    </linearGradient>
    <linearGradient id="uluruLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d87038"/>
      <stop offset="35%" stop-color="#b85830"/>
      <stop offset="70%" stop-color="#8a3c28"/>
      <stop offset="100%" stop-color="#582420"/>
    </linearGradient>
    <linearGradient id="uluruShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a3030"/>
      <stop offset="40%" stop-color="#4a2428"/>
      <stop offset="100%" stop-color="#2a1418"/>
    </linearGradient>
    <linearGradient id="underground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a16"/>
      <stop offset="50%" stop-color="#1a100e"/>
      <stop offset="100%" stop-color="#0e0808"/>
    </linearGradient>
    <linearGradient id="bush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a2e"/>
      <stop offset="50%" stop-color="#2a3820"/>
      <stop offset="100%" stop-color="#182214"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffdcb8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e88860" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e88860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffdcb0"/>
      <stop offset="100%" stop-color="#ffb878"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes rockPulse { 0%,100% { opacity:.6; } 50% { opacity:.95; } }
      @keyframes shimmer { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(3px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .rock { animation: rockPulse 7s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="165" r="0.8" class="star" style="animation-delay:-3s;"/>
  </g>

  <ellipse cx="400" cy="440" rx="240" ry="150" fill="url(#sunGlow)" filter="url(#glowBig)"/>

  <g class="rock" filter="url(#glowBig)">
    <ellipse cx="400" cy="520" rx="200" ry="100" fill="#ffc8a0" opacity="0.25"/>
  </g>

  <path d="M400 120 L560 480 Q 560 580 400 600 Q 240 580 240 480 Z" fill="url(#uluruLit)"/>
  <path d="M400 120 L560 480 Q 560 580 400 600 Q 240 580 240 480 Z" fill="#ffdcc0" opacity="0.25" class="rock"/>

  <path d="M400 120 L560 480 Q 560 580 400 600 Q 400 540 400 120 Z" fill="url(#uluruShade)" opacity="0.5"/>

  <path d="M260 520 Q 300 180 340 160 Q 360 150 380 162 Q 350 200 320 360 Q 290 500 260 520 Z" fill="url(#uluruShade)" opacity="0.3"/>
  <path d="M540 520 Q 500 180 460 160 Q 440 150 420 162 Q 450 200 480 360 Q 510 500 540 520 Z" fill="url(#uluruShade)" opacity="0.3"/>

  <path d="M560 480 Q 580 480 580 520 Q 580 620 400 620 Q 220 620 240 520 Q 240 480 260 480" stroke="#582420" stroke-width="8" fill="none" opacity="0.6"/>
  <path d="M400 600 Q 560 580 560 480 M400 600 Q 240 580 240 480" stroke="#c07848" stroke-width="4" fill="none" opacity="0.4"/>

  <path d="M240 480 Q 220 480 200 560 Q 180 640 240 720 Q 260 680 220 600 Q 200 540 240 480 Z" fill="url(#underground)" opacity="0.2"/>
  <path d="M580 480 Q 600 480 620 560 Q 640 640 580 720 Q 560 680 600 600 Q 620 540 580 480 Z" fill="url(#underground)" opacity="0.2"/>
  <path d="M260 540 Q 240 580 220 640 Q 200 700 240 760 Q 260 720 240 660 Q 220 600 260 540 Z" fill="url(#underground)" opacity="0.15"/>
  <path d="M560 540 Q 580 580 600 640 Q 620 700 580 760 Q 560 720 580 660 Q 600 600 560 540 Z" fill="url(#underground)" opacity="0.15"/>

  <path d="M0 580 Q 140 560 260 572 Q 400 586 540 568 Q 660 552 800 570 L 800 800 L 0 800 Z" fill="url(#bush)"/>

  <g stroke="#7a9a5a" stroke-width="2.5" stroke-linecap="round" fill="none" class="shimmer" opacity="0.5">
    <path d="M100 630 q 40 -8 80 0 q 40 8 80 0"/>
    <path d="M480 660 q 50 -8 100 0 q 50 8 100 0" style="animation-delay:-3s;"/>
    <path d="M280 700 q 60 -8 120 0 q 60 8 120 0" style="animation-delay:-5s;"/>
  </g>

  <g class="sway">
    <path d="M120 720 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#5a7a42" opacity="0.8"/>
    <ellipse cx="120" cy="700" rx="14" ry="5" fill="#3a5a28"/>
    <path d="M700 740 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#5a7a42" opacity="0.7"/>
    <ellipse cx="700" cy="722" rx="14" ry="5" fill="#3a5a28"/>
  </g>

  <g fill="#1e2c14" opacity="0.9">
    <path d="M0 750 Q 200 736 400 742 Q 600 748 800 734 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#26361a" opacity="0.85">
    <path d="M0 776 Q 260 764 400 768 Q 560 772 800 760 L 800 800 L 0 800 Z"/>
  </g>
</svg>