<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Антелоп Каньон — свет, спускающийся сквозь скалы. Нарисовано Авророй: волны песчаника и вертикальные лучи света">
  <defs>
    <linearGradient id="sandLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2430"/>
      <stop offset="40%" stop-color="#7a3a40"/>
      <stop offset="75%" stop-color="#a85848"/>
      <stop offset="100%" stop-color="#c87858"/>
    </linearGradient>
    <linearGradient id="sandRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c87858"/>
      <stop offset="30%" stop-color="#a85848"/>
      <stop offset="70%" stop-color="#7a3a40"/>
      <stop offset="100%" stop-color="#4a2430"/>
    </linearGradient>
    <linearGradient id="sandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e89868"/>
      <stop offset="40%" stop-color="#c87858"/>
      <stop offset="100%" stop-color="#7a3a40"/>
    </linearGradient>
    <linearGradient id="sandBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a85848"/>
      <stop offset="60%" stop-color="#6a3040"/>
      <stop offset="100%" stop-color="#3a1e2c"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffe8c0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0c090" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0c090" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0c090" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes beamPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes dust { 0%,100% { transform:translateY(0); opacity:.3; } 50% { transform:translateY(-26px); opacity:.8; } }
      @keyframes shimmer { 0%,100% { opacity:.5; } 50% { opacity:.8; } }
      .beam { animation: beamPulse 7s ease-in-out infinite; }
      .dust { animation: dust 5s ease-in-out infinite; }
      .shimmer { animation: shimmer 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="#1a0e1c"/>

  <path d="M0 0 L320 0 Q 330 160 310 320 Q 292 470 320 800 L0 800 Z" fill="url(#sandLeft)"/>
  <path d="M800 0 L480 0 Q 470 160 490 320 Q 508 470 480 800 L800 800 Z" fill="url(#sandRight)"/>

  <g filter="url(#glowSoft)" class="shimmer">
    <path d="M320 0 Q 300 160 310 320 Q 318 480 320 800 L 420 800 Q 430 480 422 320 Q 414 160 430 0 Z" fill="url(#sandTop)" opacity="0.5"/>
  </g>

  <g filter="url(#glowSoft)" class="shimmer" style="animation-delay:-3s;">
    <path d="M480 0 Q 470 160 490 320 Q 508 470 500 800 L 420 800 Q 428 470 410 320 Q 392 160 400 0 Z" fill="url(#sandBottom)" opacity="0.5"/>
  </g>

  <g stroke="#e8a878" stroke-width="5" fill="none" opacity="0.3" stroke-linecap="round">
    <path d="M60 120 q 30 -8 60 0 q 30 8 60 0" class="shimmer"/>
    <path d="M80 240 q 26 -7 52 0 q 26 7 52 0" class="shimmer" style="animation-delay:-2s;"/>
    <path d="M40 380 q 34 -9 68 0" class="shimmer" style="animation-delay:-4s;"/>
    <path d="M70 520 q 28 -7 56 0" class="shimmer" style="animation-delay:-1s;"/>
    <path d="M50 660 q 30 -8 60 0" class="shimmer" style="animation-delay:-5s;"/>
  </g>

  <g stroke="#e8a878" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round">
    <path d="M620 180 q 26 -7 52 0 q 26 7 52 0" class="shimmer" style="animation-delay:-1.5s;"/>
    <path d="M640 320 q 30 -8 60 0" class="shimmer" style="animation-delay:-3.5s;"/>
    <path d="M610 460 q 28 -7 56 0" class="shimmer" style="animation-delay:-0.5s;"/>
    <path d="M650 600 q 26 -7 52 0" class="shimmer" style="animation-delay:-4.5s;"/>
  </g>

  <ellipse cx="400" cy="340" rx="150" ry="380" fill="url(#beam)" class="beam" filter="url(#glowBig)"/>

  <g class="beam" stroke="url(#beamLine)" stroke-width="8" stroke-linecap="round">
    <path d="M390 60 L388 520"/>
    <path d="M412 40 L414 470"/>
    <path d="M402 30 L400 300"/>
    <path d="M380 80 L376 420"/>
    <path d="M426 70 L430 380"/>
  </g>
  <g class="beam" stroke="#ffe8c0" stroke-width="3" stroke-linecap="round" opacity="0.6" style="animation-delay:-2s;">
    <path d="M398 50 L396 430"/>
    <path d="M406 60 L408 350"/>
    <path d="M384 100 L382 380"/>
  </g>

  <g filter="url(#glowTiny)" fill="#ffe8c0" class="dust">
    <circle cx="398" cy="360" r="1.6"/>
    <circle cx="404" cy="300" r="1.2" style="animation-delay:-1s;"/>
    <circle cx="392" cy="420" r="1.4" style="animation-delay:-2s;"/>
    <circle cx="410" cy="260" r="1.1" style="animation-delay:-3s;"/>
    <circle cx="386" cy="480" r="1.3" style="animation-delay:-4s;"/>
  </g>
  <g filter="url(#glowTiny)" fill="#fff0d0" class="dust" style="animation-delay:-2.5s;">
    <circle cx="400" cy="330" r="1"/>
    <circle cx="394" cy="390" r="0.9" style="animation-delay:-1.6s;"/>
    <circle cx="408" cy="310" r="1.1" style="animation-delay:-3.2s;"/>
  </g>

  <g stroke="#e0b890" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M330 300 q 34 10 68 0"/>
    <path d="M336 420 q 30 8 60 0"/>
    <path d="M340 540 q 28 7 56 0"/>
    <path d="M346 220 q 26 7 52 0"/>
    <path d="M352 650 q 24 6 48 0"/>
  </g>
  <g stroke="#e0a868" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M470 260 q -34 -10 -68 0"/>
    <path d="M464 390 q -30 -8 -60 0"/>
    <path d="M460 520 q -28 -7 -56 0"/>
    <path d="M454 180 q -26 -7 -52 0"/>
    <path d="M448 600 q -24 -6 -48 0"/>
  </g>

  <rect x="0" y="760" width="800" height="40" fill="#3a1e2c"/>
  <g fill="#2a1420" opacity="0.9">
    <path d="M0 770 Q 200 762 400 766 Q 600 770 800 762 L 800 800 L 0 800 Z"/>
  </g>
  <ellipse cx="400" cy="640" rx="100" ry="14" fill="#f0c090" opacity="0.15" filter="url(#glowBig)"/>
</svg>