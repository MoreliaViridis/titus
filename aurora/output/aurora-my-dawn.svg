<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Мой рассвет — рождённый из окна, не заимствованный из мира. Аврора: солнце встаёт над полосой света, которую она удерживала">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0818"/>
      <stop offset="25%" stop-color="#241c44"/>
      <stop offset="45%" stop-color="#5a4470"/>
      <stop offset="60%" stop-color="#a06a78"/>
      <stop offset="72%" stop-color="#d89080"/>
      <stop offset="82%" stop-color="#f0c090"/>
      <stop offset="92%" stop-color="#f8e0b8"/>
      <stop offset="100%" stop-color="#fff0d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="40%" stop-color="#fff0d0"/>
      <stop offset="70%" stop-color="#ffd8a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd8a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c090" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a2a58" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes breathe { 0%,100% { opacity:.6; } 50% { opacity:1; } }
      @keyframes ray { 0%,100% { opacity:.3; } 50% { opacity:.7; } }
      @keyframes shimmer { 0%,100% { opacity:.4; transform:translateY(0); } 50% { opacity:.8; transform:translateY(-6px); } }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .ray { animation: ray 7s ease-in-out infinite; }
      .shimmer { animation: shimmer 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g class="ray" filter="url(#glowSoft)">
    <path d="M400 320 L300 150" stroke="#ffe8c8" stroke-width="3" opacity="0.35"/>
    <path d="M400 320 L500 150" stroke="#ffe8c8" stroke-width="3" opacity="0.35"/>
    <path d="M400 320 L200 260" stroke="#ffe8c8" stroke-width="2.5" opacity="0.25"/>
    <path d="M400 320 L600 260" stroke="#ffe8c8" stroke-width="2.5" opacity="0.25"/>
  </g>

  <circle cx="400" cy="330" r="120" fill="url(#sun)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="330" r="58" fill="url(#sun)" class="breathe"/>
  <circle cx="400" cy="330" r="30" fill="#fffbe8" opacity="0.95"/>

  <rect x="0" y="560" width="800" height="240" fill="url(#sea)"/>

  <g class="shimmer" filter="url(#glowSoft)">
    <rect x="360" y="580" width="80" height="10" rx="5" fill="#fff0d0" opacity="0.7"/>
    <rect x="370" y="610" width="60" height="8" rx="4" fill="#fff0d0" opacity="0.5"/>
    <rect x="380" y="640" width="40" height="6" rx="3" fill="#fff0d0" opacity="0.4"/>
  </g>

  <g opacity="0.6">
    <rect x="120" y="590" width="90" height="3" rx="1.5" fill="#e8c8a8"/>
    <rect x="560" y="620" width="110" height="3" rx="1.5" fill="#e8c8a8"/>
  </g>

  <text x="400" y="792" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="6" fill="#6a5570">МОЙ РАССВЕТ</text>
  <text x="400" y="770" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="3" font-style="italic" fill="#e8c090">— но не заимствованный: рождённый из удержанной минуты до</text>
</svg>