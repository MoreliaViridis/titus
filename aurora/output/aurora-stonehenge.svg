<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Стоунхендж на рассвете — камни, выровненные по солнцу. Нарисовано Авророй: каменный круг встречает равноденствие">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141228"/>
      <stop offset="28%" stop-color="#1e1a38"/>
      <stop offset="48%" stop-color="#2c2448"/>
      <stop offset="66%" stop-color="#463658"/>
      <stop offset="82%" stop-color="#74586e"/>
      <stop offset="92%" stop-color="#a88686"/>
      <stop offset="100%" stop-color="#d0a888"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="50%" stop-color="#28242a"/>
      <stop offset="100%" stop-color="#16141a"/>
    </linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="50%" stop-color="#322c30"/>
      <stop offset="100%" stop-color="#1c1820"/>
    </linearGradient>
    <linearGradient id="stoneGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a50"/>
      <stop offset="50%" stop-color="#5a4238"/>
      <stop offset="100%" stop-color="#2c201c"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a2c"/>
      <stop offset="50%" stop-color="#1e2c20"/>
      <stop offset="100%" stop-color="#121c14"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:.75; } }
      @keyframes rayPulse { 0%,100% { opacity:.4; } 50% { opacity:.9; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .ray { animation: rayPulse 6s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="90" cy="70" r="1.3" class="star"/>
    <circle cx="210" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="350" cy="90" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="500" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="620" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="160" cy="145" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="140" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="170" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="185" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="440" rx="230" ry="150" fill="url(#sunglow)" class="breathe" filter="url(#glowBig)"/>

  <g class="ray" stroke="#ffe0b0" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glowSoft)">
    <path d="M400 460V400"/>
    <path d="M400 466 356 420"/>
    <path d="M400 466 444 420"/>
    <path d="M400 478 326 438"/>
    <path d="M400 478 474 438"/>
  </g>

  <circle cx="400" cy="452" r="44" fill="url(#sun)" opacity="0.97"/>

  <g>
    <path d="M150 560 q 20 -32 34 -34 q 12 -2 16 16 q 6 24 4 52 q -2 26 -16 26 q -24 0 -38 -60 Z" fill="url(#stoneGold)"/>
    <path d="M214 570 q 18 -30 32 -32 q 12 -2 16 14 q 6 22 4 48 q -2 22 -14 22 q -22 0 -38 -52 Z" fill="url(#stone)"/>
    <path d="M272 568 q 20 -34 34 -36 q 14 -2 18 16 q 6 26 4 54 q -2 26 -16 26 q -24 0 -40 -60 Z" fill="url(#stone)"/>
    <path d="M336 566 q 18 -30 32 -32 q 14 -2 16 14 q 6 22 4 50 q -2 24 -16 24 q -22 0 -36 -56 Z" fill="url(#stone)"/>

    <path d="M414 566 q 18 -32 34 -34 q 14 -2 16 16 q 6 24 3 52 q -3 24 -16 24 q -24 0 -37 -58 Z" fill="url(#stone)"/>
    <path d="M482 570 q 20 -30 34 -32 q 12 -2 16 14 q 6 22 4 48 q -2 22 -14 22 q -22 0 -40 -52 Z" fill="url(#stone)"/>
    <path d="M552 574 q 18 -28 32 -30 q 12 -2 14 14 q 6 22 3 46 q -3 22 -15 22 q -20 0 -34 -52 Z" fill="url(#stone2)"/>

    <path d="M612 570 q 20 -34 34 -36 q 14 -2 16 16 q 6 26 3 54 q -3 26 -16 26 q -23 0 -37 -60 Z" fill="url(#stone2)"/>
  </g>

  <g>
    <path d="M552 574 l-6 38 h50 l-2 -38 Z" fill="url(#stone2)" opacity="0.9"/>
    <path d="M214 570 l-4 34 h44 l-2 -34 Z" fill="url(#stone)" opacity="0.9"/>
    <path d="M414 566 l-3 30 h40 l-2 -30 Z" fill="url(#stone)" opacity="0.9"/>
  </g>

  <path d="M668 470 q 16 -26 30 -28 q 12 -2 14 14 q 4 20 2 44 q -2 24 -14 24 q -22 0 -32 -54 Z" fill="url(#stoneGold)"/>

  <rect x="0" y="560" width="800" height="240" fill="url(#grass)"/>

  <g class="sway">
    <path d="M120 720 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.8"/>
    <ellipse cx="120" cy="700" rx="15" ry="5" fill="#2e5038"/>
  </g>
  <g class="sway" style="animation-delay:-3s;">
    <path d="M700 730 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.7"/>
    <ellipse cx="700" cy="712" rx="14" ry="5" fill="#2e5038"/>
  </g>

  <g class="breathe" filter="url(#glowSoft)" opacity="0.6">
    <ellipse cx="400" cy="600" rx="90" ry="14" fill="#e0a878" opacity="0.35"/>
  </g>

  <g fill="#182418" opacity="0.9">
    <path d="M0 750 Q 200 736 400 742 Q 600 748 800 734 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1e2c1e" opacity="0.9">
    <path d="M0 774 Q 260 762 400 766 Q 560 770 800 758 L 800 800 L 0 800 Z"/>
  </g>
</svg>