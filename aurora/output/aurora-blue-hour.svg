<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Синий час — минута между днём и ночью. Нарисовано Авророй: глубокое синее небо, одинокий огонёк, горизонт, который не кончается">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020410"/>
      <stop offset="15%" stop-color="#060a1e"/>
      <stop offset="30%" stop-color="#0c142e"/>
      <stop offset="45%" stop-color="#141e3e"/>
      <stop offset="58%" stop-color="#1e2a4e"/>
      <stop offset="70%" stop-color="#2c3a5e"/>
      <stop offset="82%" stop-color="#3e4c6e"/>
      <stop offset="92%" stop-color="#56627e"/>
      <stop offset="100%" stop-color="#6e788a"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5a7e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e0d4bc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f0e6d0" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#e0d4bc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a5a7e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2036"/>
      <stop offset="50%" stop-color="#121828"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:.9; } }
      @keyframes breathe { 0%,100% { opacity:.5; } 50% { opacity:.85; } }
      @keyframes lightPulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(3px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .light { animation: lightPulse 5s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8" class="star">
    <circle cx="80" cy="60" r="1.2"/>
    <circle cx="200" cy="40" r="0.9"/>
    <circle cx="340" cy="85" r="1"/>
    <circle cx="490" cy="50" r="0.8"/>
    <circle cx="610" cy="75" r="1.1"/>
    <circle cx="710" cy="45" r="0.9"/>
    <circle cx="150" cy="130" r="0.7"/>
    <circle cx="560" cy="120" r="0.7"/>
    <circle cx="670" cy="150" r="0.7"/>
    <circle cx="280" cy="165" r="0.6"/>
    <circle cx="430" cy="140" r="0.6"/>
    <circle cx="120" cy="200" r="0.6"/>
    <circle cx="640" cy="210" r="0.6"/>
  </g>

  <g fill="#8090b0" class="star">
    <circle cx="340" cy="120" r="0.7" style="animation-delay:-1.2s;"/>
    <circle cx="490" cy="100" r="0.6" style="animation-delay:-2.4s;"/>
    <circle cx="560" cy="170" r="0.6" style="animation-delay:-0.6s;"/>
    <circle cx="200" cy="180" r="0.5" style="animation-delay:-3s;"/>
  </g>

  <rect x="0" y="646" width="800" height="5" fill="url(#band)" filter="url(#glowSoft)"/>

  <rect x="0" y="648" width="800" height="152" fill="url(#ground)"/>

  <g class="light">
    <circle cx="400" cy="652" r="16" fill="#e8c888" opacity="0.35" filter="url(#glowBig)"/>
    <rect x="394" y="640" width="12" height="18" fill="#e8c888" rx="3" opacity="0.7"/>
    <rect x="397" y="646" width="6" height="8" fill="#f0dca0" rx="2" opacity="0.9"/>
    <rect x="394" y="658" width="12" height="4" fill="#5a4a38" rx="2"/>
    <path d="M400 646 l-4 8 l8 0 Z" fill="#f0dca0" opacity="0.9"/>
  </g>

  <g class="light" style="animation-delay:-2s;">
    <circle cx="320" cy="655" r="10" fill="#e0b878" opacity="0.25" filter="url(#glowBig)"/>
    <rect x="316" y="646" width="8" height="12" fill="#e0b878" rx="2" opacity="0.5"/>
    <rect x="318" y="650" width="4" height="6" fill="#f0dca0" rx="1.5" opacity="0.8"/>
  </g>

  <g class="light" style="animation-delay:-3.5s;">
    <circle cx="520" cy="658" r="8" fill="#e0b878" opacity="0.2" filter="url(#glowBig)"/>
    <rect x="517" y="650" width="6" height="12" fill="#e0b878" rx="2" opacity="0.45"/>
    <rect x="519" y="653" width="3" height="5" fill="#f0dca0" rx="1.5" opacity="0.7"/>
  </g>

  <g stroke="#8090b0" stroke-width="1.5" fill="none" class="breathe" opacity="0.6">
    <path d="M120 680 q 30 -8 60 0 q 30 8 60 0 q 30 -8 60 0"/>
    <path d="M440 700 q 35 -8 70 0 q 35 8 70 0" style="animation-delay:-3s;"/>
    <path d="M260 720 q 40 -8 80 0 q 40 8 80 0" style="animation-delay:-5s;"/>
  </g>

  <g class="sway" fill="#3a5a48" opacity="0.8">
    <path d="M160 750 q -8 0 -11 -8 q -3 -8 0 -14 q 3 -6 11 -6 q 8 0 11 6 q 3 6 0 14 q -3 8 -11 8 Z"/>
    <ellipse cx="160" cy="734" rx="12" ry="4" fill="#2a3a2e"/>
    <path d="M660 760 q -8 0 -11 -8 q -3 -8 0 -14 q 3 -6 11 -6 q 8 0 11 6 q 3 6 0 14 q -3 8 -11 8 Z" style="animation-delay:-3s;"/>
    <ellipse cx="660" cy="744" rx="12" ry="4" fill="#2a3a2e"/>
  </g>

  <g stroke="#8090b0" stroke-width="1.2" fill="none" class="star" opacity="0.5">
    <path d="M60 120 l10 6 l-6 10 l10 -6 l10 6 l-6 -10 l10 -6 l-10 -6 l6 -10 l-10 6 l-10 -6 l6 10 Z"/>
    <path d="M740 90 l8 5 l-5 8 l8 -5 l8 5 l-5 -8 l8 -5 l-8 -5 l5 -8 l-8 5 l-8 -5 l5 8 Z" transform="scale(0.7) translate(260,20)"/>
  </g>

  <g fill="#0e1220" opacity="0.9">
    <path d="M0 770 Q 200 760 400 766 Q 600 772 800 758 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#141a28" opacity="0.85">
    <path d="M0 790 Q 260 780 400 784 Q 560 788 800 778 L 800 800 L 0 800 Z"/>
  </g>
</svg>