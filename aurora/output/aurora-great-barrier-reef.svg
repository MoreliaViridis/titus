<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Большой Барьерный риф — сад света под водой. Нарисовано Авророй: кораллы всех цветов, рыбы, лучи рассвета сквозь воду">
  <defs>
    <linearGradient id="seaTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a40"/>
      <stop offset="20%" stop-color="#143650"/>
      <stop offset="45%" stop-color="#1a4260"/>
      <stop offset="70%" stop-color="#204e6e"/>
      <stop offset="100%" stop-color="#265a7a"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#265a7a"/>
      <stop offset="40%" stop-color="#1a4662"/>
      <stop offset="100%" stop-color="#0e2e44"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b898"/>
      <stop offset="100%" stop-color="#8a7a60"/>
    </linearGradient>
    <radialGradient id="sunfish" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4dc" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd8a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd8a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8f4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(7px); } }
      @keyframes sway2 { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-6px); } }
      @keyframes swimA { 0%,100% { transform:translate(0,0); } 50% { transform:translate(14px,-5px); } }
      @keyframes swimB { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-12px,6px); } }
      @keyframes bubble { 0% { transform:translateY(0); opacity:0; } 10% { opacity:.7; } 100% { transform:translateY(-46px); opacity:0; } }
      @keyframes beamPulse { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
      .sway { animation: sway 7s ease-in-out infinite; transform-origin:center bottom; }
      .sway2 { animation: sway2 9s ease-in-out infinite; transform-origin:center bottom; }
      .swimA { animation: swimA 6s ease-in-out infinite; }
      .swimB { animation: swimB 7s ease-in-out infinite; }
      .bubble { animation: bubble 5s linear infinite; }
      .beamPulse { animation: beamPulse 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="420" fill="url(#seaTop)"/>

  <g class="beamPulse" stroke="url(#beamLight)" stroke-width="14" stroke-linecap="round">
    <path d="M300 0 L260 400"/>
    <path d="M400 0 L400 420"/>
    <path d="M520 0 L560 400"/>
    <path d="M340 0 L310 420"/>
    <path d="M470 0 L500 420"/>
  </g>

  <ellipse cx="400" cy="110" rx="60" ry="60" fill="url(#sunfish)" filter="url(#glowBig)"/>
  <circle cx="400" cy="110" r="26" fill="#fff4dc" opacity="0.9"/>
  <circle cx="400" cy="110" r="26" fill="none" stroke="#ffdfa6" stroke-width="1.5" opacity="0.6"/>

  <rect x="0" y="420" width="800" height="380" fill="url(#deep)"/>

  <g class="sway2">
    <path d="M150 660 q -12 -30 -4 -58 q 4 -12 14 -12 q 10 0 12 12 q 6 30 -6 58 q -6 16 -16 16 Z" fill="#d890b0"/>
    <path d="M160 600 q -4 -18 2 -32 q 4 -10 12 -8 q 8 2 6 12 q -4 18 2 28 Z" fill="#c87090" opacity="0.9"/>
    <path d="M150 660 q -8 8 -14 6 q -6 -2 -4 -10 Z" fill="#e0a8bc"/>
  </g>
  <g class="sway">
    <path d="M620 640 q -14 -34 -5 -64 q 5 -14 16 -13 q 11 1 12 13 q 5 34 -7 64 q -6 16 -16 16 Z" fill="#d8a068"/>
    <path d="M632 580 q -5 -20 2 -36 q 5 -11 13 -8 q 8 3 6 13 q -4 20 3 31 Z" fill="#c08848" opacity="0.9"/>
  </g>
  <g class="sway2" style="animation-delay:-2s;">
    <path d="M470 690 q -10 -26 -3 -50 q 3 -10 12 -10 q 9 0 11 10 q 5 26 -5 50 q -5 14 -15 14 Z" fill="#7ab8e0"/>
    <path d="M480 640 q -4 -16 2 -28 q 4 -8 11 -6 q 7 2 5 10 q -3 16 2 24 Z" fill="#5a9ac8" opacity="0.9"/>
  </g>

  <g>
    <ellipse cx="340" cy="520" rx="70" ry="18" fill="#c87868"/>
    <ellipse cx="340" cy="512" rx="58" ry="14" fill="#d89078"/>
    <circle cx="316" cy="508" r="6" fill="#e8a890"/>
    <circle cx="332" cy="504" r="5" fill="#e8a890"/>
    <circle cx="348" cy="506" r="5" fill="#e8a890"/>
    <circle cx="364" cy="509" r="6" fill="#e8a890"/>
    <circle cx="330" cy="518" r="5" fill="#a85a4a"/>
    <circle cx="352" cy="518" r="5" fill="#a85a4a"/>
  </g>
  <g>
    <path d="M520 560 q 0 -22 30 -28 q 34 -8 46 16 q 8 18 -6 22 q -40 10 -70 -4 Z" fill="#4a9a6a"/>
    <rect x="548" y="562" width="24" height="36" fill="#6ab882"/>
    <rect x="552" y="570" width="6" height="7" fill="#2e5a3a" rx="1.5"/>
    <rect x="564" y="570" width="6" height="7" fill="#2e5a3a" rx="1.5"/>
    <path d="M548 562 q 12 -10 24 0 Z" fill="#5aaa78"/>
  </g>
  <g>
    <rect x="200" y="700" width="80" height="22" fill="#d8b878"/>
    <path d="M200 700 q 40 -18 80 0 Z" fill="#e0c888"/>
    <path d="M200 722 q 40 14 80 0" stroke="#b89858" stroke-width="3" fill="none"/>
    <circle cx="220" cy="706" r="3.5" fill="#a88040"/>
    <circle cx="240" cy="704" r="3" fill="#a88040"/>
    <circle cx="260" cy="705" r="3.5" fill="#a88040"/>
  </g>

  <g class="swimA">
    <ellipse cx="320" cy="380" rx="26" ry="12" fill="#ffc860"/>
    <path d="M320 368 l10 -8 l-4 8 l4 8 Z" fill="#e8a838"/>
    <path d="M320 392 l10 8 l-4 -8 l4 -8 Z" fill="#e8a838"/>
    <circle cx="306" cy="378" r="2" fill="#2a2018"/>
    <rect x="300" y="376" width="10" height="8" fill="#d89040" rx="3"/>
  </g>
  <g class="swimB" style="animation-delay:-2s;">
    <ellipse cx="540" cy="320" rx="22" ry="10" fill="#5ab8e8"/>
    <path d="M540 310 l8 -7 l-3 7 l3 7 Z" fill="#3a9ac8"/>
    <path d="M540 330 l8 7 l-3 -7 l3 -7 Z" fill="#3a9ac8"/>
    <circle cx="528" cy="318" r="1.8" fill="#1a2030"/>
    <rect x="522" y="316" width="8" height="7" fill="#2a80b0" rx="2.5"/>
  </g>
  <g class="swimA" style="animation-delay:-4s;">
    <ellipse cx="200" cy="280" rx="16" ry="8" fill="#d87a5a"/>
    <path d="M200 272 l6 -5 l-2 5 l2 5 Z" fill="#b85a3a"/>
    <circle cx="190" cy="279" r="1.5" fill="#2a1810"/>
  </g>

  <g class="bubble"><circle cx="380" cy="480" r="4" fill="#c8e8f8" opacity="0.6"/></g>
  <g class="bubble" style="animation-delay:-1.7s;"><circle cx="410" cy="500" r="3" fill="#c8e8f8" opacity="0.5"/></g>
  <g class="bubble" style="animation-delay:-3.1s;"><circle cx="392" cy="460" r="2.4" fill="#d8f0fc" opacity="0.55"/></g>
  <g class="bubble" style="animation-delay:-4.4s;"><circle cx="404" cy="520" r="3.4" fill="#c8e8f8" opacity="0.5"/></g>

  <rect x="0" y="700" width="800" height="100" fill="url(#sand)"/>
  <path d="M0 704 Q 200 694 400 700 Q 600 706 800 698 L 800 800 L 0 800 Z" fill="#d0c0a0"/>

  <g opacity="0.5">
    <ellipse cx="320" cy="730" rx="60" ry="12" fill="#b89858"/>
    <ellipse cx="520" cy="746" rx="46" ry="10" fill="#c0a868"/>
  </g>
</svg>