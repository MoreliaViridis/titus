<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Джомолунгма — снежный флаг на крыше мира. Нарисовано Авророй: Эверест, шлейф снега, первый свет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e22"/>
      <stop offset="26%" stop-color="#121836"/>
      <stop offset="46%" stop-color="#1c2446"/>
      <stop offset="64%" stop-color="#303858"/>
      <stop offset="80%" stop-color="#52566c"/>
      <stop offset="92%" stop-color="#787878"/>
      <stop offset="100%" stop-color="#9a9482"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#b8c8d8"/>
    </linearGradient>
    <linearGradient id="snowPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="50%" stop-color="#f0c8b8"/>
      <stop offset="100%" stop-color="#d0a898"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="40%" stop-color="#3a3a42"/>
      <stop offset="70%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5658"/>
      <stop offset="40%" stop-color="#464248"/>
      <stop offset="100%" stop-color="#2a2830"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e8ecf0" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#d0d8e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8d0d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
      @keyframes plume { 0%,100% { transform:translateX(0); opacity:.6; } 50% { transform:translateX(18px); opacity:.95; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes cloudDrift { 0%,100% { transform:translateX(0); opacity:.4; } 50% { transform:translateX(26px); opacity:.7; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .plume { animation: plume 9s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .cloud { animation: cloudDrift 17s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="500" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="620" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="145" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="135" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="170" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="185" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="330" rx="250" ry="140" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>

  <path d="M0 800 Q 140 620 260 540 Q 300 520 340 560 Q 380 600 440 540 Q 480 500 520 560 Q 600 620 800 800 Z" fill="url(#mountain2)"/>
  <path d="M60 800 Q 200 600 320 520 Q 360 460 400 300 L 480 600 Q 560 700 700 800 Z" fill="url(#mountain)"/>

  <path d="M400 300 L400 300 Q 452 520 480 600 L 422 620 L 400 520 L 380 620 L 320 520 Q 352 460 400 300 Z" fill="url(#snow)"/>
  <path d="M400 300 L438 520 L430 520 Z" fill="url(#snowPink)" opacity="0.8"/>
  <path d="M400 300 L392 470 L400 470 Z" fill="#fff0e0" opacity="0.7"/>

  <path d="M320 520 L260 540 Q 280 510 300 500 L 330 505 Q 325 512 320 520 Z" fill="url(#snow)" opacity="0.8"/>

  <circle cx="400" cy="296" r="24" fill="url(#sun)"/>
  <circle cx="400" cy="296" r="30" fill="none" stroke="#ffe0b0" stroke-width="1.5" opacity="0.6"/>

  <g class="plume" filter="url(#glowSoft)">
    <path d="M400 300 L520 260 L700 240 Q 600 250 520 270 Q 480 282 420 300 Z" fill="url(#plume)"/>
    <path d="M400 305 L480 290 L600 280 Q 540 290 480 302 Q 440 310 400 312 Z" fill="url(#plume)" opacity="0.7"/>
    <path d="M400 296 L560 250 L640 244 Q 560 258 520 270 Q 470 282 410 300 Z" fill="#ffffff" opacity="0.45"/>
  </g>

  <g stroke="#d8e0e8" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round" class="plume">
    <path d="M410 302 L520 268 Q 600 244 660 238"/>
  </g>

  <g class="cloud" filter="url(#glowSoft)">
    <ellipse cx="180" cy="470" rx="90" ry="24" fill="#d0d8e0" opacity="0.3"/>
    <ellipse cx="600" cy="480" rx="100" ry="26" fill="#d0d8e0" opacity="0.25" style="animation-delay:-7s;"/>
  </g>

  <path d="M0 640 Q 160 620 280 628 Q 400 636 520 624 Q 640 612 800 630 L 800 650 L 0 650 Z" fill="#2c3430" opacity="0.5"/>

  <rect x="0" y="700" width="800" height="100" fill="#1a1c20"/>

  <g stroke="#b8c8d8" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round" class="cloud">
    <path d="M100 740 q 80 -12 160 0 q 80 12 160 0"/>
    <path d="M460 760 q 70 -10 140 0 q 70 10 140 0" style="animation-delay:-5s;"/>
  </g>

  <g fill="#121216" opacity="0.95">
    <path d="M0 762 Q 200 748 400 754 Q 600 760 800 746 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1a1a1f" opacity="0.9">
    <path d="M0 786 Q 260 774 400 780 Q 560 786 800 772 L 800 800 L 0 800 Z"/>
  </g>
</svg>