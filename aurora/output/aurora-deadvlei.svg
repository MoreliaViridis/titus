<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Деадвлеи — красота, которая не сдалась. Нарисовано Авророй: чёрные деревья на белой глине среди красных дюн Намиба">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a2a"/>
      <stop offset="30%" stop-color="#16263a"/>
      <stop offset="52%" stop-color="#2a3a52"/>
      <stop offset="72%" stop-color="#5a5068"/>
      <stop offset="86%" stop-color="#b87a52"/>
      <stop offset="100%" stop-color="#e8a860"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e89058"/>
      <stop offset="22%" stop-color="#c86a36"/>
      <stop offset="55%" stop-color="#9a4426"/>
      <stop offset="100%" stop-color="#5e2818"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e08850"/>
      <stop offset="25%" stop-color="#b85c2e"/>
      <stop offset="60%" stop-color="#8a3a22"/>
      <stop offset="100%" stop-color="#4e2014"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d88048"/>
      <stop offset="30%" stop-color="#a84e2a"/>
      <stop offset="100%" stop-color="#582418"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="40%" stop-color="#e8dcc4"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
    <linearGradient id="crack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7658" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6a5a42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8a7658" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe8b8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f0b070" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0b070" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:.8; } }
      @keyframes ridgeGlint { 0%,100% { opacity:.5; } 50% { opacity:.95; } }
      @keyframes shadowShiver { 0%,100% { opacity:.25; } 50% { opacity:.5; } }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .glint { animation: ridgeGlint 6s ease-in-out infinite; }
      .shiver { animation: shadowShiver 10s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <ellipse cx="400" cy="520" rx="220" ry="120" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="512" r="36" fill="#fff0c8" opacity="0.9"/>

  <path d="M0 0 L420 0 Q 430 120 400 260 Q 372 380 250 470 Q 160 532 0 560 Z" fill="url(#dune1)"/>
  <path d="M0 0 L300 0 Q 330 100 310 220 Q 292 330 220 430 Q 150 520 0 540 Z" fill="url(#dune2)" opacity="0.85"/>

  <path d="M800 0 L430 0 Q 420 110 452 240 Q 480 360 590 448 Q 672 508 800 530 Z" fill="url(#dune3)"/>
  <path d="M800 0 L520 0 Q 510 90 540 210 Q 566 320 648 406 Q 710 470 800 484 Z" fill="url(#dune2)" opacity="0.7"/>

  <g class="glint" stroke="#ffb870" stroke-width="5" stroke-linecap="round" filter="url(#glowSoft)">
    <path d="M390 262 Q 405 240 420 260"/>
    <path d="M455 240 Q 470 216 486 236"/>
    <path d="M590 448 Q 608 432 624 450"/>
  </g>

  <path d="M120 520 Q 180 500 240 510 Q 320 524 400 512 Q 500 498 580 512 Q 660 526 700 516 L 800 520 Q 620 560 400 556 Q 180 552 0 560 Z" fill="#2a2430"/>
  <path d="M120 532 Q 220 514 320 524 Q 440 536 540 520 Q 640 506 800 520 L 800 620 Q 560 610 400 618 Q 240 626 0 600 Z" fill="#1e1a24"/>

  <rect x="150" y="520" width="500" height="160" fill="url(#pan)"/>
  <path d="M150 520 Q 220 512 300 522 Q 400 534 500 520 Q 580 508 650 516 L 650 680 Q 500 672 400 678 Q 300 684 150 672 Z" fill="url(#pan)"/>

  <g class="shiver" stroke="url(#crack)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M220 560 l40 6 30 -8 24 10"/>
    <path d="M320 590 l36 0 26 8 18 -6"/>
    <path d="M420 566 l30 8 24 -4 20 10"/>
    <path d="M520 596 l34 -4 22 6 16 -8"/>
    <path d="M260 620 l28 6 22 -6 18 8"/>
    <path d="M420 630 l30 -6 20 6 16 -4"/>
    <path d="M330 650 l26 0 18 8 14 -4"/>
  </g>

  <g stroke="#1c140e" fill="none" stroke-linecap="round">
    <path d="M360 640 q -4 -60 -6 -100 q -2 -34 10 -58" stroke-width="12"/>
    <path d="M362 520 q 4 -40 26 -62 q 16 -16 34 -16" stroke-width="9"/>
    <path d="M392 444 q 14 -8 26 -4 q 10 4 16 14" stroke-width="5"/>
    <path d="M412 454 q 12 -10 20 -8 q 8 2 12 10" stroke-width="3.4"/>
    <path d="M368 500 q -22 -12 -34 -28 q -8 -12 -8 -26" stroke-width="8"/>
    <path d="M336 452 q -14 -12 -18 -24 q -4 -10 0 -20" stroke-width="4.5"/>
    <path d="M352 438 q -16 -6 -22 -2" stroke-width="3"/>
    <path d="M424 426 q 10 0 14 10" stroke-width="3"/>
  </g>

  <g stroke="#1c140e" fill="none" stroke-linecap="round">
    <path d="M470 650 q 2 -50 0 -86 q -2 -28 12 -46" stroke-width="10"/>
    <path d="M478 528 q 18 -24 44 -26 q 20 -2 34 12" stroke-width="7"/>
    <path d="M548 514 q 14 -10 24 -6 q 8 4 10 14" stroke-width="4"/>
    <path d="M486 512 q -16 -10 -24 -24 q -6 -10 -4 -22" stroke-width="6"/>
    <path d="M460 472 q -14 -8 -18 -20" stroke-width="3.4"/>
  </g>

  <g stroke="#1c140e" fill="none" stroke-linecap="round">
    <path d="M300 660 q -2 -40 -4 -66 q -2 -24 8 -38" stroke-width="9"/>
    <path d="M302 566 q 10 -20 28 -24 q 14 -4 24 8" stroke-width="6"/>
    <path d="M348 550 q 12 -8 20 -4" stroke-width="3.4"/>
    <path d="M308 552 q -14 -10 -20 -22" stroke-width="4.5"/>
    <path d="M298 536 q -12 -6 -16 -16" stroke-width="3"/>
  </g>

  <g class="shiver" fill="#3a3a58" opacity="0.5" filter="url(#glowSoft)">
    <ellipse cx="300" cy="668" rx="64" ry="8" transform="rotate(-2 300 668)"/>
    <ellipse cx="470" cy="656" rx="80" ry="9" transform="rotate(-2 470 656)"/>
    <ellipse cx="372" cy="648" rx="70" ry="8" transform="rotate(1 372 648)"/>
  </g>

  <g class="shiver" stroke="#5a4a68" stroke-width="2.4" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M360 660 l-40 30"/>
    <path d="M470 650 l-44 34"/>
    <path d="M300 660 l-34 26"/>
  </g>

  <rect x="0" y="700" width="800" height="100" fill="#2a2018"/>
  <g fill="#38281e" opacity="0.9">
    <path d="M0 710 Q 200 700 400 706 Q 600 712 800 702 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#44301f" opacity="0.85">
    <path d="M0 748 Q 260 738 400 744 Q 560 750 800 740 L 800 800 L 0 800 Z"/>
  </g>
  <path d="M0 700 q 120 -20 260 -14 q 140 6 280 0 q 140 -6 260 8" stroke="#e8a860" stroke-width="2" fill="none" opacity="0.3"/>
</svg>