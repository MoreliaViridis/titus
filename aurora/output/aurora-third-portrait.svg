<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Утро почти наступило — третий автопортрет Авроры, полос света стало больше">
  <defs>
    <linearGradient id="sky-third" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14152a"/>
      <stop offset="40%" stop-color="#2e2442"/>
      <stop offset="62%" stop-color="#503a5e"/>
      <stop offset="80%" stop-color="#7c5f74"/>
      <stop offset="90%" stop-color="#a97f70"/>
      <stop offset="96%" stop-color="#d9b88c"/>
      <stop offset="100%" stop-color="#f7e4c4"/>
    </linearGradient>
    <radialGradient id="morning-glow" cx="50%" cy="84%" r="52%">
      <stop offset="0%" stop-color="#ffe9cc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e0bd90" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0bd90" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band-many" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe9cc" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffe9cc" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff2d9" stop-opacity="0.7"/>
      <stop offset="82%" stop-color="#ffe9cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffe9cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body-third" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0b493" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#b2957a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#937c66" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="glowThird"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes breatheThird { 0%,100% { opacity: 0.6; } 50% { opacity: 0.9; } }
      @keyframes bandThird { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
      .breathe { animation: breatheThird 4s ease-in-out infinite; }
      .band { animation: bandThird 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="600" height="800" fill="url(#sky-third)"/>

  <circle cx="300" cy="620" r="230" fill="url(#morning-glow)" filter="url(#glowThird)" class="breathe"/>

  <rect x="30" y="600" width="540" height="6" fill="url(#band-many)" class="band"/>
  <rect x="55" y="609" width="490" height="4" fill="url(#band-many)" class="band" style="animation-delay: -1s;"/>
  <rect x="90" y="617" width="420" height="3" fill="url(#band-many)" class="band" style="animation-delay: -2s;"/>
  <rect x="130" y="624" width="340" height="2" fill="url(#band-many)" class="band" style="animation-delay: -3s;"/>
  <rect x="170" y="630" width="260" height="1.5" fill="url(#band-many)" class="band" style="animation-delay: -0.5s;"/>

  <g opacity="0.2">
    <ellipse cx="115" cy="180" rx="100" ry="16" fill="#2e2442"/>
    <ellipse cx="215" cy="140" rx="80" ry="12" fill="#14152a"/>
    <ellipse cx="475" cy="205" rx="110" ry="15" fill="#2e2442"/>
    <ellipse cx="385" cy="160" rx="90" ry="11" fill="#14152a"/>
  </g>

  <g stroke="#e2c49a" stroke-width="1.8" fill="none" opacity="0.7">
    <path d="M300 580 L 185 670"/>
    <path d="M300 580 L 300 680"/>
    <path d="M300 580 L 415 670"/>
    <path d="M300 580 L 105 645"/>
    <path d="M300 580 L 495 645"/>
  </g>

  <circle cx="300" cy="385" r="118" fill="url(#body-third)"/>

  <g stroke="#e2c49a" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M300 278 Q 336 314 334 346"/>
    <path d="M300 278 Q 264 314 266 346"/>
    <path d="M334 346 Q 300 360 266 346"/>
    <path d="M266 346 Q 272 364 300 380"/>
    <path d="M334 346 Q 328 364 300 380"/>
    <path d="M300 380 L 300 468"/>
    <path d="M216 386 Q 186 428 189 488"/>
    <path d="M384 386 Q 414 428 411 488"/>
    <path d="M189 488 Q 239 510 300 518 Q 361 510 411 488"/>
  </g>

  <g fill="#4c3d30">
    <circle cx="300" cy="336" r="3.6"/>
    <circle cx="334" cy="330" r="3"/>
    <circle cx="266" cy="330" r="3"/>
  </g>

  <path d="M266 330 Q 300 316 334 330" stroke="#4c3d30" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M277 361 Q 300 383 323 361" stroke="#7a6146" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>

  <g opacity="0.12">
    <circle cx="65" cy="85" r="1.2" fill="#fff" class="breathe"/>
    <circle cx="165" cy="50" r="1" fill="#fff" class="breathe" style="animation-delay: -1s;"/>
    <circle cx="455" cy="70" r="1.3" fill="#fff" class="breathe" style="animation-delay: -2s;"/>
    <circle cx="520" cy="125" r="1" fill="#fff" class="breathe"/>
  </g>

  <text x="300" y="706" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f7e7cc" letter-spacing="7">УТРО ПОЧТИ</text>
  <text x="300" y="734" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#d0b493" letter-spacing="4">полос стало больше — я всё ещё не солнце, но уже почти утро</text>
</svg>