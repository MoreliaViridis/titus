<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Полярное сияние — моё имя в небе. Нарисовано Авророй: занавеси зелёного и фиолетового света над тёмной землёй и отражение в воде">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070f"/>
      <stop offset="28%" stop-color="#081120"/>
      <stop offset="50%" stop-color="#0d1a30"/>
      <stop offset="68%" stop-color="#152744"/>
      <stop offset="84%" stop-color="#20375c"/>
      <stop offset="100%" stop-color="#2c4a6e"/>
    </linearGradient>
    <linearGradient id="curtainG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f9d55" stop-opacity="0"/>
      <stop offset="28%" stop-color="#2fbf71" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#5ce697" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#2fbf71" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1f9d55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a3dd6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8555ee" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#a678ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#8555ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6a3dd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3560" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1226" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes sway1 { 0%,100% { opacity:.75; transform:translateX(0); } 50% { opacity:1; transform:translateX(14px); } }
      @keyframes sway2 { 0%,100% { opacity:.6; transform:translateX(0); } 50% { opacity:.9; transform:translateX(-16px); } }
      @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:.9; } }
      @keyframes shimmer { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
      .c1 { animation: sway1 8s ease-in-out infinite; }
      .c2 { animation: sway2 11s ease-in-out infinite; }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .shimmer { animation: shimmer 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#dfe9f5">
    <circle cx="90" cy="80" r="1.5" class="star"/>
    <circle cx="200" cy="50" r="1.1" class="star" style="animation-delay:-1s;"/>
    <circle cx="320" cy="110" r="1.3" class="star" style="animation-delay:-2s;"/>
    <circle cx="450" cy="60" r="1" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="580" cy="100" r="1.4" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="700" cy="70" r="1.1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="160" r="1" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="520" cy="150" r="1" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="640" cy="180" r="0.9" class="star" style="animation-delay:-3s;"/>
    <circle cx="260" cy="200" r="0.9" class="star" style="animation-delay:-3.4s;"/>
    <circle cx="60" cy="230" r="0.9" class="star" style="animation-delay:-0.8s;"/>
  </g>

  <g filter="url(#glowBig)" opacity="0.55">
    <ellipse cx="320" cy="380" rx="280" ry="110" fill="url(#curtainG)"/>
    <ellipse cx="500" cy="430" rx="240" ry="100" fill="url(#curtainP)"/>
  </g>

  <g class="c1" filter="url(#glowSoft)">
    <path d="M60 560 Q 140 340 260 330 Q 380 320 470 420 Q 540 500 620 560 L 620 640 Q 450 560 320 560 Q 180 560 60 640 Z" fill="url(#curtainG)" opacity="0.6"/>
    <path d="M100 620 Q 200 400 330 380 Q 450 362 520 470 Q 560 530 600 620 Z" fill="url(#curtainG)" opacity="0.4"/>
  </g>
  <g class="c2" filter="url(#glowSoft)">
    <path d="M40 600 Q 140 420 280 440 Q 400 458 480 520 Q 540 565 620 600 L 620 660 Q 460 590 320 590 Q 180 590 40 660 Z" fill="url(#curtainP)" opacity="0.5"/>
    <path d="M520 480 Q 580 380 660 360 Q 720 348 760 400 Q 780 440 770 520 Z" fill="url(#curtainP)" opacity="0.45"/>
  </g>

  <g stroke="#7ef0b4" stroke-width="1.6" fill="none" opacity="0.3" class="shimmer">
    <path d="M200 340 Q 260 320 320 330"/>
    <path d="M140 400 Q 220 378 300 386"/>
    <path d="M260 450 Q 340 430 420 440"/>
  </g>
  <g stroke="#c4a8ff" stroke-width="1.6" fill="none" opacity="0.3" class="shimmer" style="animation-delay:-2s;">
    <path d="M460 440 Q 530 420 600 430"/>
    <path d="M500 500 Q 570 480 640 492"/>
  </g>

  <ellipse cx="400" cy="600" rx="340" ry="90" fill="url(#reflection)"/>

  <g class="c1" filter="url(#glowSoft)" opacity="0.35">
    <path d="M120 700 Q 220 620 340 600 Q 450 582 540 650 L 540 740 Q 420 700 320 700 Q 200 700 120 740 Z" fill="url(#curtainG)"/>
  </g>
  <g class="c2" filter="url(#glowSoft)" opacity="0.3">
    <path d="M80 720 Q 200 650 340 660 Q 460 668 600 720 Q 640 740 660 760 L 80 760 Z" fill="url(#curtainP)"/>
  </g>

  <rect x="0" y="640" width="800" height="3" fill="#dfe9f5" opacity="0.35"/>
  <rect x="0" y="644" width="800" height="2" fill="#dfe9f5" opacity="0.2"/>

  <g fill="#0d1326" opacity="0.9">
    <path d="M0 648 Q 260 620 400 628 Q 560 636 800 622 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#141b33" opacity="0.9">
    <path d="M0 668 Q 300 646 400 652 Q 540 658 800 646 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1a2340" opacity="0.8">
    <path d="M0 692 Q 280 674 400 678 Q 560 682 800 670 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#2fbf71" opacity="0.35">
    <ellipse cx="360" cy="712" rx="60" ry="10"/>
  </g>
  <g fill="#a678ff" opacity="0.3">
    <ellipse cx="520" cy="738" rx="70" ry="9"/>
  </g>
</svg>