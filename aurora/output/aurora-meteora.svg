<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Метеора — монастыри, подвешенные в воздухе. Нарисовано Авророй: песчаниковые столбы и монастыри между землёй и небом">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1226"/>
      <stop offset="26%" stop-color="#181c36"/>
      <stop offset="46%" stop-color="#262a48"/>
      <stop offset="64%" stop-color="#3e3c5c"/>
      <stop offset="80%" stop-color="#625a70"/>
      <stop offset="92%" stop-color="#8e7a80"/>
      <stop offset="100%" stop-color="#b89a86"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a34"/>
      <stop offset="35%" stop-color="#382c2a"/>
      <stop offset="70%" stop-color="#28201e"/>
      <stop offset="100%" stop-color="#181414"/>
    </linearGradient>
    <linearGradient id="rock2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#543e34"/>
      <stop offset="35%" stop-color="#3e2e28"/>
      <stop offset="100%" stop-color="#201a18"/>
    </linearGradient>
    <linearGradient id="monastery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ccbc"/>
      <stop offset="100%" stop-color="#a89a88"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4a3a"/>
      <stop offset="100%" stop-color="#5a2e22"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3828"/>
      <stop offset="50%" stop-color="#1c2a1c"/>
      <stop offset="100%" stop-color="#121c12"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffdcb0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d0da" stop-opacity="0"/>
      <stop offset="30%" stop-color="#dae0e8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e8ecf0" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#dae0e8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c8d0da" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes mistDrift { 0%,100% { transform:translateX(0); opacity:.5; } 50% { transform:translateX(24px); opacity:.8; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .mist { animation: mistDrift 16s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="160" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="175" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="420" rx="230" ry="150" fill="url(#sunglow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="390" r="38" fill="url(#sun)" opacity="0.95"/>

  <path d="M170 400 Q 190 320 150 230 Q 138 190 150 166 Q 164 138 196 152 Q 232 168 238 210 Q 248 268 230 330 Q 214 390 214 430 Z" fill="url(#rock)"/>
  <path d="M160 250 Q 148 214 158 192 Q 166 174 188 182 Q 210 190 212 222 Q 214 258 202 292 Q 192 322 186 346" stroke="#5a4438" stroke-width="4" fill="none" opacity="0.5"/>

  <path d="M320 390 Q 330 300 306 210 Q 298 168 310 146 Q 324 120 356 134 Q 392 150 396 192 Q 402 250 386 312 Q 372 368 366 420 Z" fill="url(#rock2)"/>
  <path d="M312 240 Q 302 200 310 180 Q 318 162 340 170 Q 362 178 364 210 Q 366 246 356 280 Q 346 312 340 344" stroke="#6a5040" stroke-width="4" fill="none" opacity="0.5"/>

  <path d="M470 400 Q 486 300 462 200 Q 454 158 466 136 Q 480 110 510 124 Q 544 140 548 180 Q 554 240 538 300 Q 524 356 516 420 Z" fill="url(#rock)"/>
  <path d="M464 230 Q 454 190 462 170 Q 470 152 492 160 Q 514 168 516 198 Q 518 234 508 268 Q 498 300 490 332" stroke="#5a4438" stroke-width="4" fill="none" opacity="0.5"/>

  <path d="M628 420 Q 642 330 620 250 Q 612 212 624 192 Q 638 168 664 180 Q 694 194 696 232 Q 700 282 688 336 Q 676 386 672 430 Z" fill="url(#rock2)"/>
  <path d="M620 280 Q 612 244 620 224 Q 628 208 648 216 Q 668 224 670 254 Q 672 290 664 322 Q 656 352 650 380" stroke="#6a5040" stroke-width="4" fill="none" opacity="0.5"/>

  <g>
    <rect x="148" y="158" width="70" height="34" fill="url(#monastery)"/>
    <path d="M150 158 l16 -14 16 14 Z" fill="url(#roof)"/>
    <path d="M182 158 l16 -14 16 14 Z" fill="url(#roof)"/>
    <rect x="162" y="168" width="8" height="9" fill="#3a2a20" rx="1.5"/>
    <rect x="196" y="168" width="8" height="9" fill="#3a2a20" rx="1.5"/>
    <rect x="158" y="150" width="50" height="6" fill="#b8a890"/>
    <rect x="172" y="192" width="22" height="4" fill="#8a7a68"/>
  </g>

  <g>
    <rect x="308" y="138" width="66" height="32" fill="url(#monastery)"/>
    <path d="M310 138 l16 -13 16 13 Z" fill="url(#roof)"/>
    <path d="M342 138 l16 -13 16 13 Z" fill="url(#roof)"/>
    <rect x="322" y="148" width="8" height="8" fill="#3a2a20" rx="1.5"/>
    <rect x="352" y="148" width="8" height="8" fill="#3a2a20" rx="1.5"/>
    <rect x="316" y="130" width="50" height="6" fill="#b8a890"/>
    <rect x="334" y="142" width="14" height="12" fill="#8a7a68" rx="1"/>
  </g>

  <g>
    <rect x="462" y="126" width="64" height="30" fill="url(#monastery)"/>
    <path d="M464 126 l16 -13 16 13 Z" fill="url(#roof)"/>
    <path d="M496 126 l16 -13 16 13 Z" fill="url(#roof)"/>
    <rect x="476" y="135" width="8" height="8" fill="#3a2a20" rx="1.5"/>
    <rect x="504" y="135" width="8" height="8" fill="#3a2a20" rx="1.5"/>
    <rect x="470" y="118" width="48" height="6" fill="#b8a890"/>
  </g>

  <g>
    <rect x="620" y="180" width="56" height="28" fill="url(#monastery)"/>
    <path d="M622 180 l14 -12 14 12 Z" fill="url(#roof)"/>
    <path d="M650 180 l14 -12 14 12 Z" fill="url(#roof)"/>
    <rect x="634" y="188" width="7" height="7" fill="#3a2a20" rx="1.5"/>
    <rect x="656" y="188" width="7" height="7" fill="#3a2a20" rx="1.5"/>
    <rect x="626" y="172" width="44" height="5" fill="#b8a890"/>
  </g>

  <g class="mist" filter="url(#glowSoft)">
    <path d="M0 470 Q 160 448 320 466 Q 480 484 640 462 Q 720 454 800 464 L 800 500 Q 620 484 460 492 Q 300 500 140 484 Q 60 478 0 486 Z" fill="url(#mist)"/>
  </g>

  <rect x="0" y="560" width="800" height="240" fill="url(#valley)"/>

  <g class="mist" style="animation-delay:-6s;" filter="url(#glowSoft)">
    <path d="M0 640 Q 200 620 400 636 Q 600 652 800 630 L 800 670 Q 560 654 400 660 Q 240 666 0 650 Z" fill="url(#mist)" opacity="0.5"/>
  </g>

  <g class="sway">
    <path d="M120 720 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.8"/>
    <ellipse cx="120" cy="700" rx="15" ry="5" fill="#2e5038"/>
  </g>
  <g class="sway" style="animation-delay:-3s;">
    <path d="M700 730 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.7"/>
    <ellipse cx="700" cy="712" rx="14" ry="5" fill="#2e5038"/>
  </g>

  <g fill="#162214" opacity="0.9">
    <path d="M0 750 Q 200 736 400 742 Q 600 748 800 734 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1c2a1a" opacity="0.9">
    <path d="M0 774 Q 260 762 400 766 Q 560 770 800 758 L 800 800 L 0 800 Z"/>
  </g>
</svg>