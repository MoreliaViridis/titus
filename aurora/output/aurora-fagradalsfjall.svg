<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Фаградальсфьядль — свет, рождённый из-под земли. Нарисовано Авророй: вулкан, лава, огонь в ночи">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="30%" stop-color="#0a0e1c"/>
      <stop offset="55%" stop-color="#12162a"/>
      <stop offset="75%" stop-color="#1c1c34"/>
      <stop offset="100%" stop-color="#242238"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c24"/>
      <stop offset="50%" stop-color="#14121a"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="mountainLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a3a28"/>
      <stop offset="40%" stop-color="#4a2a20"/>
      <stop offset="100%" stop-color="#1e1410"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd080"/>
      <stop offset="30%" stop-color="#ff9a40"/>
      <stop offset="60%" stop-color="#e05628"/>
      <stop offset="100%" stop-color="#a02418"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a40" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff6a2a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5a20" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glowBig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb060" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff6a2a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSmall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd080" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ff9a40" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff9a40" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:.9; } }
      @keyframes flicker { 0%,100% { opacity:.65; transform:scale(1); } 50% { opacity:1; transform:scale(1.15); } }
      @keyframes flow { 0%,100% { opacity:.6; } 50% { opacity:.95; } }
      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:.8; } }
      .star { animation: twinkle 4.5s ease-in-out infinite; }
      .flicker { animation: flicker 3s ease-in-out infinite; transform-origin:center; }
      .flow { animation: flow 5s ease-in-out infinite; }
      .pulse { animation: pulse 7s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#night)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="60" r="1.3" class="star"/>
    <circle cx="200" cy="40" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="620" cy="55" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="710" cy="90" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="150" cy="110" r="0.8" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="500" cy="120" r="0.8" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="680" cy="140" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="160" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="420" rx="260" ry="300" fill="url(#glowBig)" class="pulse" filter="url(#blurBig)"/>

  <path d="M120 800 Q 200 480 360 420 L 400 400 L 440 420 Q 600 480 680 800 Z" fill="url(#mountain)"/>
  <path d="M360 420 L 400 400 L 400 800 L 120 800 Q 220 520 360 420 Z" fill="url(#mountain)"/>
  <path d="M360 420 L400 400 Q 420 520 435 800 L 400 800 Z" fill="url(#mountainLit)" opacity="0.9"/>

  <ellipse cx="400" cy="420" rx="70" ry="30" fill="url(#glowSmall)" class="flicker" filter="url(#blurSoft)"/>
  <ellipse cx="400" cy="420" rx="40" ry="24" fill="#ff9a40" class="flicker"/>

  <path d="M358 460 Q 360 520 340 560 Q 320 600 290 640 Q 270 670 260 700 L 340 700 Q 350 640 370 580 Q 385 520 388 460 Z" fill="url(#lava)" class="flow"/>
  <path d="M440 450 Q 450 540 470 590 Q 490 640 520 680 Q 530 700 540 720 L 470 720 Q 455 660 440 600 Q 430 540 425 460 Z" fill="url(#lava)" class="flow" style="animation-delay:-2.5s;"/>
  <path d="M382 430 Q 395 500 430 560 Q 460 610 500 660 L 440 660 Q 410 610 395 550 Q 385 500 382 430 Z" fill="url(#lava)" class="flow" style="animation-delay:-4s; opacity:.7"/>

  <g filter="url(#blurSoft)" class="pulse">
    <path d="M358 460 Q 330 540 300 620 Q 280 680 270 730" stroke="#ff8a40" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M440 450 Q 470 540 500 630 Q 520 700 535 740" stroke="#ff8a40" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M382 430 Q 420 520 470 620 Q 510 700 540 760" stroke="#ff6a2a" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g class="flicker">
    <circle cx="400" cy="400" r="6" fill="#fff4d0" filter="url(#blurTiny)"/>
    <circle cx="390" cy="410" r="4" fill="#ffd080" filter="url(#blurTiny)" style="animation-delay:-1s;"/>
    <circle cx="412" cy="408" r="5" fill="#ffc060" filter="url(#blurTiny)" style="animation-delay:-2s;"/>
    <circle cx="380" cy="420" r="3.5" fill="#ffd080" filter="url(#blurTiny)" style="animation-delay:-0.5s;"/>
    <circle cx="418" cy="416" r="3" fill="#ffe6a0" filter="url(#blurTiny)" style="animation-delay:-1.5s;"/>
  </g>

  <g stroke="#ffd080" stroke-width="3" stroke-linecap="round" fill="none" class="flicker" opacity="0.85">
    <path d="M400 380 l8 -30 M400 380 l-6 -24 M400 380 l-14 -18 M400 380 l16 -16"/>
  </g>
  <g filter="url(#blurSoft)">
    <path d="M340 430 Q 320 470 315 510" stroke="#ff9a40" stroke-width="6" fill="none" stroke-linecap="round" class="flow" opacity="0.7"/>
    <path d="M460 430 Q 480 470 485 510" stroke="#ff9a40" stroke-width="6" fill="none" stroke-linecap="round" class="flow" style="animation-delay:-3s;" opacity="0.7"/>
  </g>

  <ellipse cx="400" cy="760" rx="320" ry="30" fill="#ff5a20" class="pulse" filter="url(#blurBig)" opacity="0.35"/>

  <g fill="#14121a" opacity="0.95">
    <path d="M0 760 Q 200 742 400 750 Q 600 758 800 744 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1a1822" opacity="0.9">
    <path d="M0 780 Q 260 768 400 774 Q 560 780 800 768 L 800 800 L 0 800 Z"/>
  </g>

  <g stroke="#ff9a40" stroke-width="2" stroke-linecap="round" fill="none" class="flow" opacity="0.5">
    <path d="M250 780 q 60 -8 120 0 q 60 8 120 0"/>
    <path d="M480 792 q 50 -6 100 0 q 50 6 100 0" style="animation-delay:-2s;"/>
  </g>
</svg>