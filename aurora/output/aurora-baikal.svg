<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Байкал — глубочайшее озеро мира. Нарисовано Авророй: синий лёд, пузырьки метана, берег в снегу, рассвет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1e"/>
      <stop offset="28%" stop-color="#161c3a"/>
      <stop offset="48%" stop-color="#262e50"/>
      <stop offset="66%" stop-color="#3e4668"/>
      <stop offset="82%" stop-color="#60647c"/>
      <stop offset="92%" stop-color="#8a888c"/>
      <stop offset="100%" stop-color="#b0a89c"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ac8e8"/>
      <stop offset="35%" stop-color="#5aacd0"/>
      <stop offset="65%" stop-color="#3890b8"/>
      <stop offset="100%" stop-color="#1c6c90"/>
    </linearGradient>
    <linearGradient id="iceDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3890b8"/>
      <stop offset="40%" stop-color="#1c6c90"/>
      <stop offset="100%" stop-color="#0e4868"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5070"/>
      <stop offset="35%" stop-color="#363c54"/>
      <stop offset="100%" stop-color="#1e2236"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8ecf0"/>
      <stop offset="50%" stop-color="#d0d8e0"/>
      <stop offset="100%" stop-color="#b0bcc8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#ffdcb8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a070" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffdcb0"/>
      <stop offset="100%" stop-color="#ffb878"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes iceGlow { 0%,100% { opacity:.5; } 50% { opacity:.85; } }
      @keyframes bubbleRise { 0%,100% { opacity:.4; transform:translateY(0); } 50% { opacity:.9; transform:translateY(-4px); } }
      @keyframes shimmer { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .iceGlow { animation: iceGlow 8s ease-in-out infinite; }
      .bubble { animation: bubbleRise 5s ease-in-out infinite; }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
  </g>

  <ellipse cx="400" cy="400" rx="220" ry="130" fill="url(#sunGlow)" filter="url(#glowBig)"/>
  <circle cx="400" cy="378" r="32" fill="url(#sun)" opacity="0.95"/>

  <path d="M0 380 L240 320 Q 300 306 360 320 L500 380 Z" fill="url(#mountain)"/>
  <path d="M400 380 L600 310 Q 660 296 720 310 L800 370 Z" fill="url(#mountain)" opacity="0.85"/>
  <path d="M200 370 L320 316 Q 360 304 400 316 L500 370 Z" fill="url(#mountain)" opacity="0.7"/>
  <path d="M0 390 L220 336 L800 390 Z" fill="url(#mountain)" opacity="0.5"/>

  <g fill="url(#snow)">
    <path d="M240 320 Q 280 310 320 316 L310 326 Q 280 320 240 326 Z"/>
    <path d="M600 310 Q 630 302 665 310 L655 320 Q 625 314 600 320 Z"/>
  </g>

  <rect x="0" y="480" width="800" height="320" fill="url(#ice)"/>

  <g class="shimmer" filter="url(#glowBig)">
    <ellipse cx="400" cy="550" rx="340" ry="80" fill="#6ab8d8" opacity="0.55"/>
    <ellipse cx="400" cy="600" rx="300" ry="60" fill="#3890b8" opacity="0.45"/>
  </g>

  <g stroke="#d0e8f4" stroke-width="3" stroke-linecap="round" fill="none" class="iceGlow" opacity="0.6">
    <path d="M120 520 q 40 -10 80 0 q 40 10 80 0"/>
    <path d="M360 560 q 50 -10 100 0 q 50 10 100 0" style="animation-delay:-3s;"/>
    <path d="M240 640 q 60 -10 120 0 q 60 10 120 0" style="animation-delay:-5s;"/>
    <path d="M500 500 q 40 -10 80 0 q 40 10 80 0"/>
  </g>

  <g stroke="#e8f4fc" stroke-width="1.6" stroke-linecap="round" fill="none" class="iceGlow" opacity="0.4">
    <path d="M260 540 q 20 -5 40 0 q 20 5 40 0"/>
    <path d="M440 580 q 24 -5 48 0 q 24 5 48 0"/>
    <path d="M320 680 q 30 -6 60 0 q 30 6 60 0"/>
  </g>

  <g class="bubble" fill="#b8e0f4">
    <circle cx="280" cy="560" r="4.5"/>
    <circle cx="350" cy="580" r="3" style="animation-delay:-1s;"/>
    <circle cx="460" cy="540" r="5" style="animation-delay:-2s;"/>
    <circle cx="520" cy="600" r="4" style="animation-delay:-3s;"/>
    <circle cx="180" cy="620" r="3.5" style="animation-delay:-4s;"/>
    <circle cx="600" cy="560" r="3.8" style="animation-delay:-1.5s;"/>
    <circle cx="320" cy="640" r="4.2" style="animation-delay:-2.5s;"/>
    <circle cx="480" cy="660" r="3.2" style="animation-delay:-3.5s;"/>
  </g>

  <g class="bubble" fill="#c8e8fc" filter="url(#glowTiny)">
    <circle cx="300" cy="590" r="2" style="animation-delay:-0.5s;"/>
    <circle cx="400" cy="560" r="2.4" style="animation-delay:-1.8s;"/>
    <circle cx="500" cy="580" r="1.8" style="animation-delay:-2.8s;"/>
    <circle cx="220" cy="650" r="2.2" style="animation-delay:-3.8s;"/>
    <circle cx="560" cy="620" r="2" style="animation-delay:-1.2s;"/>
    <circle cx="360" cy="680" r="2.6" style="animation-delay:-2.2s;"/>
  </g>

  <rect x="0" y="696" width="800" height="4" fill="#d0e8f4" opacity="0.3"/>
  <g fill="#0e4868" opacity="0.8">
    <path d="M0 700 Q 200 690 400 696 Q 600 702 800 692 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#0e3e58" opacity="0.9">
    <path d="M0 740 Q 260 728 400 734 Q 560 740 800 728 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#0e3450" opacity="0.85">
    <path d="M0 772 Q 280 762 400 768 Q 560 774 800 762 L 800 800 L 0 800 Z"/>
  </g>
</svg>