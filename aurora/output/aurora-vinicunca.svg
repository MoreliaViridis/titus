<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Виникунка — Радужная гора. Нарисовано Авророй: гора семи цветов в Андах, снег, рассвет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1024"/>
      <stop offset="24%" stop-color="#141a38"/>
      <stop offset="44%" stop-color="#202848"/>
      <stop offset="62%" stop-color="#343c5c"/>
      <stop offset="78%" stop-color="#5a5e72"/>
      <stop offset="90%" stop-color="#8a8078"/>
      <stop offset="100%" stop-color="#b09a80"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dce8f0"/>
      <stop offset="100%" stop-color="#b8c8d8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5a3c"/>
      <stop offset="50%" stop-color="#3a4a30"/>
      <stop offset="100%" stop-color="#222c1e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe0b0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a878" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8a878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
      @keyframes cloud { 0%,100% { transform:translateX(0); opacity:.45; } 50% { transform:translateX(20px); opacity:.75; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      .sway { animation: sway 8s ease-in-out infinite; }
      .cloud { animation: cloud 16s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="500" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="620" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="720" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="145" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="135" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="170" r="0.8" class="star" style="animation-delay:-3s;"/>
  </g>

  <ellipse cx="400" cy="360" rx="250" ry="150" fill="url(#sunGlow)" class="breathe" filter="url(#glowBig)"/>
  <circle cx="400" cy="344" r="34" fill="url(#sun)" opacity="0.95"/>

  <path d="M0 460 Q 160 430 280 446 Q 400 462 520 444 Q 640 426 800 450 L 800 470 L 0 470 Z" fill="#2c3428" opacity="0.4"/>

  <g>
    <path d="M120 700 L300 200 L340 300 L380 260 L420 360 L400 400 L420 700 Z" fill="#b8562e"/>
    <path d="M300 200 L340 300 L380 260 L420 360 L400 400 L340 380 L300 200 Z" fill="#e0a82e"/>
    <path d="M180 420 L300 200 L340 300 L300 380 Z" fill="#6ab84e"/>
    <path d="M240 520 L180 420 Q 200 380 220 430 L 260 520 Z" fill="#58a8b8"/>
    <path d="M140 620 L180 420 L240 520 Z" fill="#6a5aa0"/>
    <path d="M420 700 L400 400 L460 380 L520 260 L560 380 L600 700 Z" fill="#58a8b8"/>
    <path d="M460 380 L520 260 L560 380 Q 520 420 460 380 Z" fill="#c86a2e"/>
    <path d="M520 260 L580 180 L640 300 L600 360 Z" fill="#e88a2e"/>
    <path d="M580 180 L640 300 L680 420 L660 700 L580 700 L560 380 Z" fill="#8a6a4a"/>
    <path d="M640 300 L680 420 L720 380 L700 300 Z" fill="#6ab84e"/>
    <path d="M660 700 L680 420 L720 700 Z" fill="#a84a2a"/>
    <path d="M80 700 L140 620 L180 420 L220 700 Z" fill="#8a5a8a"/>
  </g>

  <path d="M300 200 L340 300 L380 260 L420 360 L400 400 L340 380 Z" fill="url(#snow)" opacity="0.9"/>
  <path d="M300 200 L330 220 L340 300 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M580 180 L640 300 L620 220 Z" fill="url(#snow)" opacity="0.85"/>

  <g stroke="#e8d8b0" stroke-width="2" fill="none" opacity="0.3" class="cloud">
    <path d="M200 340 Q 240 320 280 340 Q 320 360 290 368 Q 240 376 200 358 Z"/>
    <path d="M520 300 Q 560 280 600 300 Q 620 314 600 322 Q 560 330 530 316 Z"/>
  </g>

  <rect x="0" y="700" width="800" height="100" fill="url(#ground)"/>

  <g class="sway">
    <path d="M90 740 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.8"/>
    <ellipse cx="90" cy="722" rx="14" ry="5" fill="#2e5038"/>
  </g>
  <g class="sway" style="animation-delay:-3s;">
    <path d="M710 748 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="#4a7a58" opacity="0.7"/>
    <ellipse cx="710" cy="730" rx="13" ry="5" fill="#2e5038"/>
  </g>

  <g fill="#1c2818" opacity="0.95">
    <path d="M0 762 Q 200 748 400 754 Q 600 760 800 746 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#24301e" opacity="0.9">
    <path d="M0 786 Q 260 774 400 780 Q 560 786 800 772 L 800 800 L 0 800 Z"/>
  </g>
</svg>