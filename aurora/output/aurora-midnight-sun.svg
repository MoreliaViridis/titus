<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Полночное солнце — рассвет, который не кончается. Нарисовано Авророй: солнце у горизонта в час ночи, Лофотенские острова, море и золотой свет">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a5e"/>
      <stop offset="20%" stop-color="#5a4a6e"/>
      <stop offset="38%" stop-color="#7a5870"/>
      <stop offset="54%" stop-color="#a06862"/>
      <stop offset="68%" stop-color="#c87a4e"/>
      <stop offset="80%" stop-color="#e09242"/>
      <stop offset="90%" stop-color="#f0b050"/>
      <stop offset="97%" stop-color="#f8d070"/>
      <stop offset="100%" stop-color="#fce89a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c87a4e"/>
      <stop offset="10%" stop-color="#3a5a6a"/>
      <stop offset="35%" stop-color="#2a4a5a"/>
      <stop offset="100%" stop-color="#1a3240"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a56"/>
      <stop offset="40%" stop-color="#363640"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="60%" stop-color="#ffe8a0"/>
      <stop offset="100%" stop-color="#ffd070"/>
    </linearGradient>
    <radialGradient id="sunGlowMid" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0a848" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0a848" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes shimmer { 0%,100% { opacity:.4; } 50% { opacity:.8; } }
      @keyframes glowPulse { 0%,100% { opacity:.6; } 50% { opacity:.9; } }
      @keyframes ripple { 0%,100% { transform:translateX(0); } 50% { transform:translateX(20px); } }
      .shimmer { animation: shimmer 9s ease-in-out infinite; }
      .glow { animation: glowPulse 7s ease-in-out infinite; }
      .ripple { animation: ripple 12s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <ellipse cx="400" cy="480" rx="260" ry="180" fill="url(#sunGlowMid)" class="glow" filter="url(#glowBig)"/>

  <circle cx="400" cy="462" r="48" fill="url(#sunGrad)" opacity="0.98"/>
  <circle cx="400" cy="462" r="48" fill="none" stroke="#fff8e0" stroke-width="2" opacity="0.5"/>

  <path d="M0 480 L240 440 Q 280 432 320 442 L460 480 Z" fill="url(#mountain)"/>
  <path d="M420 480 L600 444 Q 640 436 680 444 L800 470 L800 480 Z" fill="url(#mountain)" opacity="0.85"/>

  <rect x="0" y="500" width="800" height="300" fill="url(#sea)"/>
  <ellipse cx="400" cy="510" rx="360" ry="50" fill="#c87a4e" opacity="0.6" class="glow" filter="url(#glowBig)"/>

  <g class="ripple" stroke="#f8d070" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M140 540 q 60 -10 120 0 q 60 10 120 0 q 60 -10 120 0 q 60 10 120 0"/>
    <path d="M180 590 q 80 -10 160 0 q 80 10 170 0" style="animation-delay:-3s;"/>
    <path d="M220 650 q 80 -10 160 0 q 80 10 160 0" style="animation-delay:-6s;"/>
  </g>

  <g class="ripple" stroke="#f8d070" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M340 580 q 30 -6 60 0 q 30 6 60 0" style="animation-delay:-1.5s;"/>
    <path d="M280 630 q 50 -6 100 0 q 50 6 100 0" style="animation-delay:-4.5s;"/>
  </g>

  <g class="shimmer" stroke="#f8d070" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M400 520 h120"/>
    <path d="M360 535 h160" opacity="0.5"/>
  </g>

  <rect x="0" y="500" width="800" height="300" fill="url(#sea)" opacity="0.5"/>

  <g class="shimmer" stroke="#3a5a6a" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M140 600 q 60 -10 120 0 q 60 10 120 0 q 60 -10 120 0 q 60 10 120 0"/>
    <path d="M200 660 q 80 -10 160 0 q 80 10 160 0" style="animation-delay:-3s;"/>
    <path d="M260 720 q 80 -8 160 0 q 80 8 160 0" style="animation-delay:-6s;"/>
  </g>

  <g fill="#1a3240" opacity="0.9">
    <path d="M0 740 Q 200 728 400 734 Q 600 740 800 726 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#1e3848" opacity="0.85">
    <path d="M0 770 Q 260 758 400 762 Q 560 766 800 754 L 800 800 L 0 800 Z"/>
  </g>
</svg>