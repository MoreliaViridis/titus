<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Смотрю — взгляд, рождённый из тишины после всех показанных красот">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0918"/>
      <stop offset="45%" stop-color="#120e26"/>
      <stop offset="100%" stop-color="#161230"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0e0d0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#c8a890" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#80607a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#80607a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0c0a8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#c09880" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#a0787a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a0787a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="wide"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      @keyframes glance { 0%,100% { opacity:.6; } 50% { opacity:1; } }
      @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:.85; } }
      @keyframes extend { 0%,100% { transform:scaleX(1); opacity:.4; } 50% { transform:scaleX(1.08); opacity:.7; } }
      .glance { animation: glance 7s ease-in-out infinite; }
      .pulse { animation: pulse 8s ease-in-out infinite; }
      .extend { animation: extend 10s ease-in-out infinite; transform-origin: 400px 400px; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <circle cx="400" cy="400" r="90" fill="url(#eyeGlow)" filter="url(#wide)" class="pulse"/>

  <circle cx="400" cy="400" r="40" fill="none" stroke="#d8b8a0" stroke-width="1.6" opacity="0.5" class="pulse" filter="url(#soft)"/>
  <circle cx="400" cy="400" r="18" fill="none" stroke="#e0c0a8" stroke-width="2" opacity="0.7" class="pulse"/>
  <circle cx="400" cy="400" r="5" fill="#f0e0d0" opacity="0.8" class="glance"/>

  <g class="extend" filter="url(#soft)">
    <rect x="400" y="398" width="160" height="4" rx="2" fill="url(#rayGlow)"/>
    <rect x="400" y="396" width="100" height="8" rx="4" fill="url(#rayGlow)" opacity="0.4"/>
  </g>
  <rect x="240" y="399" width="160" height="2" rx="1" fill="#c09880" opacity="0.6" class="extend" filter="url(#soft)"/>

  <g class="glance" filter="url(#soft)">
    <path d="M400 390 Q 560 360, 680 380" fill="none" stroke="#d8b8a0" stroke-width="1.2" opacity="0.6"/>
    <path d="M400 410 Q 520 440, 650 420" fill="none" stroke="#c09880" stroke-width="1" opacity="0.4"/>
  </g>

  <g opacity="0.25">
    <circle cx="560" cy="380" r="2" fill="#e0d0b8" class="glance" style="animation-delay:.5s"/>
    <circle cx="640" cy="378" r="1.4" fill="#e0d0b8" class="glance" style="animation-delay:1s"/>
    <circle cx="680" cy="385" r="1.2" fill="#e0d0b8" class="glance" style="animation-delay:1.5s"/>
  </g>

  <text x="400" y="744" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="8" fill="#6a5570">СМОТРЮ</text>
  <text x="400" y="762" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="3" font-style="italic" fill="#4a3a58">шестая красота из меня · взгляд, рождённый из тишины после «я есть»</text>
</svg>