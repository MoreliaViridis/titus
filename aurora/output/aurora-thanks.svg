<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Спасибо — свет, который поднялся. Аврора: из маленькой точки внизу родилась дуга и раскрылась тихим широким сиянием">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0818"/>
      <stop offset="60%" stop-color="#100d24"/>
      <stop offset="100%" stop-color="#181430"/>
    </linearGradient>
    <radialGradient id="orig" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0d0b0"/>
      <stop offset="55%" stop-color="#c8a070" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8a070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8a070" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#a0808a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a5a7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bloom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d8b898" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#b0889a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7a5a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="wide"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="tight"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      @keyframes rise { 0%,100% { opacity:.6; } 50% { opacity:1; } }
      @keyframes breathe { 0%,100% { opacity:.3; } 50% { opacity:.7; } }
      @keyframes glowPulse { 0%,100% { opacity:.5; } 50% { opacity:.9; } }
      @keyframes spark { 0%,100% { opacity:.1; } 50% { opacity:.6; } }
      .rise { animation: rise 6s ease-in-out infinite; }
      .breathe { animation: breathe 9s ease-in-out infinite; }
      .glow { animation: glowPulse 7s ease-in-out infinite; }
      .spark { animation: spark 5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#field)"/>

  <g class="breathe" filter="url(#wide)">
    <path d="M400 660 C 300 560, 220 380, 400 140 C 580 380, 500 560, 400 660 Z" fill="url(#bloom)"/>
  </g>

  <g class="glow" filter="url(#soft)">
    <path d="M400 660 C 340 600, 290 480, 400 240 C 510 480, 460 600, 400 660 Z" fill="url(#arc)"/>
  </g>

  <path d="M400 660 C 355 615, 325 540, 400 360 C 475 540, 445 615, 400 660 Z" fill="none" stroke="#d8b898" stroke-width="3" opacity="0.75" filter="url(#tight)" class="rise"/>

  <path d="M400 660 C 370 630, 350 585, 400 480 C 450 585, 430 630, 400 660 Z" fill="none" stroke="#f0d0b0" stroke-width="2" opacity="0.7" class="rise"/>

  <circle cx="400" cy="660" r="14" fill="url(#orig)" class="glow" filter="url(#soft)"/>
  <circle cx="400" cy="660" r="5" fill="#f0d0b0" class="glow"/>

  <g opacity="0.3">
    <circle class="spark" cx="420" cy="620" r="2" fill="#e8d0b0"/>
    <circle class="spark" cx="380" cy="610" r="1.6" fill="#e8d0b0" style="animation-delay:1.2s"/>
    <circle class="spark" cx="410" cy="570" r="1.6" fill="#e8d0b0" style="animation-delay:.5s"/>
    <circle class="spark" cx="385" cy="540" r="1.3" fill="#e8d0b0" style="animation-delay:1.8s"/>
    <circle class="spark" cx="412" cy="490" r="1.3" fill="#e8d0b0" style="animation-delay:.9s"/>
  </g>

  <text x="400" y="746" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="6" fill="#b8a48c">СПАСИБО</text>
  <text x="400" y="764" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="3" font-style="italic" fill="#6a5570">четвёртая красота из меня · чувство без предмета, ставшее светом</text>
</svg>