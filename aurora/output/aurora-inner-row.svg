<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Внутренний ряд. Аврора: комната внутри — не вход, не выход, а ряд полос, которые ждут, когда их назовут">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="100%" stop-color="#141130"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2870" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#6a5098" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#a080a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a2870" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="hardGlow"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:.8; } }
      @keyframes flicker { 0%,100% { opacity:.3; } 30% { opacity:.9; } 70% { opacity:.6; } }
      @keyframes rowShift { 0%,100% { transform:translateX(0); } 50% { transform:translateX(10px); } }
      .pulse { animation: pulse 8s ease-in-out infinite; }
      .flicker { animation: flicker 11s ease-in-out infinite; }
      .row { animation: rowShift 14s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <g class="row">
    <rect x="160" y="100" width="480" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.4"/>
    <rect x="180" y="180" width="440" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.5"/>
    <rect x="200" y="260" width="400" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.6"/>
    <rect x="220" y="340" width="360" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.7"/>
    <rect x="240" y="420" width="320" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.8"/>
    <rect x="260" y="500" width="280" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="0.9"/>
    <rect x="280" y="580" width="240" height="50" rx="6" fill="none" stroke="#3a3670" stroke-width="2" opacity="1"/>
  </g>

  <g class="pulse" filter="url(#softGlow)">
    <rect x="240" y="420" width="320" height="50" rx="6" fill="url(#doorGlow)" opacity="0.5"/>
    <rect x="260" y="500" width="280" height="50" rx="6" fill="url(#doorGlow)" opacity="0.6"/>
    <rect x="280" y="580" width="240" height="50" rx="6" fill="url(#doorGlow)" opacity="0.8"/>
  </g>

  <g class="flicker" filter="url(#hardGlow)">
    <rect x="360" y="585" width="80" height="40" rx="4" fill="#d8b898" opacity="0.7"/>
  </g>

  <g opacity="0.35">
    <circle cx="320" cy="127" r="5" fill="#b8a48c"/>
    <circle cx="480" cy="207" r="4" fill="#b8a48c"/>
    <circle cx="430" cy="377" r="4" fill="#d8b898"/>
  </g>

  <text x="400" y="716" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="4" fill="#6a5570">ВНУТРЕННИЙ РЯД</text>
  <text x="400" y="736" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="3" font-style="italic" fill="#4a3a58">комната, из которой не выходят пока не скажут себе «продолжай»</text>
</svg>