<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ньюгрейндж — свет, входящий в сердце тьмы. Нарисовано Авророй: курган-гробница, коридор, луч солнцестояния, заливающий камеру">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1024"/>
      <stop offset="26%" stop-color="#161a34"/>
      <stop offset="46%" stop-color="#242844"/>
      <stop offset="64%" stop-color="#3a3c58"/>
      <stop offset="80%" stop-color="#5e5c70"/>
      <stop offset="92%" stop-color="#8a7e82"/>
      <stop offset="100%" stop-color="#b4a086"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3a2a"/>
      <stop offset="40%" stop-color="#243020"/>
      <stop offset="100%" stop-color="#141c10"/>
    </linearGradient>
    <linearGradient id="stoneWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a443a"/>
      <stop offset="40%" stop-color="#38332c"/>
      <stop offset="100%" stop-color="#201c18"/>
    </linearGradient>
    <linearGradient id="chamber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a624e"/>
      <stop offset="50%" stop-color="#4a4436"/>
      <stop offset="100%" stop-color="#2c2820"/>
    </linearGradient>
    <linearGradient id="beamGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe8b0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0c078" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0c078" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff0c8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e8b878" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8b878" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glowTiny"><feGaussianBlur stdDeviation="2.5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
      @keyframes beamPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes chamberGlow { 0%,100% { opacity:.5; } 50% { opacity:.95; } }
      @keyframes drift { 0%,100% { transform:translateX(0); opacity:.5; } 50% { transform:translateX(10px); opacity:.8; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .beam { animation: beamPulse 7s ease-in-out infinite; }
      .chamber { animation: chamberGlow 7s ease-in-out infinite; }
      .drift { animation: drift 12s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#c8d4e8">
    <circle cx="80" cy="70" r="1.3" class="star"/>
    <circle cx="200" cy="45" r="1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="95" r="1.1" class="star" style="animation-delay:-2s;"/>
    <circle cx="490" cy="55" r="0.9" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.2" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.8" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.8" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="160" r="0.8" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="175" r="0.7" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="170" cy="330" rx="80" ry="80" fill="url(#sunGlow)" filter="url(#glowBig)"/>
  <circle cx="170" cy="330" r="30" fill="#fff4dc" opacity="0.95"/>
  <circle cx="170" cy="330" r="30" fill="none" stroke="#ffe0a8" stroke-width="1.5" opacity="0.6"/>

  <path d="M0 500 Q 160 430 300 468 Q 440 506 560 464 Q 680 422 800 480 L 800 800 L 0 800 Z" fill="url(#hill)"/>

  <g class="drift" opacity="0.5" filter="url(#glowSoft)">
    <path d="M120 460 q 60 -12 120 0 q 60 12 120 0" stroke="#7a946e" stroke-width="2.5" fill="none"/>
    <path d="M460 520 q 70 -12 140 0 q 70 12 140 0" stroke="#7a946e" stroke-width="2.5" fill="none" style="animation-delay:-4s;"/>
  </g>

  <g>
    <path d="M560 440 L560 600 L760 600 L760 440 Z" fill="url(#stoneWall)" opacity="0.6"/>

    <path d="M460 470 L460 620 L700 620 L700 470 Z" fill="url(#stoneWall)"/>

    <path d="M300 500 L300 620 L660 620 L660 500 Z" fill="url(#stoneWall)"/>

    <path d="M220 540 L220 620 L620 620 L620 540 Z" fill="url(#stoneWall)"/>

    <path d="M180 570 L180 620 L560 620 L560 570 Z" fill="url(#stoneWall)"/>

    <rect x="120" y="510" width="160" height="110" fill="url(#chamber)"/>
    <path d="M120 510 L160 470 L600 470 L600 510 Z" fill="url(#stoneWall)"/>
    <path d="M280 510 L280 570 L560 570 L560 510 Z" fill="url(#stoneWall)"/>
  </g>

  <g stroke="#5a5242" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M180 560 q 24 -8 48 0 q 24 8 48 0"/>
    <path d="M300 520 q 30 -8 60 0 q 30 8 60 0"/>
    <path d="M440 540 q 28 -8 56 0"/>
  </g>

  <path d="M148 470 L172 470 L172 600 L148 600 Z" fill="#3a3424"/>
  <path d="M160 462 L160 470" stroke="#6a624e" stroke-width="4" stroke-linecap="round"/>
  <rect x="150" y="462" width="20" height="10" fill="#4a4436"/>

  <g class="beam" stroke="url(#beamGold)" stroke-width="10" stroke-linecap="round">
    <path d="M172 470 L120 470 L120 520 L600 520 L600 470 L596 470"/>
    <path d="M172 470 L600 600 L600 620 L220 620 L220 560"/>
  </g>

  <ellipse cx="340" cy="560" rx="150" ry="40" fill="#f0c078" class="chamber" filter="url(#glowSoft)" opacity="0.5"/>
  <ellipse cx="340" cy="560" rx="90" ry="24" fill="#ffe8b0" class="chamber" filter="url(#glowBig)" opacity="0.4"/>

  <g class="beam" filter="url(#glowSoft)">
    <path d="M180 470 l120 130" stroke="#ffe8b0" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M200 470 l160 130" stroke="#f0c078" stroke-width="4" stroke-linecap="round" opacity="0.5" style="animation-delay:-2s;"/>
  </g>

  <g fill="#26241c" class="drift" opacity="0.6">
    <ellipse cx="340" cy="620" rx="130" ry="14"/>
    <ellipse cx="420" cy="640" rx="100" ry="10" opacity="0.5"/>
  </g>

  <g stroke="#8a9466" stroke-width="2.5" stroke-linecap="round" fill="none" class="drift" opacity="0.4">
    <path d="M560 500 q 20 -30 40 -24"/>
    <path d="M620 480 q 18 -26 40 -22"/>
  </g>

  <rect x="0" y="600" width="800" height="200" fill="url(#hill)"/>
  <g fill="#1a2416" opacity="0.9">
    <path d="M0 640 Q 200 624 400 632 Q 600 640 800 626 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#202c1c" opacity="0.9">
    <path d="M0 690 Q 260 678 400 684 Q 560 690 800 676 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#26341e" opacity="0.8">
    <path d="M0 740 Q 280 728 400 734 Q 560 740 800 726 L 800 800 L 0 800 Z"/>
  </g>

  <g fill="#4a7a58" opacity="0.8">
    <path d="M80 720 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" class="drift"/>
    <path d="M720 740 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" class="drift" style="animation-delay:-3s;"/>
  </g>
</svg>