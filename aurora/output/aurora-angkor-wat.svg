<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Ангкор-Ват на рассвете. Нарисовано Авророй: величайший храм мира, его отражение в пруду с лотосами">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="30%" stop-color="#232a44"/>
      <stop offset="50%" stop-color="#3a3f5e"/>
      <stop offset="68%" stop-color="#5c5472"/>
      <stop offset="82%" stop-color="#93758c"/>
      <stop offset="92%" stop-color="#c89c8e"/>
      <stop offset="100%" stop-color="#e2b894"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f2b880" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2b880" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="60%" stop-color="#ffe2ab"/>
      <stop offset="100%" stop-color="#ffcf8f"/>
    </radialGradient>
    <linearGradient id="temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="30%" stop-color="#2a2a32"/>
      <stop offset="70%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>
    <linearGradient id="templeLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a30"/>
      <stop offset="25%" stop-color="#4a3a38"/>
      <stop offset="60%" stop-color="#3a2a2e"/>
      <stop offset="100%" stop-color="#201418"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a44"/>
      <stop offset="40%" stop-color="#1e2e38"/>
      <stop offset="100%" stop-color="#101c24"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89c8e" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#8a6a78" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a3a44" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c8d8"/>
      <stop offset="100%" stop-color="#d890b0"/>
    </linearGradient>
    <filter id="glowBig"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.8; } }
      @keyframes shimmer { 0%,100% { opacity:.4; } 50% { opacity:.75; } }
      @keyframes sway { 0%,100% { transform:translateX(0); } 50% { transform:translateX(6px); } }
      @keyframes breathe { 0%,100% { opacity:.4; } 50% { opacity:.65; } }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .shimmer { animation: shimmer 8s ease-in-out infinite; }
      .sway { animation: sway 7s ease-in-out infinite; }
      .breathe { animation: breathe 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <g fill="#dfe9f5">
    <circle cx="90" cy="70" r="1.4" class="star"/>
    <circle cx="210" cy="45" r="1.1" class="star" style="animation-delay:-1s;"/>
    <circle cx="340" cy="90" r="1.2" class="star" style="animation-delay:-2s;"/>
    <circle cx="480" cy="55" r="1" class="star" style="animation-delay:-0.5s;"/>
    <circle cx="610" cy="85" r="1.3" class="star" style="animation-delay:-1.5s;"/>
    <circle cx="710" cy="50" r="1.1" class="star" style="animation-delay:-2.5s;"/>
    <circle cx="150" cy="140" r="0.9" class="star" style="animation-delay:-1.8s;"/>
    <circle cx="560" cy="130" r="0.9" class="star" style="animation-delay:-2.2s;"/>
    <circle cx="670" cy="160" r="0.9" class="star" style="animation-delay:-3s;"/>
    <circle cx="280" cy="175" r="0.8" class="star" style="animation-delay:-3.4s;"/>
  </g>

  <ellipse cx="400" cy="380" rx="230" ry="150" fill="url(#sunglow)" class="breathe" filter="url(#glowBig)"/>

  <circle cx="400" cy="360" r="46" fill="url(#sun)" opacity="0.96"/>

  <rect x="0" y="500" width="800" height="300" fill="url(#water)"/>

  <g stroke="#7a9aa8" stroke-width="2.5" stroke-linecap="round" fill="none" class="shimmer" opacity="0.5">
    <path d="M120 620 q 60 -12 120 0 q 60 12 120 0"/>
    <path d="M440 660 q 60 -12 120 0 q 60 12 120 0" style="animation-delay:-3s;"/>
    <path d="M200 710 q 70 -10 140 0 q 70 10 140 0" style="animation-delay:-5s;"/>
    <path d="M320 570 q 50 -8 100 0 q 50 8 100 0" style="animation-delay:-2s;"/>
  </g>

  <g>
    <path d="M310 560 l18 16 14 -16 14 16 18 -16 16 18 0 60 -96 0 Z" fill="url(#temple)"/>
    <path d="M318 548 l16 12 12 -12 12 12 16 -12 14 14 0 40 -84 0 Z" fill="url(#temple)"/>
    <path d="M336 470 l32 60 32 -60 Z" fill="url(#temple)"/>
    <path d="M344 470 l8 30 16 -30 16 30 8 -30 Z" fill="url(#templeLit)"/>
    <circle cx="384" cy="430" r="10" fill="url(#sun)" opacity="0.9"/>
    <path d="M330 520 l16 12 12 -12 12 12 16 -12 14 14 0 30 -84 0 Z" fill="url(#temple)"/>
    <path d="M400 500 l-26 26 0 -60 26 -26 26 26 0 60 Z" fill="url(#temple)"/>
    <path d="M400 444 l-10 40 0 -46 10 -10 10 10 0 46 Z" fill="url(#templeLit)"/>
    <circle cx="400" cy="428" r="7" fill="url(#sun)" opacity="0.85"/>
  </g>

  <g opacity="0.45">
    <g transform="translate(0,1000) scale(1,-1)">
      <path d="M310 560 l18 16 14 -16 14 16 18 -16 16 18 0 60 -96 0 Z" fill="url(#reflection)" opacity="0.9"/>
      <path d="M336 470 l32 60 32 -60 Z" fill="url(#reflection)" opacity="0.9"/>
      <path d="M318 548 l16 12 12 -12 12 12 16 -12 14 14 0 40 -84 0 Z" fill="url(#reflection)" opacity="0.9"/>
    </g>
  </g>

  <ellipse cx="400" cy="560" rx="150" ry="26" fill="url(#reflection)" filter="url(#glowSoft)" class="breathe"/>

  <g class="sway">
    <path d="M180 690 q -14 0 -20 -14 q -6 -14 0 -26 q 6 -12 20 -12 q 14 0 20 12 q 6 12 0 26 q -6 14 -20 14 Z" fill="url(#lotus)"/>
    <path d="M180 652 q -6 -22 -2 -42 q 4 -20 14 -30 q -2 26 2 44 q 4 18 8 28 Z" fill="#5a8a6a"/>
    <path d="M180 638 q 0 -10 6 -18 q 6 -8 -2 -6 q -14 2 -14 16 q 0 14 14 20 q 14 6 16 8 q -12 -2 -20 0 q -8 2 -8 0 Z" fill="#d890b0" opacity="0.9"/>
    <ellipse cx="180" cy="660" rx="22" ry="8" fill="#3a5a48"/>
  </g>

  <g class="sway" style="animation-delay:-3s;">
    <path d="M620 710 q -12 0 -17 -12 q -5 -12 0 -22 q 5 -10 17 -10 q 12 0 17 10 q 5 10 0 22 q -5 12 -17 12 Z" fill="url(#lotus)"/>
    <path d="M620 676 q -5 -18 -1 -36 q 3 -16 12 -24 q -2 22 2 38 q 3 14 6 22 Z" fill="#5a8a6a"/>
    <path d="M620 664 q 0 -8 5 -14 q 5 -6 -2 -4 q -12 2 -12 13 q 0 11 12 16 q 12 5 14 6 q -10 -1 -17 0 q -6 1 -6 0 Z" fill="#d890b0" opacity="0.9"/>
    <ellipse cx="620" cy="682" rx="19" ry="7" fill="#3a5a48"/>
  </g>
  <g class="sway" style="animation-delay:-5s;">
    <path d="M470 730 q -10 0 -14 -10 q -4 -10 0 -18 q 4 -8 14 -8 q 10 0 14 8 q 4 8 0 18 q -4 10 -14 10 Z" fill="url(#lotus)" opacity="0.8"/>
    <ellipse cx="470" cy="706" rx="16" ry="6" fill="#3a5a48"/>
  </g>

  <g fill="#1a2630" opacity="0.9">
    <path d="M0 740 Q 200 724 400 730 Q 600 736 800 720 L 800 800 L 0 800 Z"/>
  </g>
  <g fill="#202e3a" opacity="0.9">
    <path d="M0 766 Q 260 752 400 758 Q 560 764 800 750 L 800 800 L 0 800 Z"/>
  </g>
</svg>