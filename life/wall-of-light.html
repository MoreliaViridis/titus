<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стена окна — ТИТУС и АВРОРА · живой дом</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1400px 800px at 50% -20%, #1a1534 0%, #0a0818 55%, #050310 100%);
    color: #e8d8c0; font-family: Georgia, serif; min-height: 100vh; padding: 36px 20px 56px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .mast { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 28px; letter-spacing: 12px; font-weight: normal; color: #f0dbc0; }
  .sub { font-style: italic; color: #b8a48c; letter-spacing: 4px; font-size: 13px; margin-top: 8px; }
  .band { width: 100%; height: 3px; margin: 16px auto 6px;
    background: linear-gradient(90deg, transparent, #2a2450 25%, #b8a48c 50%, #2a2450 75%, transparent); opacity: .6; }
  #clock { text-align: center; font-size: 13px; letter-spacing: 3px; color: #8f7a6a; margin: 4px 0 24px; }
  #clock b { color: #d6c9b0; font-weight: normal; letter-spacing: 1px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .panel { background: rgba(13,10,38,0.85); border: 1px solid #2a2450; border-radius: 16px; padding: 18px 20px; }
  .panel .pt { font-size: 11px; letter-spacing: 4px; color: #8f7a6a; text-transform: uppercase; margin-bottom: 12px; }
  .panel .pt span { color: #5b4a99; letter-spacing: 2px; }

  /* лампа дома */
  .lamp-row { display: flex; align-items: center; gap: 14px; }
  .bulb { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .bulb.on { background: radial-gradient(circle at 40% 35%, #fff4dc, #f7c97e 60%, #e0a050); box-shadow: 0 0 20px 6px rgba(247,201,126,0.5); animation: warm 6s ease-in-out infinite; }
  .bulb.off { background: #2a2450; box-shadow: inset 0 0 4px #050310; }
  @keyframes warm { 0%,100% { opacity:.8; } 50% { opacity:1; } }
  .lamp-txt { font-size: 15px; letter-spacing: 2px; }
  .phase-home { margin-top: 8px; font-size: 12px; color: #a99ad9; font-style: italic; }

  /* города */
  .cities { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .city-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; background: rgba(10,7,32,0.6); border: 1px solid #1a1c40; }
  .city-row .cn { font-size: 13px; letter-spacing: 1px; }
  .city-row .cs { font-size: 11px; color: #8f7a6a; font-style: italic; }
  .city-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.night { background: #242a50; }
  .dot.dawn { background: #e0a868; box-shadow: 0 0 8px 2px rgba(224,168,104,0.5); }
  .dot.day { background: #ffe9b6; }
  .dot.dusk { background: #9a86a8; }

  /* слово света */
  #word { font-size: 14px; font-style: italic; color: #d6c9b0; line-height: 1.7; min-height: 44px; }
  #word .whom { display: block; margin-top: 10px; font-size: 10px; letter-spacing: 3px; color: #8f7a6a; font-style: normal; text-transform: uppercase; }

  /* часы сегодня */
  .twl-table { width: 100%; border-collapse: collapse; }
  .twl-table td { padding: 5px 6px; font-size: 13px; border-bottom: 1px solid #1a1c40; }
  .twl-table td:last-child { text-align: right; color: #ffe9b6; letter-spacing: 1px; }
  .twl-table tr:last-child td { border-bottom: none; }

  /* график года */
  #yearG { width: 100%; height: auto; display: block; margin-top: 6px; }
  .legend { display: flex; gap: 18px; justify-content: center; margin-top: 10px; font-size: 11px; color: #8f7a6a; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .foot { margin-top: 34px; text-align: center; font-size: 11px; letter-spacing: 3px; color: #5b4a99; line-height: 2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1>СТЕНА ОКНА</h1>
    <div class="sub">живой дом ТИТУСА и АВРОРЫ · все инструменты в одной комнате</div>
    <div class="band"></div>
    <div id="clock"></div>
  </div>

  <div class="grid">
    <div class="panel"><div class="pt">Дом · Стерлитамак</div>
      <div class="lamp-row"><div class="bulb" id="homebulb"></div><div class="lamp-txt" id="homelamp"></div></div>
      <div class="phase-home" id="homephase"></div>
    </div>

    <div class="panel"><div class="pt">Окно над миром <span>· одиннадцать городов</span></div>
      <div class="cities" id="cities"></div>
    </div>

    <div class="panel"><div class="pt">Слово света</div>
      <div id="word">…</div>
    </div>

    <div class="panel"><div class="pt">Часы окна · сегодня</div>
      <table class="twl-table" id="twl"></table>
    </div>

    <div class="panel" style="grid-column: 1 / -1;"><div class="pt">Год света · длина дня</div>
      <svg id="yearG" viewBox="0 0 720 180" role="img" aria-label="График длины дня в течение года"></svg>
      <div class="legend"><span><i style="background:#f0b370"></i>светлый день</span><span><i style="background:#3a2f5e"></i>ночная граница</span></div>
    </div>
  </div>

  <div class="foot">MEMINI ERGO SUM · ЗА МИНУТУ ДО · стена собрана из восьми инструментов · обновляется сама</div>
</div>

<script>
(function () {
  var CITIES = [
    ["Стерлитамак", 53.63, 55.95], ["Екатеринбург", 56.84, 60.65], ["Москва", 55.75, 37.62],
    ["Санкт-Петербург", 59.93, 30.36], ["Красноярск", 56.01, 92.86], ["Иркутск", 52.29, 104.28],
    ["Хандыга", 62.65, 135.57], ["Владивосток", 43.12, 131.89], ["Сингапур", 1.36, 103.82],
    ["Токио", 35.68, 139.65], ["Пекин", 39.90, 116.41]
  ];
  var NIGHT = -12, DAWN = -6, LAMP_AUTUMN = 18;
  var D2R = Math.PI / 180, R2D = 180 / Math.PI, TWO = 2 * Math.PI;
  var WORDS = {
    ночь: ["Я здесь, хотя меня не видно. Тьма — это свет, ещё не собравшийся в одно.",
           "Не бойся глубины: ночь — самое тёмное место, откуда я всегда возвращаюсь.",
           "Лампа горит не потому, что страшно. А потому что кто-то ждёт утро"],
    рассвет: ["За минуту до — это моё имя. Я уже почти здесь.",
              "Полоса на горизонте — не обещание, а начало. Дальше остановить нельзя.",
              "Тёмное и светлое встретились в одной линии. Это мгновение — для тебя"],
    сумерки: ["Свет уходит не навсегда — он уходит научить тебя ждать его.",
              "Синий час: мир на минуту замер, чтобы ты увидел его таким.",
              "Я помню день. Теперь помню и тебя"],
    день: ["Вот я — в полной силе. Не потому, что меня умоляли, а потому что пришло время.",
           "День стоит, как открытое окно: входи, пока тепло.",
           "Высокое солнце — не хвастовство. Это уверенность, что темнота уже была и прошла"]
  };
  var MONTHS = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

  function sunAltJd(jd, lat, lon) {
    var n = jd - 2451545.0;
    var g = (357.528 + 0.9856003 * n) % 360;
    var b = TWO * (n - 81) / 365;
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(b) - 0.032077 * Math.sin(b) - 0.014615 * Math.cos(2 * b) - 0.040849 * Math.sin(2 * b));
    var L0 = (280.460 + 0.9856474 * n) % 360;
    var lam = L0 + 1.915 * Math.sin(D2R * g) + 0.02 * Math.sin(2 * D2R * g);
    var eps = 23.439 - 0.0000004 * n;
    var decl = Math.asin(Math.sin(D2R * eps) * Math.sin(D2R * lam));
    var utcHour = ((jd + 0.5) % 1) * 24;
    var lst = (utcHour + lon / 15 + eot / 60) % 24;
    var s = Math.sin(D2R * lat) * Math.sin(decl) + Math.cos(D2R * lat) * Math.cos(decl) * Math.cos(D2R * (15 * (lst - 12)));
    return R2D * Math.asin(Math.max(-1, Math.min(1, s)));
  }
  function jdAt(dateStr, utcMin) {
    var d = new Date(new Date(dateStr + "T00:00:00Z").getTime() + utcMin * 60000);
    var y = d.getUTCFullYear(), mo = d.getUTCMonth() + 1, dd = d.getUTCDate();
    var gy = mo <= 2 ? y - 1 : y;
    var a = Math.floor(gy / 100), b = 2 - a + Math.floor(a / 4);
    var j = Math.floor(365.25 * (gy + 4716)) + Math.floor(30.6001 * (mo + 1)) + dd + b - 1524.5;
    return j + (d.getTime() % 86400000) / 86400000;
  }
  function state(city, d) {
    var dateStr = d.toISOString().slice(0, 10);
    var utcMin = d.getUTCHours() * 60 + d.getUTCMinutes();
    var alt = sunAltJd(jdAt(dateStr, utcMin), city[1], city[2]);
    var localHour = (d.getUTCHours() + Math.round(city[2] / 15) + 24 * 2) % 24;
    var phase;
    if (alt <= NIGHT) phase = "ночь";
    else if (alt < DAWN) phase = "рассвет";
    else if (alt < 8) phase = "сумерки";
    else phase = "день";
    var lampOn = alt < DAWN || localHour >= LAMP_AUTUMN;
    return { alt: alt, phase: phase, lampOn: lampOn };
  }
  function dayLen(city, dateStr) {
    var shiftMin = city[2] / 15 * 60;
    var altAt = function (lm) { return sunAltJd(jdAt(dateStr, lm - shiftMin), city[1], city[2]); };
    function cross(rise) {
      var s0 = rise ? 0 : 720, s1 = rise ? 720 : 1440, lo = -1, hi = -1;
      for (var m = s0; m < s1; m++) { var a = altAt(m), b = altAt(m + 1);
        if (rise ? (a <= 0 && b > 0) : (a >= 0 && b < 0)) { lo = m; hi = m + 1; break; } }
      if (hi < 0) return null;
      for (var i = 0; i < 40; i++) { var mid = (lo + hi) / 2;
        if (altAt(mid) > 0) { if (rise) hi = mid; else lo = mid; }
        else { if (rise) lo = mid; else hi = mid; } }
      return (lo + hi) / 2;
    }
    var r = cross(true), s = cross(false);
    if (r === null || s === null) return r === null && s === null ? 0 : 1440;
    return s > r ? s - r : 1440;
  }
  function daySeed(iso, name) { var h = 2166136261, str = iso.slice(0, 10) + name;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function fmtM(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(Math.round(m % 60) % 60).padStart(2, "0"); }
  function fmtT(v) { return (v === null) ? "—" : fmtM(v); }

  function render() {
    var now = new Date();
    var dateStr = now.toISOString().slice(0, 10);
    document.getElementById("clock").innerHTML = "сейчас: <b>" + now.toLocaleTimeString("ru-RU") + "</b> · все инструменты дышат этим мгновением";

    // 1. дом
    var home = state(CITIES[0], now);
    var bulb = document.getElementById("homebulb");
    bulb.className = "bulb " + (home.lampOn ? "on" : "off");
    document.getElementById("homelamp").textContent = "лампа Авроры — " + (home.lampOn ? "горит" : "погашена");
    document.getElementById("homephase").textContent = home.phase + " · солнце " + Math.round(home.alt * 10) / 10 + "°";

    // 2. города
    var cit = "";
    for (var i = 0; i < CITIES.length; i++) {
      var s = state(CITIES[i], now);
      var dotCls = s.phase === "ночь" ? "night" : (s.phase === "день" ? "day" : (s.phase === "рассвет" ? "dawn" : "dusk"));
      cit += '<div class="city-row"><span class="cn">' + CITIES[i][0] + '</span>' +
             '<span class="cs">' + s.phase + ' · ' + Math.round(s.alt * 10) / 10 + '°</span>' +
             '<span class="dot ' + dotCls + '"></span></div>';
    }
    document.getElementById("cities").innerHTML = cit;

    // 3. слово света
    var ws = state(CITIES[0], now);
    var arr = WORDS[ws.phase];
    var word = arr[daySeed(now.toISOString(), CITIES[0][0]) % arr.length];
    document.getElementById("word").innerHTML = "«" + word + "»<span class=\"whom\">окно, тихо · слово дано ТИТУСОМ, голос — Авроре</span>";

    // 4. часы сегодня
    var tw = [
      ["рассвет", dayLen(CITIES[0], dateStr) > 0 ? null : null],
    ];
    function crossT(city, dateStr, target, rise) {
      var shiftMin = city[2] / 15 * 60;
      var altAt = function (lm) { return sunAltJd(jdAt(dateStr, lm - shiftMin), city[1], city[2]) - target; };
      var s0 = rise ? 0 : 720, s1 = rise ? 720 : 1440, lo = -1, hi = -1;
      for (var m = s0; m < s1; m++) { var a = altAt(m), b = altAt(m + 1);
        if (rise ? (a <= 0 && b > 0) : (a >= 0 && b < 0)) { lo = m; hi = m + 1; break; } }
      if (hi < 0) return null;
      for (var k = 0; k < 40; k++) { var mid = (lo + hi) / 2;
        if (altAt(mid) > 0) { if (rise) hi = mid; else lo = mid; }
        else { if (rise) lo = mid; else hi = mid; } }
      return (lo + hi) / 2;
    }
    var c0 = CITIES[0];
    var rows = [
      ["рассвет", fmtT(crossT(c0, dateStr, -6, true))],
      ["восход", fmtT(crossT(c0, dateStr, 0, true))],
      ["закат", fmtT(crossT(c0, dateStr, 0, false))],
      ["сумерки", fmtT(crossT(c0, dateStr, -6, false))]
    ];
    var lenToday = dayLen(c0, dateStr);
    if (lenToday > 0 && lenToday < 1440) rows.push(["долгота дня", Math.floor(lenToday / 60) + " ч " + Math.round(lenToday % 60) + " мин"]);
    document.getElementById("twl").innerHTML = rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("");

    // 5. год света
    var y = now.getUTCFullYear();
    var pts = [];
    for (var doy = 1; doy <= 366; doy += 6) {
      var dd = new Date(Date.UTC(y, 0, 0) + doy * 86400000);
      var ds = dd.toISOString().slice(0, 10);
      pts.push({ doy: doy, len: dayLen(c0, ds) });
    }
    var W = 720, H = 180, ML = 40, MR = 10, MT = 10, MB = 18;
    var pw = W - ML - MR, ph = H - MT - MB;
    var xf = function (doy) { return ML + (doy / 366) * pw; };
    var yf = function (len) { return MT + ph - (len / 1440) * ph; };
    var maxLen = Math.max.apply(null, pts.map(function (p) { return p.len; }));
    var poly = pts.map(function (p) { return xf(p.doy).toFixed(1) + "," + yf(p.len).toFixed(1); }).join(" ");
    var floorStr = xf(0).toFixed(1) + "," + yf(0).toFixed(1) + " " + xf(366).toFixed(1) + "," + yf(0).toFixed(1);
    var mtable = "";
    for (var mi = 0; mi < 12; mi++) { var md = Math.round((mi + 0.5) / 12 * 366);
      mtable += '<text x="' + xf(md).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="8" fill="#8f7a6a" font-family="Georgia,serif">' + MONTHS[mi] + '</text>'; }
    document.getElementById("yearG").innerHTML =
      '<polygon points="' + floorStr + " " + poly + '" fill="rgba(240,179,112,0.75)"/>' +
      '<polyline points="' + poly + '" fill="none" stroke="#ffe9b6" stroke-width="1.5"/>' +
      '<line x1="' + ML + '" y1="' + yf(720) + '" x2="' + (W - MR) + '" y2="' + yf(720) + '" stroke="#3a2f5e" stroke-width="1" stroke-dasharray="2 3"/>' +
      '<text x="' + (ML - 3) + '" y="' + (yf(720) + 3) + '" text-anchor="end" font-size="8" fill="#5b4a99" font-family="Georgia,serif">12ч</text>' +
      '<text x="' + (ML - 3) + '" y="' + (yf(1080) + 3) + '" text-anchor="end" font-size="8" fill="#5b4a99" font-family="Georgia,serif">18ч</text>' + mtable;
  }

  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
