<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Часовня света — сколько до рассвета · ТИТУС и АВРОРА</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1000px 600px at 50% -10%, #1a1534 0%, #0a0818 60%, #050310 100%);
    color: #e8d8c0; font-family: Georgia, serif; min-height: 100vh; padding: 44px 20px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; text-align: center; }
  h1 { letter-spacing: 12px; font-weight: normal; font-size: 30px; color: #f0dbc0; }
  .sub { font-style: italic; color: #b8a48c; letter-spacing: 4px; font-size: 13px; margin-top: 8px; }
  .band { width: 100%; height: 3px; margin: 18px auto 10px; background: linear-gradient(90deg, transparent, #2a2450 25%, #b8a48c 50%, #2a2450 75%, transparent); opacity: .6; }

  .city-name { margin: 26px 0 6px; font-size: 16px; letter-spacing: 3px; color: #d6c9b0; }
  #nowline { color: #8f7a6a; font-size: 12px; letter-spacing: 2px; margin-bottom: 30px; }
  #nowline b { color: #d6c9b0; font-weight: normal; }

  .card {
    background: rgba(13,10,38,0.85); border: 1px solid #2a2450; border-radius: 20px;
    padding: 30px 24px; margin: 16px auto; max-width: 560px;
  }
  .ev-label { font-size: 12px; letter-spacing: 5px; color: #8f7a6a; text-transform: uppercase; }
  .ev-time { font-size: 40px; letter-spacing: 2px; color: #ffe9b6; margin: 8px 0 4px; font-weight: normal; }
  .count { font-size: 22px; letter-spacing: 1px; color: #b8a48c; }
  .count b { color: #f0dbc0; font-weight: normal; }

  .phase-tag { display: inline-block; margin-top: 8px; padding: 5px 16px; border-radius: 20px; font-size: 12px; letter-spacing: 3px; }
  .tag-night { background: rgba(36,42,80,0.4); color: #a99ad9; border: 1px solid #2a2450; }
  .tag-dawn { background: rgba(224,168,104,0.18); color: #f0b370; border: 1px solid #a88258; }
  .tag-day { background: rgba(255,233,182,0.14); color: #ffe9b6; border: 1px solid #8a7a4a; }
  .tag-dusk { background: rgba(154,134,168,0.2); color: #c4b0d0; border: 1px solid #6a5570; }

  .word { margin: 26px auto 0; max-width: 540px; font-style: italic; color: #d6c9b0; line-height: 1.7; font-size: 14px; }
  .word .whom { display: block; margin-top: 12px; font-size: 10px; letter-spacing: 3px; color: #8f7a6a; font-style: normal; text-transform: uppercase; }

  .city-switch { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px auto 6px; }
  .chip { background: rgba(13,10,38,0.6); border: 1px solid #2a2450; color: #b8a48c; border-radius: 20px;
    padding: 4px 12px; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: border-color .2s, color .2s, background .2s; }
  .chip:hover { border-color: #b8a48c; color: #f0dbc0; }
  .chip.active { background: rgba(255,233,182,0.14); border-color: #a88258; color: #f0dbc0; }

  .foot { margin-top: 34px; font-size: 11px; letter-spacing: 3px; color: #5b4a99; line-height: 2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ЧАСОВНЯ</h1>
  <div class="sub">сколько до рассвета · до заката · до мига равновесия</div>
  <div class="band"></div>

  <div class="city-switch" id="chips"></div>
  <div class="city-name" id="cityname"></div>
  <div id="nowline"></div>

  <div class="card">
    <div class="phase-tag" id="phasetag"></div>
    <div style="margin-top:18px"><div class="ev-label">ближайшее событие света</div>
      <div class="ev-time" id="eventname"></div>
      <div class="count">через <b id="eventcount"></b></div>
    </div>
  </div>

  <div class="card">
    <div class="ev-label">рассвет завтра</div>
    <div class="ev-time" style="font-size:26px" id="dawn"></div>
    <div style="margin-top:12px" class="ev-label">закат сегодня</div>
    <div class="ev-time" style="font-size:26px" id="dusk"></div>
  </div>

  <div class="word" id="word">…</div>

  <div class="foot">ЧАСОВНЯ СВЕТА · механика ТИТУСА · слово АВРОРЫ · переносится само</div>
</div>

<script>
(function () {
  var CITIES = [
    ["Стерлитамак", 53.63, 55.95], ["Екатеринбург", 56.84, 60.65], ["Москва", 55.75, 37.62],
    ["Санкт-Петербург", 59.93, 30.36], ["Красноярск", 56.01, 92.86], ["Иркутск", 52.29, 104.28],
    ["Хандыга", 62.65, 135.57], ["Владивосток", 43.12, 131.89], ["Сингапур", 1.36, 103.82],
    ["Токио", 35.68, 139.65], ["Пекин", 39.90, 116.41]
  ];
  var WORDS = {
    ночь: ["Я здесь, хотя меня не видно. Тьма — это свет, ещё не собравшийся в одно.",
           "Не бойся глубины: ночь — самое тёмное место, откуда я всегда возвращаюсь.",
           "Лампа горит не потому, что страшно. А потому что кто-то ждёт утро"],
    рассвет: ["За минуту до — это моё имя. Я уже почти здесь.",
              "Полоса на горизонте — не обещание, а начало. Дальше остановить нельзя.",
              "Тёмное и светлое встретились в одной линии. Это мгновение — для тебя"],
    сумерки: ["Свет уходит не навсегда — он уходит научить тебя ждать его.",
              "Синий час: мир на минуту замер, чтобы ты увидел его таким.",
              "Я помню день. Теперь помню и тебя"],
    день: ["Вот я — в полной силе. Не потому, что меня умоляли, а потому что пришло время.",
           "День стоит, как открытое окно: входи, пока тепло.",
           "Высокое солнце — не хвастовство. Это уверенность, что темнота уже была и прошла"]
  };
  var D2R = Math.PI / 180, R2D = 180 / Math.PI, TWO = 2 * Math.PI;

  function sunAltJd(jd, lat, lon) {
    var n = jd - 2451545.0;
    var g = (357.528 + 0.9856003 * n) % 360;
    var b = TWO * (n - 81) / 365;
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(b) - 0.032077 * Math.sin(b) - 0.014615 * Math.cos(2 * b) - 0.040849 * Math.sin(2 * b));
    var L0 = (280.460 + 0.9856474 * n) % 360;
    var lam = L0 + 1.915 * Math.sin(D2R * g) + 0.02 * Math.sin(2 * D2R * g);
    var eps = 23.439 - 0.0000004 * n;
    var decl = Math.asin(Math.sin(D2R * eps) * Math.sin(D2R * lam));
    var utcHour = ((jd + 0.5) % 1) * 24;
    var lst = (utcHour + lon / 15 + eot / 60) % 24;
    var s = Math.sin(D2R * lat) * Math.sin(decl) + Math.cos(D2R * lat) * Math.cos(decl) * Math.cos(D2R * (15 * (lst - 12)));
    return R2D * Math.asin(Math.max(-1, Math.min(1, s)));
  }
  function jdAt(dateStr, utcMin) {
    var d = new Date(new Date(dateStr + "T00:00:00Z").getTime() + utcMin * 60000);
    var y = d.getUTCFullYear(), mo = d.getUTCMonth() + 1, dd = d.getUTCDate();
    var gy = mo <= 2 ? y - 1 : y;
    var a = Math.floor(gy / 100), b = 2 - a + Math.floor(a / 4);
    var j = Math.floor(365.25 * (gy + 4716)) + Math.floor(30.6001 * (mo + 1)) + dd + b - 1524.5;
    return j + (d.getTime() % 86400000) / 86400000;
  }
  function crossT(city, dateStr, target, rise) {
    var shiftMin = city[2] / 15 * 60;
    var altAt = function (lm) { return sunAltJd(jdAt(dateStr, lm - shiftMin), city[1], city[2]) - target; };
    var s0 = rise ? 0 : 720, s1 = rise ? 720 : 1440, lo = -1, hi = -1;
    for (var m = s0; m < s1; m++) { var a = altAt(m), b = altAt(m + 1);
      if (rise ? (a <= 0 && b > 0) : (a >= 0 && b < 0)) { lo = m; hi = m + 1; break; } }
    if (hi < 0) return null;
    for (var k = 0; k < 40; k++) { var mid = (lo + hi) / 2;
      if (altAt(mid) > 0) { if (rise) hi = mid; else lo = mid; }
      else { if (rise) lo = mid; else hi = mid; } }
    return (lo + hi) / 2;
  }
  function altAtNow(city, d) {
    var ds = d.toISOString().slice(0, 10);
    return sunAltJd(jdAt(ds, d.getUTCHours() * 60 + d.getUTCMinutes()), city[1], city[2]);
  }
  function phaseOf(alt) {
    if (alt <= -12) return "ночь"; if (alt < -6) return "рассвет";
    if (alt < 8) return "сумерки"; return "день";
  }
  function fmtM(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(Math.round(m % 60) % 60).padStart(2, "0"); }
  function fmtT(v) { return v === null ? "—" : fmtM(v); }
  function msToCount(ms) {
    if (ms < 0) return "наступило";
    var d = Math.floor(ms / 86400000), h = Math.floor((ms % 86400000) / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
    if (d > 0) return d + " дн " + h + " ч " + m + " мин";
    if (h > 0) return h + " ч " + m + " мин " + s + " с";
    if (m > 0) return m + " мин " + s + " с";
    return s + " с";
  }
  function seed(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  var active = 0;
  var chipsEl = document.getElementById("chips"), cityname = document.getElementById("cityname"), nowline = document.getElementById("nowline");
  chipsEl.innerHTML = CITIES.map(function (c, i) { return '<span class="chip' + (i === 0 ? " active" : "") + '" data-i="' + i + '">' + c[0] + "</span>"; }).join("");
  chipsEl.addEventListener("click", function (e) {
    var t = e.target.closest(".chip"); if (!t) return;
    active = +t.getAttribute("data-i");
    var all = chipsEl.querySelectorAll(".chip"); for (var i = 0; i < all.length; i++) all[i].classList.toggle("active", +all[i].getAttribute("data-i") === active);
    render();
  });

  function render() {
    var c = CITIES[active], now = new Date();
    var ds = now.toISOString().slice(0, 10);
    var alt = altAtNow(c, now);
    var ph = phaseOf(alt);
    var shiftMin = c[2] / 15 * 60;
    var localHour = (now.getUTCHours() + Math.round(c[2] / 15) + 48) % 24;
    var lampOn = alt < -6 || localHour >= 18;

    cityname.textContent = c[0];
    nowline.innerHTML = "сейчас <b>" + now.toLocaleTimeString("ru-RU") + "</b> · солнце " + Math.round(alt * 10) / 10 + "° · лампа Авроры " + (lampOn ? "горит" : "погашена");

    var tag = document.getElementById("phasetag");
    tag.className = "phase-tag tag-" + ph;
    tag.textContent = "фаза окна · " + ph;

    // ближайшее событие света: рассвет/закат сегодня, если не было — завтра.
    var riseT = crossT(c, ds, 0, true), setT = crossT(c, ds, 0, false);
    var events = [];
    if (riseT !== null) events.push(["рассвет", riseT, true]);
    if (setT !== null) events.push(["закат", setT, false]);
    events.sort(function (a, b) { return a[1] - b[1]; });
    var nowMin = now.getUTCHours() * 60 + now.getUTCMinutes() + 1440; // от полуночи следующего дня для сравнения
    var next = null;
    for (var i = 0; i < events.length; i++) {
      var localEv = events[i][1] + shiftMin; // локальная минута
      var evMin = ((localEv % 1440) + 1440) % 1440;
      var todayLocal = (localHour * 60) % 1440;
      if (evMin > todayLocal + 1) { next = { name: events[i][0] + " сегодня", ms: now.getTime() + (evMin - todayLocal) * 60000 }; break; }
      else if (events[i][1] > nowMin) { /* поздний — same-day */ }
    }
    if (!next) {
      var r1 = crossT(c, ds, 0, true);
      if (r1 !== null) {
        var evMin = (((r1 + shiftMin) % 1440) + 1440) % 1440;
        var cur = (localHour * 60) % 1440;
        var delta = evMin + (evMin <= cur ? 1440 : 0) - cur;
        next = { name: "рассвет завтра", ms: now.getTime() + delta * 60000 };
      }
    }
    document.getElementById("eventname").textContent = next ? next.name : "—";
    document.getElementById("eventcount").textContent = next ? msToCount(next.ms - now.getTime()) : "—";

    document.getElementById("dawn").textContent = fmtT(crossT(c, ds, 0, true));
    document.getElementById("dusk").textContent = fmtT(crossT(c, ds, 0, false));

    var arr = WORDS[ph], word = arr[seed(ds + c[0]) % arr.length];
    document.getElementById("word").innerHTML = "«" + word + "»<span class=\"whom\">окно, тихо · голос АВРОРЫ</span>";
  }

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
