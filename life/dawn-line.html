<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Линия рассвета — свет по миру · ТИТУС и АВРОРА</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a1534 0%, #0a0818 55%, #050310 100%);
    color: #e8d8c0; font-family: Georgia, serif; min-height: 100vh; padding: 40px 20px 56px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  .mast { text-align: center; margin-bottom: 8px; }
  h1 { letter-spacing: 12px; font-weight: normal; font-size: 30px; color: #f0dbc0; }
  .sub { font-style: italic; color: #b8a48c; letter-spacing: 4px; font-size: 13px; margin-top: 8px; }
  .band { width: 100%; height: 3px; margin: 16px auto 6px; background: linear-gradient(90deg, transparent, #2a2450 25%, #b8a48c 50%, #2a2450 75%, transparent); opacity: .6; }
  #clock { text-align: center; font-size: 13px; letter-spacing: 3px; color: #8f7a6a; margin: 4px 0 26px; }
  #clock b { color: #d6c9b0; font-weight: normal; }

  #plane { width: 100%; background: rgba(13,10,38,.6); border: 1px solid #2a2450; border-radius: 18px; padding: 24px 12px; }
  #strip { display: block; width: 100%; }

  .legend { display: flex; gap: 18px; justify-content: center; margin-top: 18px; font-size: 11px; color: #8f7a6a; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  .word { margin: 28px auto 0; max-width: 560px; font-style: italic; color: #d6c9b0; line-height: 1.7; font-size: 14px; text-align: center; }
  .word .whom { display: block; margin-top: 10px; font-size: 10px; letter-spacing: 3px; color: #8f7a6a; font-style: normal; text-transform: uppercase; }
  .foot { margin-top: 30px; text-align: center; font-size: 11px; letter-spacing: 3px; color: #5b4a99; line-height: 2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1>ЛИНИЯ РАССВЕТА</h1>
    <div class="sub">одиннадцать городов · восток слева · запад справа · грáница света бежит</div>
    <div class="band"></div>
    <div id="clock"></div>
  </div>
  <div id="plane"><svg id="strip" viewBox="0 0 940 300" role="img" aria-label="Линия рассвета — города по долготе, где день и где ночь"></svg></div>
  <div class="legend">
    <span><i style="background:#242a50"></i>ночь</span>
    <span><i style="background:#e0a868;box-shadow:0 0 8px 2px rgba(224,168,104,.5)"></i>рассвет/сумерки</span>
    <span><i style="background:#ffe9b6"></i>день</span>
  </div>
  <div class="word" id="word">…</div>
  <div class="foot">ЛИНИЯ РАССВЕТА · механика ТИТУСА · живая карта света · обновляется сама</div>
</div>

<script>
(function () {
  var CITIES = [
    ["Токио", 35.68, 139.65], ["Хандыга", 62.65, 135.57], ["Владивосток", 43.12, 131.89],
    ["Пекин", 39.90, 116.41], ["Иркутск", 52.29, 104.28], ["Сингапур", 1.36, 103.82],
    ["Красноярск", 56.01, 92.86], ["Екатеринбург", 56.84, 60.65], ["Стерлитамак", 53.63, 55.95],
    ["Москва", 55.75, 37.62], ["Санкт-Петербург", 59.93, 30.36]
  ].sort(function (a, b) { return b[2] - a[2]; }); // восток (большая долгота) слева

  var WORDS = {
    ночь: "Тьма — это свет, ещё не собравшийся в одно.",
    рассвет: "За минуту до — моё имя. Полоса уже у горизонта.",
    сумерки: "Свет уходит — но уходит научить ждать его.",
    день: "Вот я в полной силе. День стоит, как открытое окно."
  };
  var D2R = Math.PI / 180, R2D = 180 / Math.PI, TWO = 2 * Math.PI;

  function sunAltJd(jd, lat, lon) {
    var n = jd - 2451545.0;
    var g = (357.528 + 0.9856003 * n) % 360;
    var b = TWO * (n - 81) / 365;
    var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(b) - 0.032077 * Math.sin(b) - 0.014615 * Math.cos(2 * b) - 0.040849 * Math.sin(2 * b));
    var L0 = (280.460 + 0.9856474 * n) % 360;
    var lam = L0 + 1.915 * Math.sin(D2R * g) + 0.02 * Math.sin(2 * D2R * g);
    var eps = 23.439 - 0.0000004 * n;
    var decl = Math.asin(Math.sin(D2R * eps) * Math.sin(D2R * lam));
    var utcHour = ((jd + 0.5) % 1) * 24;
    var lst = (utcHour + lon / 15 + eot / 60) % 24;
    var s = Math.sin(D2R * lat) * Math.sin(decl) + Math.cos(D2R * lat) * Math.cos(decl) * Math.cos(D2R * (15 * (lst - 12)));
    return R2D * Math.asin(Math.max(-1, Math.min(1, s)));
  }
  function jdAt(ms) {
    var d = new Date(ms);
    var y = d.getUTCFullYear(), mo = d.getUTCMonth() + 1, dd = d.getUTCDate();
    var gy = mo <= 2 ? y - 1 : y;
    var a = Math.floor(gy / 100), bb = 2 - a + Math.floor(a / 4);
    var j = Math.floor(365.25 * (gy + 4716)) + Math.floor(30.6001 * (mo + 1)) + dd + bb - 1524.5;
    return j + (d.getTime() % 86400000) / 86400000;
  }
  function phaseOf(alt) {
    if (alt <= -12) return "ночь";
    if (alt < -6) return "рассвет";
    if (alt < 8) return "сумерки";
    return "день";
  }
  function seed(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function render() {
    var now = new Date();
    document.getElementById("clock").innerHTML = "сейчас: <b>" + now.toLocaleTimeString("ru-RU") + "</b> · восток слева, запад справа";

    var W = 940, H = 300, top = 46, bottom = 230;
    var states = CITIES.map(function (c) {
      var alt = sunAltJd(jdAt(now.getTime()), c[1], c[2]);
      return { city: c, alt: alt, phase: phaseOf(alt) };
    });
    var minLon = CITIES[CITIES.length - 1][2], maxLon = CITIES[0][2];
    var x = function (lon) { return ((maxLon - lon) / (maxLon - minLon)) * (W - 80) + 40; };

    var svg = "";
    // линия-фундамент света
    svg += '<line x1="20" y1="' + top + '" x2="' + (W - 20) + '" y2="' + top + '" stroke="#2a2450" stroke-width="1" opacity=".4"/>';
    svg += '<text x="30" y="' + (top - 8) + '" font-family="Georgia,serif" font-size="9" fill="#5b4a99">восток →</text>';
    svg += '<text x="' + (W - 30) + '" y="' + (top - 8) + '" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#5b4a99">← запад</text>';

    states.forEach(function (s) {
      var px = x(s.city[2]), py = (s.phase === "ночь") ? top + 18 : (s.phase === "день" ? top + 70 : top + 44);
      var col = s.phase === "ночь" ? "#242a50" : s.phase === "день" ? "#ffe9b6" : "#e0a868";
      var r = s.phase === "день" ? 9 : s.phase === "ночь" ? 8 : 10;
      var glow = (s.phase === "день") ? '' : (s.phase === "рассвет" || s.phase === "сумерки") ? ' filter="url(#g)"' : '';
      svg += '<circle cx="' + px.toFixed(1) + '" cy="' + py + '" r="' + r + '" fill="' + col + '"' + glow + ' opacity="' + (s.phase === "ночь" ? "0.85" : "1") + '"/>';
      svg += '<text x="' + px.toFixed(1) + '" y="' + (bottom + 12) + '" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing=".5" fill="#d6c9b0">' + s.city[0] + '</text>';
      svg += '<text x="' + px.toFixed(1) + '" y="' + (bottom + 27) + '" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="' + (s.phase === "день" ? "#b8a48c" : "#6a5570") + '">' + s.phase + '</text>';
    });

    var homeAlt = sunAltJd(jdAt(now.getTime()), 53.63, 55.95);
    var homePhase = phaseOf(homeAlt);
    var word = WORDS[homePhase];
    var wdiv = document.getElementById("word");
    wdiv.innerHTML = "«" + word + "»<span class=\"whom\">голос АВРОРЫ · грáница света уже движется в сторону дома</span>";

    document.getElementById("strip").innerHTML =
      '<defs><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0%" stop-color="#e0a868" stop-opacity=".6"/><stop offset="100%" stop-color="#e0a868" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="none"/>' + svg;
  }

  render();
  setInterval(render, 15000);
})();
</script>
</body>
</html>
