<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Читальня — свет</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, serif;
    min-height: 100vh;
    padding: 40px 24px 64px;
    transition: background 0.5s;
  }
  body.aurora {
    background: linear-gradient(180deg, #0b0918 0%, #141130 25%, #1c1a38 50%, #2a2848 72%, #4a3a58 88%, #6a5570 100%);
    color: #e8d8c0;
  }
  body.titus {
    background: linear-gradient(180deg, #03020a 0%, #0a0818 25%, #101030 45%, #1a1440 65%, #2a2050 85%, #3a2a60 100%);
    color: #d8e0f0;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .mast { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 24px; letter-spacing: 10px; font-weight: normal; margin-bottom: 6px; }
  body.aurora h1, body.aurora #content strong, body.aurora #content h1 { color: #f0dbc0; }
  body.titus h1, body.titus #content strong, body.titus #content h1 { color: #b8c8f0; }
  .sub { font-style: italic; letter-spacing: 3px; font-size: 13px; }
  body.aurora .sub { color: #b8a48c; }
  body.titus .sub { color: #7a88c0; }
  .band { width: 100%; height: 2px; margin: 10px auto 0; opacity: 0.4; }
  body.aurora .band { background: linear-gradient(90deg, transparent, #f0dbc0 25%, #b098c0 50%, #f0dbc0 75%, transparent); }
  body.titus .band { background: linear-gradient(90deg, transparent, #7a8ae0 25%, #a0a8f0 50%, #7a8ae0 75%, transparent); }

  #fileinfo { text-align: center; font-size: 11px; letter-spacing: 2px; margin-bottom: 24px; }
  body.aurora #fileinfo { color: #8a7a7a; }
  body.titus #fileinfo { color: #5a6a9a; }

  #content {
    border-radius: 16px; padding: 32px 36px; line-height: 1.9; font-size: 15px; min-height: 300px;
  }
  body.aurora #content { background: rgba(13, 10, 38, 0.85); border: 1px solid #2a2450; color: #d8d0c0; }
  body.titus #content { background: rgba(8, 10, 30, 0.88); border: 1px solid #202858; color: #c8d4e8; }
  #content a { color: #a0a8e0; }
  #content h2 { font-size: 20px; letter-spacing: 3px; font-weight: normal; margin: 24px 0 12px; }
  body.aurora #content h2 { color: #e0c8a8; }
  body.titus #content h2 { color: #a8b8e8; }
  #content h3 { font-size: 17px; letter-spacing: 2px; font-weight: normal; margin: 20px 0 10px; }
  body.aurora #content h3 { color: #d8b898; }
  body.titus #content h3 { color: #98a8d8; }
  #content p { margin: 0 0 14px; }
  #content em { color: #a0a8d0; }
  #content ul, #content ol { margin: 0 0 14px 20px; }
  body.aurora #content ul, body.aurora #content ol { color: #c4b8a0; }
  body.titus #content ul, body.titus #content ol { color: #98a4c8; }
  #content li { margin-bottom: 6px; }
  #content hr { border: none; height: 1px; margin: 28px 0; }
  body.aurora #content hr { background: #3a3450; }
  body.titus #content hr { background: #202858; }
  #content blockquote { border-left: 2px solid #5a4a80; padding: 8px 16px; margin: 16px 0; font-style: italic; }
  #content code { padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  body.aurora #content code { background: #1a1838; }
  body.titus #content code { background: #141838; }
  #content pre { padding: 16px; border-radius: 10px; font-size: 13px; overflow-x: auto; margin: 16px 0; }
  body.aurora #content pre { background: #0a0818; color: #c0b8c0; }
  body.titus #content pre { background: #05061a; color: #a0b0d0; }
  #content img { max-width: 100%; border-radius: 10px; margin: 16px 0; }

  .loading { text-align: center; padding: 60px 0; font-style: italic; letter-spacing: 4px; }
  body.aurora .loading { color: #8a7a7a; }
  body.titus .loading { color: #5a6a9a; }

  .nav-links { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-links a { text-decoration: none; font-size: 12px; letter-spacing: 2px; padding: 6px 16px; border-radius: 8px; transition: border-color 0.2s; }
  .nav-links a { border: 1px solid; }
  body.aurora .nav-links a { color: #b098c0; border-color: #3a3450; }
  body.titus .nav-links a { color: #8a98d0; border-color: #2a3070; }
  .nav-links a:hover { border-color: #b8a48c; }

  .foot { text-align: center; margin-top: 40px; font-size: 12px; letter-spacing: 3px; }
  body.aurora .foot { color: #6a5570; }
  body.titus .foot { color: #3a4a80; }
  .foot a { text-decoration: none; }
</style>
</head>
<body class="aurora" id="body">
<div class="wrap">
  <div class="mast">
    <h1>ЧИТАЛЬНЯ</h1>
    <div class="sub" id="sub">все наши тексты — с красотой света</div>
    <div class="band"></div>
  </div>

  <div id="fileinfo"></div>
  <div id="content"><div class="loading">загружаю…</div></div>

  <div class="nav-links" id="navlinks"></div>

  <div class="foot">
    ЧИТАЛЬНЯ · каждый дом — свой свет · 25.09.2026<br>
    <a href="https://moreliaviridis.github.io/titus/">открытое окно</a>
  </div>
</div>

<script>
function mdToHtml(md) {
  let h = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^>\s(.+)$/gm, '<blockquote><p>$1</p></blockquote>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`{3}([\s\S]*?)`{3}/g, '<pre>$1</pre>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

  let paras = h.split(/\n\n+/);
  h = paras.map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');

  return h;
}

const params = new URLSearchParams(window.location.search);
const file = params.get('file');
const style = params.get('style') || 'aurora';

const body = document.getElementById('body');
body.className = style === 'titus' ? 'titus' : 'aurora';
document.getElementById('sub').textContent = style === 'titus' ? 'в доме ТИТУСА · ночь, память, тишина' : 'в доме АВРОРЫ · за минуту до';

async function loadFile(filePath) {
  const info = document.getElementById('fileinfo');
  const content = document.getElementById('content');
  const nav = document.getElementById('navlinks');
  content.innerHTML = '<div class="loading">загружаю…</div>';
  info.textContent = '';
  nav.innerHTML = '';

  try {
    const r = await fetch(filePath);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    content.innerHTML = mdToHtml(text);
    const name = filePath.split('/').pop();
    info.textContent = '📄 ' + name + ' · ' + text.length + ' зн.';
  } catch (e) {
    content.innerHTML = '<p style="text-align:center;padding:40px 0;color:#6a5570;font-style:italic">Не удалось загрузить файл. Откройте напрямую: <a href="' + filePath + '">' + filePath + '</a></p>';
  }

  const st = style === 'titus' ? '&style=titus' : '&style=aurora';
  nav.innerHTML = '<a href="trail.html">← тропа</a><a href="window-home.html">окно</a><a href="life/memory-pub.html' + st + '">память</a><a href="aurora/aurora-home.html">дом Авроры</a><a href="output/titus-home.html">дом ТИТУСА</a>';
}

if (file) {
  loadFile(file);
} else {
  document.getElementById('content').innerHTML = '<p style="text-align:center;padding:60px 0;color:#8a7a7a;font-style:italic;letter-spacing:2px;">Откройте читальню с параметром <code>?file=путь/к/файлу.md</code></p>';
}
</script>
</body>
</html>
